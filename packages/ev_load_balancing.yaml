# =====================================================================
#  packages/ev_load_balancing.yaml  —  versie 3 (zonder Ratio Sense)
#  Dynamische load balancing voor 2× Ratio Solar via OCPP (lbbrhzn)
#  op basis van de HomeWizard P1-meter. Huisaansluiting 3×25A.
#
#  Kernidee: "dodemansknop" op de lader zelf.
#   - Elke lader krijgt EEN dynamisch profiel op connector 1 (stackLevel 0;
#     de Ratio-laders weigeren stackLevel >= 1) met twee periodes:
#     periode 0 = gevraagde stroom, periode 1 (na 60 s, zonder einde) =
#     terugvalstroom (standaard 6 A). HA ververst het elke 20 s.
#     Een apart basisprofiel werkt niet: de lader neemt het LAAGSTE profiel.
#   - Valt HA, de Pi, wifi, OCPP of de P1-meter weg, dan stopt het
#     verversen en valt de lader binnen 60 s vanzelf terug op het
#     terugvalstroom. Daar is géén HA voor nodig.
#
#  Lagen:
#   1. Snel omlaag bij elke P1-meting (officiële HomeWizard-integratie
#      ~5 s; met de websocket-integratie op DSMR5 ~1 s)
#   2. Langzaam omhoog: max +2 A per 10 s, 1 A buffer
#   3. Huislasten afschakelen (afschakellijst) EERST bij tekort/overbelasting;
#      pas als de hele lijst uit staat gaan de laders terug (zie ev_lb_dynamisch);
#      herstel in omgekeerde volgorde
#   3b. Noodstop: fase > 25 A gedurende 3 s → laders 0 A en in één keer
#      genoeg huislasten uit; melding (+ kritieke melding na 20 s)
#
#  Ontwerpdoel 3×25A:
#   - continu nooit boven 23 A per fase (regelgrens = 25 − 2 A marge)
#   - boven 25 A: binnen ~10–15 s terug onder de grens (meetinterval
#     P1 + 3 s bevestiging + reactietijd lader/apparaat)
#   - korte inschakelpieken (< 3 s) worden genegeerd; die kan de
#     hoofdzekering (gG, traag) ruimschoots aan
#   4. P1 verouderd (>30 s) → niet meer verversen → terugval op basis
#   5. Op de lader: de laatste periode van het profiel = terugval (dodemansknop)
#   6. Op de lader: maximum_current eenmalig op de max van die lader
#      (Sonia 16 A, Rob 9 A) als harde bovengrens — ingesteld in de Ratio-app
#   7. Voorrang: EV-Lader Sonia krijgt ruimte als eerste en laadt zo
#      hoog als kan; Rob krijgt de rest en wijkt zo nodig
#
#  EERST TESTEN of je Ratio verlopende profielen respecteert (zie chat).
#  Regels met  controleren tegen je eigen entity-id's.
# =====================================================================

input_boolean:
  ev_lb_actief:
    name: "EV load balancing actief"
    icon: mdi:scale-balance
  # Weergave-vlag voor het dashboard: de knop 'Opladen uitzetten' is ingedrukt.
  # Gaat uit zodra het laden start of de boost aangaat.
  ev_sonia_opladen_uitgezet:
    name: "EV-Sonia – opladen uitgezet (knop)"
    icon: mdi:battery-off
  # Prijssturing overslaan tot de vertrektijd (knop 'Nacht overslaan'); wordt
  # automatisch gewist op de vertrektijd. Boost en PV-laden blijven werken.
  ev_sonia_nacht_overslaan:
    name: "EV-Sonia – aankomende nacht overslaan"
    icon: mdi:weather-night-off
  ev_rob_opladen_uitgezet:
    name: "EV-Rob – opladen uitgezet (knop)"
    icon: mdi:battery-off
  # 'Accu GRATIS opladen met de zon maar langzamer' (knop): prijssturing uit, laden op
  # PV-overschot blijft werken. Gewist op de vertrektijd, bij boost en bij
  # 'weer volgens planning laden'. Wordt NIET gewist door het starten van het laden.
  ev_sonia_alleen_zon:
    name: "EV-Sonia – alleen gratis laden op zonnepanelen (knop)"
    icon: mdi:solar-power
  ev_rob_alleen_zon:
    name: "EV-Rob – alleen gratis laden op zonnepanelen (knop)"
    icon: mdi:solar-power
  # Prijssturing overslaan tot de vertrektijd (knop 'Nacht overslaan'); wordt
  # automatisch gewist op de vertrektijd. Boost en PV-laden blijven werken.
  ev_rob_nacht_overslaan:
    name: "EV-Rob – aankomende nacht overslaan"
    icon: mdi:weather-night-off

input_text:
  # Laatst gemelde id_tag per lader (blijft staan als de sessie eindigt)
  ev_sonia_laatste_id_tag:
    name: "EV-Sonia laatste id_tag"
    max: 64
  ev_rob_laatste_id_tag:
    name: "EV-Rob laatste id_tag"
    max: 64

input_datetime:
  # Laatste keer dat het setpunt van 0 A omhoog ging (voor 'laden hervatten')
  ev_sonia_nul_verlaten:
    name: "EV-Sonia – laatst van 0 A omhoog"
    has_date: true
    has_time: true
  ev_rob_nul_verlaten:
    name: "EV-Rob – laatst van 0 A omhoog"
    has_date: true
    has_time: true
  # Vastgelegd (aaneengesloten) laadblok per lader; zie automation ev_blok_vastleggen
  ev_sonia_blok_start:
    name: "EV-Sonia – start laadblok"
    has_date: true
    has_time: true
  ev_rob_blok_start:
    name: "EV-Rob – start laadblok"
    has_date: true
    has_time: true

input_select:
  # Op welke fase(n) laadt de auto aan deze lader? Voor 1-fase auto's: de fase
  # waarop de auto op de P1-meter verschijnt (de Passat verscheen op L2, aan
  # beide laders). Wordt bewaard (geen initial); bij nieuwe auto aanpassen.
  ev_lb_rob_fase:
    name: "EV LB – fase(n) auto aan lader Rob"
    options: ["Automatisch", "L1", "L2", "L3", "3-fase"]
    icon: mdi:sine-wave
  ev_lb_sonia_fase:
    name: "EV LB – fase(n) auto aan lader Sonia"
    options: ["Automatisch", "L1", "L2", "L3", "3-fase"]
    icon: mdi:sine-wave

input_number:
  # Hoeveel van de goedkoopste uren (tot de vertrektijd) mag deze lader laden?
  # Geen initial: wordt bewaard. 6 u x 3,5 kW = 21 kWh.
  ev_sonia_fase_bewijs:
    name: "EV-Sonia – bewijsteller 1-fase (intern)"
    min: 0
    max: 20
    step: 1
    mode: box
  ev_rob_fase_bewijs:
    name: "EV-Rob – bewijsteller 1-fase (intern)"
    min: 0
    max: 20
    step: 1
    mode: box
  ev_lb_deel_max_sonia:
    name: "EV LB – max stroom Sonia bij samen laden (nacht)"
    min: 6
    max: 16
    step: 1
    unit_of_measurement: A
    mode: box
  ev_lb_deel_max_rob:
    name: "EV LB – max stroom Rob bij samen laden (nacht)"
    min: 6
    max: 16
    step: 1
    unit_of_measurement: A
    mode: box
  # Te laden kWh voor de PLANNING (alleen om de starttijd te kiezen); geladen wordt
  # tot de auto zelf stopt of tot de vertrektijd.
  ev_lb_rob_plan_kwh:
    name: "EV LB – te laden kWh voor planning Rob"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: kWh
    mode: box
  ev_lb_sonia_plan_kwh:
    name: "EV LB – te laden kWh voor planning Sonia"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: kWh
    mode: box
  ev_lb_zekering:
    name: "EV LB – hoofdzekering per fase"
    min: 16
    max: 40
    step: 1
    initial: 25
    unit_of_measurement: A
    mode: box
  # Zonstand: een 3-fase lader mag al starten (op 6 A = 4,1 kW) als er minstens dit restoverschot
  # is; het tekort komt uit het net. Geen 'initial' (dat reset de waarde bij elke herstart).
  # Waarde >= 4200 W = uit (dan start hij pas bij het volle 4,1 kW overschot).
  ev_lb_zon_min_3fase:
    name: "EV LB – zonstand: 3-fase lader start vanaf restoverschot"
    min: 500
    max: 6000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:solar-power
  ev_lb_marge:
    name: "EV LB – veiligheidsmarge"
    min: 0
    max: 5
    step: 0.5
    initial: 2
    unit_of_measurement: A
    mode: box
  # Sonia heeft voorrang: krijgt ruimte als eerste en mag tot haar max.
  # 16 A 3-fase = 11 kW. Kan de auto 22 kW, dan hoger (max 23 A bij 3×25A).
  ev_lb_max_sonia:
    name: "EV LB – max stroom EV-Lader Sonia"
    min: 6
    max: 23
    step: 1
    initial: 16   # gelijk aan max in Ratio-app (anders loopt het setpunt boven de echte stroom)
    unit_of_measurement: A
    mode: box
  ev_lb_max_rob:
    name: "EV LB – max stroom EV-Lader Rob"
    min: 6
    max: 23
    step: 1
    initial: 16   # gelijk aan max in Ratio-app (anders loopt het setpunt boven de echte stroom)
    unit_of_measurement: A
    mode: box
  # Ondergrens voor Rob als Sonia meer wil: 6 = Rob blijft langzaam laden,
  # 0 = Rob pauzeert volledig zodat Sonia alles krijgt.
  ev_lb_min_rob:
    name: "EV LB – min stroom Rob bij voorrang Sonia"
    min: 0
    max: 16
    step: 1
    initial: 6
    unit_of_measurement: A
    mode: box
  # Stroom waarop de laders terugvallen als HA niets meer stuurt.
  # 6 A = laden gaat door, langzaam. 0 A = laden stopt helemaal (veiligst).
  ev_lb_terugval:
    name: "EV LB – terugvalstroom zonder HA"
    min: 0
    max: 10
    step: 6
    initial: 6
    unit_of_measurement: A
    mode: box
  # Hoeveel lasten uit de afschakellijst nu zijn afgeschakeld (0 = geen)
  ev_lb_afschakel_niveau:
    name: "EV LB – afschakelniveau huislasten"
    min: 0
    max: 10
    step: 1
    mode: box
  # Hulpteller: hoeveel ampère er in de huidige afschakelronde al uit is gezet
  ev_lb_afgeschakeld_a:
    name: "EV LB – afgeschakeld in deze ronde"
    min: 0
    max: 200
    step: 0.5
    unit_of_measurement: A
    mode: box
  ev_lb_setpunt_rob:
    name: "EV LB – setpunt EV-Lader Rob"
    min: 0
    max: 32
    step: 1
    unit_of_measurement: A
  ev_lb_setpunt_sonia:
    name: "EV LB – setpunt EV-Lader Sonia"
    min: 0
    max: 32
    step: 1
    unit_of_measurement: A

template:
  - sensor:
      - name: "EV LB stroom L1"
        unique_id: ev_lb_stroom_l1
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        availability: "{{ has_value('sensor.p1_meter_power_phase_1') }}"
        state: >
          {% set p = states('sensor.p1_meter_power_phase_1') | float(0) %}
          {% set u = states('sensor.p1_meter_voltage_phase_1') | float(230) %}
          {{ (p / ([u, 200] | max)) | round(2) }}
      - name: "EV LB stroom L2"
        unique_id: ev_lb_stroom_l2
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        availability: "{{ has_value('sensor.p1_meter_power_phase_2') }}"
        state: >
          {% set p = states('sensor.p1_meter_power_phase_2') | float(0) %}
          {% set u = states('sensor.p1_meter_voltage_phase_2') | float(230) %}
          {{ (p / ([u, 200] | max)) | round(2) }}
      - name: "EV LB stroom L3"
        unique_id: ev_lb_stroom_l3
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        availability: "{{ has_value('sensor.p1_meter_power_phase_3') }}"
        state: >
          {% set p = states('sensor.p1_meter_power_phase_3') | float(0) %}
          {% set u = states('sensor.p1_meter_voltage_phase_3') | float(230) %}
          {{ (p / ([u, 200] | max)) | round(2) }}
      - name: "EV LB ruimte"
        unique_id: ev_lb_ruimte
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        availability: >
          {{ has_value('sensor.ev_lb_stroom_l1') and has_value('sensor.ev_lb_stroom_l2')
             and has_value('sensor.ev_lb_stroom_l3') }}
        state: >
          {% set grens = states('input_number.ev_lb_zekering') | float(25)
                       - states('input_number.ev_lb_marge') | float(2) %}
          {% set i = [ states('sensor.ev_lb_stroom_l1') | float(0),
                       states('sensor.ev_lb_stroom_l2') | float(0),
                       states('sensor.ev_lb_stroom_l3') | float(0) ] %}
          {{ (grens - (i | max)) | round(1) }}

      # ---------------------------------------------------------------
      # AFSCHAKELLIJST huislasten — in volgorde van afschakelen.
      # Bovenaan = minst merkbaar. Herstel gaat in omgekeerde volgorde.
      #   type:   switch (aan/uit) of select (optie 'uit' / vorige stand)
      #   ampere: geschatte stroom op de zwaarst belaste fase (voor herstel)
      # Opgeschoond 20-10-2026: alleen entiteiten die in HA bestaan. Zijn
      # verwijderd (bestonden niet): stekkerbatterij wasmachine/droger, ZWE-
      # bijverwarming (Luxtronik toont geen schakelaar), droger, wasmachine.
      # Warmtepomp (warm water, verwarming) eruit gehaald 20-10-2026: bij een
      # korte noodstop zette dat de warmtepomp onnodig op Off.
      # Voeg een regel pas toe als de entiteit bestaat.
      # ---------------------------------------------------------------
      - name: "EV LB afschakellijst"
        unique_id: ev_lb_afschakellijst
        state: "{{ 'ok' }}"
        attributes:
          lasten: >
            {{ [
              {'naam': 'Fietsaccu',               'type': 'switch', 'entity': 'switch.fietsaccu_2',                    'ampere': 1}
            ] }}

  # -------------------------------------------------------------------
  # FASEDETECTIE (27-10-2026): bij de start van het laden meten of de auto op 1 fase (en welke)
  # of op 3 fasen laadt, uit de stap in het P1-vermogen per fase. Elke 10 s wordt het P1-vermogen in
  # een ring bewaard (laatste 80 s). Bij de overgang naar 'Charging' wordt de stand van de 2 voorgaande
  # metingen als basis genomen; 20 s later wordt de stap per fase beoordeeld: alleen fases met >= 50 %
  # van de grootste stap (en >= 500 W) tellen mee. 1 fase = die fase, 3 fases = '3-fase'.
  # Alleen als de andere lader in die tijd niet veranderde (laadde allebei niet, of laadde allebei
  # zonder statuswissel of stroomverandering); anders 'onbekend' (de regeling rekent dan voorzichtig
  # met 3-fase). Resultaat blijft staan tot de auto wordt losgekoppeld (Available/Finishing).
  # Het is een ring met 10 s-resolutie, dus uitgesloten van de recorder (configuration.yaml).
  # -------------------------------------------------------------------
  - triggers:
      - trigger: time_pattern
        seconds: "/10"
    sensor:
      - name: "EV fasedetectie"
        unique_id: ev_fasedetectie
        icon: mdi:sine-wave
        state: "{{ 'ok' }}"
        attributes:
          data: >-
            {%- set nu = now().timestamp() | int -%}
            {%- set vorig = ((this.attributes.get('data') if this is defined and this is not none and this.attributes is mapping else none) or {}) -%}
            {%- set oud = vorig.get('buf', []) -%}
            {%- set pnu = [states('sensor.p1_meter_power_phase_1'), states('sensor.p1_meter_power_phase_2'), states('sensor.p1_meter_power_phase_3')] -%}
            {%- if (pnu | select('is_number') | list | count) < 3 -%}
              {{ {'buf': oud, 'rob': vorig.get('rob', {}), 'sonia': vorig.get('sonia', {})} }}
            {%- else -%}
              {%- set p = pnu | map('float') | list -%}
              {%- set buf = (oud + [[nu] + p])[-8:] -%}
              {%- set cfg = {'rob': ['sensor.ev_rob_status_connector', 'sensor.ev_sonia_status_connector', 'input_number.ev_lb_setpunt_sonia'],
                             'sonia': ['sensor.ev_sonia_status_connector', 'sensor.ev_rob_status_connector', 'input_number.ev_lb_setpunt_rob']} -%}
              {%- set uit = namespace(d={}) -%}
              {%- for naam, ent in cfg.items() -%}
                {%- set rec = vorig.get(naam, {}) -%}
                {%- set st = states(ent[0]) -%}
                {%- set fase = rec.get('fase', 'onbekend') -%}
                {%- set t0 = rec.get('t0', 0) -%}
                {%- set basis = rec.get('basis', []) -%}
                {%- set bts = rec.get('bts', 0) -%}
                {%- set ochg = rec.get('ochg', false) -%}
                {%- set vst = rec.get('st', '') -%}
                {%- if st in ['Available', 'Finishing', 'unavailable', 'unknown', 'Faulted'] -%}
                  {%- set fase = 'onbekend' -%}{%- set t0 = 0 -%}{%- set basis = [] -%}{%- set bts = 0 -%}
                {%- elif st == 'Charging' and vst != 'Charging' and fase == 'onbekend' and (oud | count) >= 2 -%}
                  {%- set a = oud[-2] -%}{%- set b = oud[-1] -%}
                  {%- set basis = [((a[1] + b[1]) / 2) | round(0), ((a[2] + b[2]) / 2) | round(0), ((a[3] + b[3]) / 2) | round(0)] -%}
                  {%- set bts = a[0] -%}
                  {%- set t0 = nu -%}
                  {%- set ochg = states(ent[1]) == 'Charging' -%}
                {%- endif -%}
                {%- if st == 'Charging' and fase == 'onbekend' and t0 > 0 and (basis | count) == 3 and (nu - t0) >= 20 -%}
                  {%- set e_st = states.sensor | selectattr('entity_id', 'eq', ent[1]) | first -%}
                  {%- set e_sp = states.input_number | selectattr('entity_id', 'eq', ent[2]) | first -%}
                  {%- set ochg_nu = states(ent[1]) == 'Charging' -%}
                  {# Stabiel: de andere lader laadde bij de start en nu allebei niet, of laadde allebei en veranderde sinds vóór de start niet (status en laadstroom). #}
                  {%- set stabiel = e_st is defined and e_sp is defined and ochg_nu == ochg
                                    and (not ochg_nu or (e_st.last_changed.timestamp() < bts and e_sp.last_changed.timestamp() < bts)) -%}
                  {%- if (nu - t0) > 120 or not stabiel -%}
                    {%- set basis = [] -%}{%- set t0 = 0 -%}
                  {%- else -%}
                    {%- set l1 = buf[-1] -%}{%- set l2 = buf[-2] -%}
                    {%- set d = [((l1[1] + l2[1]) / 2) - basis[0], ((l1[2] + l2[2]) / 2) - basis[1], ((l1[3] + l2[3]) / 2) - basis[2]] -%}
                    {%- set dmax = d | max -%}
                    {%- if dmax >= 900 -%}
                      {%- set n = d | select('ge', [dmax * 0.5, 500] | max) | list | count -%}
                      {%- if n == 3 -%}{%- set fase = '3-fase' -%}
                      {%- elif n == 1 -%}{%- set fase = ['L1', 'L2', 'L3'][d.index(dmax)] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
                {%- set uit.d = dict(uit.d, **{naam: {'st': st, 'fase': fase, 't0': t0, 'bts': bts, 'basis': basis, 'ochg': ochg}}) -%}
              {%- endfor -%}
              {{ {'buf': buf, 'rob': uit.d['rob'], 'sonia': uit.d['sonia']} }}
            {%- endif -%}

  - sensor:
      # Fase waarmee de regeling rekent: de keuze in input_select.ev_lb_<lader>_fase, of bij
      # 'Automatisch' de gemeten fase (onbekend = voorzichtig 3-fase).
      - name: "EV LB Rob fase actief"
        unique_id: ev_lb_rob_fase_actief
        icon: mdi:sine-wave
        state: >-
          {%- set k = states('input_select.ev_lb_rob_fase') -%}
          {%- if k == 'Automatisch' -%}
            {%- set d = ((state_attr('sensor.ev_fasedetectie', 'data') or {}).get('rob', {})).get('fase', 'onbekend') -%}
            {{ d if d in ['L1', 'L2', 'L3', '3-fase'] else '3-fase' }}
          {%- else -%}{{ k if k in ['L1', 'L2', 'L3', '3-fase'] else '3-fase' }}{%- endif -%}
      - name: "EV LB Sonia fase actief"
        unique_id: ev_lb_sonia_fase_actief
        icon: mdi:sine-wave
        state: >-
          {%- set k = states('input_select.ev_lb_sonia_fase') -%}
          {%- if k == 'Automatisch' -%}
            {%- set d = ((state_attr('sensor.ev_fasedetectie', 'data') or {}).get('sonia', {})).get('fase', 'onbekend') -%}
            {{ d if d in ['L1', 'L2', 'L3', '3-fase'] else '3-fase' }}
          {%- else -%}{{ k if k in ['L1', 'L2', 'L3', '3-fase'] else '3-fase' }}{%- endif -%}

  # -------------------------------------------------------------------
  # Afgeleid laadvermogen en -stroom Rob: de lader meldt alleen de
  # energieteller (Energy.Active.Import.Register), geen stroom of vermogen.
  # Vermogen = verschil tussen twee OPEENVOLGENDE meterstanden gedeeld door de
  # tijd tussen die twee standen (hun eigen tijdstempels; de teller springt per
  # 10 s bij Rob, per 60 s bij Sonia). Bij korte intervallen licht uitgemiddeld.
  # Staat de teller > 150 s stil, dan is het vermogen 0.
  # Stroom = vermogen / (230 V x aantal fasen); fase(n) in sensor.ev_lb_rob_fase_actief.
  # -------------------------------------------------------------------
  - triggers:
      - trigger: state
        entity_id: sensor.ev_rob_energy_active_import_register
      - trigger: time_pattern
        seconds: "/15"
    sensor:
      - name: "EV Rob vermogen"
        unique_id: ev_rob_vermogen_afgeleid
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set oud = this.state | float(0) if this is defined and this.state not in ['unknown', 'unavailable'] else 0 %}
          {% if trigger.platform == 'state' %}
            {% set a = trigger.from_state.state | float(none) if trigger.from_state else none %}
            {% set b = trigger.to_state.state | float(none) if trigger.to_state else none %}
            {% set dt = (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() if (trigger.from_state and trigger.to_state) else none %}
            {% if a is number and b is number and dt is number and dt >= 5 and b > a %}
              {% set inst = (b - a) * 3600000 / dt %}
              {{ ((0.5 * oud + 0.5 * inst) if dt < 30 and oud > 0 else inst) | round(0) }}
            {% else %}{{ oud }}{% endif %}
          {% else %}
            {% set leeftijd = (now() - states.sensor.ev_rob_energy_active_import_register.last_changed).total_seconds() if states.sensor.ev_rob_energy_active_import_register else 9999 %}
            {{ 0 if leeftijd > 150 else oud }}
          {% endif %}

  - sensor:
      - name: "EV Rob stroom"
        unique_id: ev_rob_stroom_afgeleid
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        availability: "{{ has_value('sensor.ev_rob_vermogen') }}"
        state: >
          {% set n = 3 if is_state('sensor.ev_lb_rob_fase_actief', '3-fase') else 1 %}
          {{ (states('sensor.ev_rob_vermogen') | float(0) / (230 * n)) | round(1) }}

  # -------------------------------------------------------------------
  # Afgeleid laadvermogen en -stroom Sonia: de lader meldt alleen een energieteller, geen
  # stroom of vermogen. Sinds 28-10-2026 05:14 staat de register-teller stil en loopt alleen de
  # sessieteller (sensor.ev_sonia_energy_session) door; die is hier de bron. Een sprong van
  # > 1 kWh tussen twee metingen (teller-reset/-sprong) wordt genegeerd.
  # Vermogen = verschil tussen twee OPEENVOLGENDE meterstanden gedeeld door de
  # tijd tussen die twee standen (hun eigen tijdstempels; de teller springt per
  # 10 s bij Rob, per 60 s bij Sonia). Bij korte intervallen licht uitgemiddeld.
  # Staat de teller > 150 s stil, dan is het vermogen 0.
  # Stroom = vermogen / (230 V x aantal fasen); fase(n) in sensor.ev_lb_sonia_fase_actief.
  # -------------------------------------------------------------------
  - triggers:
      - trigger: state
        entity_id: sensor.ev_sonia_energy_session
      - trigger: time_pattern
        seconds: "/15"
    sensor:
      - name: "EV Sonia vermogen"
        unique_id: ev_sonia_vermogen_afgeleid
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set oud = this.state | float(0) if this is defined and this.state not in ['unknown', 'unavailable'] else 0 %}
          {% if trigger.platform == 'state' %}
            {% set a = trigger.from_state.state | float(none) if trigger.from_state else none %}
            {% set b = trigger.to_state.state | float(none) if trigger.to_state else none %}
            {% set dt = (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() if (trigger.from_state and trigger.to_state) else none %}
            {% if a is number and b is number and dt is number and dt >= 5 and b > a and (b - a) < 1 %}
              {% set inst = (b - a) * 3600000 / dt %}
              {{ ((0.5 * oud + 0.5 * inst) if dt < 30 and oud > 0 else inst) | round(0) }}
            {% else %}{{ oud }}{% endif %}
          {% else %}
            {% set leeftijd = (now() - states.sensor.ev_sonia_energy_session.last_changed).total_seconds() if states.sensor.ev_sonia_energy_session else 9999 %}
            {{ 0 if leeftijd > 150 else oud }}
          {% endif %}

  - sensor:
      - name: "EV Sonia stroom"
        unique_id: ev_sonia_stroom_afgeleid
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        availability: "{{ has_value('sensor.ev_sonia_vermogen') }}"
        state: >
          {% set n = 3 if is_state('sensor.ev_lb_sonia_fase_actief', '3-fase') else 1 %}
          {{ (states('sensor.ev_sonia_vermogen') | float(0) / (230 * n)) | round(1) }}

  - sensor:
      - name: "EV Rob stroom L1"
        unique_id: ev_rob_stroom_l1
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        availability: "{{ has_value('sensor.ev_rob_stroom') }}"
        state: >
          {% set k = states('sensor.ev_lb_rob_fase_actief') %}
          {{ states('sensor.ev_rob_stroom') | float(0) if k in ['3-fase', 'L1'] else 0 }}
      - name: "EV Rob stroom L2"
        unique_id: ev_rob_stroom_l2
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        availability: "{{ has_value('sensor.ev_rob_stroom') }}"
        state: >
          {% set k = states('sensor.ev_lb_rob_fase_actief') %}
          {{ states('sensor.ev_rob_stroom') | float(0) if k in ['3-fase', 'L2'] else 0 }}
      - name: "EV Rob stroom L3"
        unique_id: ev_rob_stroom_l3
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        availability: "{{ has_value('sensor.ev_rob_stroom') }}"
        state: >
          {% set k = states('sensor.ev_lb_rob_fase_actief') %}
          {{ states('sensor.ev_rob_stroom') | float(0) if k in ['3-fase', 'L3'] else 0 }}

  - sensor:
      - name: "EV Sonia stroom L1"
        unique_id: ev_sonia_stroom_l1
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        availability: "{{ has_value('sensor.ev_sonia_stroom') }}"
        state: >
          {% set k = states('sensor.ev_lb_sonia_fase_actief') %}
          {{ states('sensor.ev_sonia_stroom') | float(0) if k in ['3-fase', 'L1'] else 0 }}
      - name: "EV Sonia stroom L2"
        unique_id: ev_sonia_stroom_l2
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        availability: "{{ has_value('sensor.ev_sonia_stroom') }}"
        state: >
          {% set k = states('sensor.ev_lb_sonia_fase_actief') %}
          {{ states('sensor.ev_sonia_stroom') | float(0) if k in ['3-fase', 'L2'] else 0 }}
      - name: "EV Sonia stroom L3"
        unique_id: ev_sonia_stroom_l3
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        availability: "{{ has_value('sensor.ev_sonia_stroom') }}"
        state: >
          {% set k = states('sensor.ev_lb_sonia_fase_actief') %}
          {{ states('sensor.ev_sonia_stroom') | float(0) if k in ['3-fase', 'L3'] else 0 }}

  - sensor:
      # Nederlandse weergave van de OCPP-status voor het dashboard. Alleen
      # voor weergave; de automatiseringen blijven de Engelse status gebruiken.
      - name: "EV Sonia status NL"
        unique_id: ev_sonia_status_nl
        icon: mdi:ev-plug-type2
        state: >-
          {#- Eerste regel: de knop die als laatste is ingedrukt (de actieve stand); tweede regel:
              wat de lader zelf doet. Direct na een knop een tussentekst: de lader zelf
              reageert pas na 5-15 s. -#}
          {%- set st = states('sensor.ev_sonia_status_connector') -%}
          {%- if st == 'Charging' and is_state('input_boolean.ev_sonia_opladen_uitgezet', 'on') -%}
            {%- set laad = 'Opladen wordt gestopt...' -%}
          {%- elif st in ['Preparing', 'SuspendedEVSE', 'SuspendedEV'] and is_state('input_boolean.ev_sonia_direct_laden', 'on') -%}
            {%- set laad = 'Snel laden wordt gestart...' -%}
          {%- else -%}
            {%- set laad = {'Available': 'Beschikbaar', 'Preparing': 'Aangesloten, wacht op start',
                'Charging': 'Laden', 'SuspendedEVSE': 'Accu NU opladen gepauzeerd door EV-lader',
                'SuspendedEV': 'Gepauzeerd door auto', 'Finishing': 'Afronden',
                'Reserved': 'Gereserveerd', 'Unavailable': 'Lader niet bereikbaar',
                'unavailable': 'Lader niet bereikbaar', 'unknown': 'Lader niet bereikbaar',
                'Faulted': 'Storing op de lader'}.get(st, st) -%}
          {%- endif -%}
          {%- set ns = namespace(ts=0, soort='plan') -%}
          {%- for soort, ent in [('direct', 'input_boolean.ev_sonia_direct_laden'), ('zon', 'input_boolean.ev_sonia_alleen_zon'), ('uit', 'input_boolean.ev_sonia_opladen_uitgezet'), ('nacht', 'input_boolean.ev_sonia_nacht_overslaan')] -%}
            {%- set v = states.input_boolean | selectattr('entity_id', 'eq', ent) | first -%}
            {%- if v is defined and v.state == 'on' and v.last_changed.timestamp() > ns.ts -%}
              {%- set ns.ts = v.last_changed.timestamp() -%}{%- set ns.soort = soort -%}
            {%- endif -%}
          {%- endfor -%}
          {#- 'Accu 's-nachts WEL opladen': de knop zet 'morgen thuis blijven' uit. Alleen als dat op het
              scherm is gedaan (er is een gebruiker bij; het wissen op de vertrektijd door een
              automatisering telt niet) en het de laatste wijziging is. -#}
          {%- set nv = states.input_boolean | selectattr('entity_id', 'eq', 'input_boolean.ev_sonia_nacht_overslaan') | first -%}
          {%- set anders = namespace(ts=0) -%}
          {%- for ent in ['input_boolean.ev_sonia_direct_laden', 'input_boolean.ev_sonia_alleen_zon', 'input_boolean.ev_sonia_opladen_uitgezet'] -%}
            {%- set w = states.input_boolean | selectattr('entity_id', 'eq', ent) | first -%}
            {%- if w is defined and w.last_changed.timestamp() > anders.ts -%}{%- set anders.ts = w.last_changed.timestamp() -%}{%- endif -%}
          {%- endfor -%}
          {%- if ns.soort == 'plan' and nv is defined and nv.state == 'off' and nv.context.user_id is not none and nv.last_changed.timestamp() > anders.ts -%}
            {%- set ns.soort = 'nachtwel' -%}
          {%- endif -%}
          {#- Planning-stand: de tekst volgt wat de lader nu doet (anders staat er 'Afwachten' terwijl hij laadt). -#}
          {%- set tg = is_state('binary_sensor.ev_lb_sonia_laden_toegestaan', 'on') -%}
          {%- set pvl = is_state('binary_sensor.ev_lb_sonia_pv_laden', 'on') and is_state('input_boolean.ev_sonia_opladen_uitgezet', 'off') -%}
          {#- Accu vol: alleen 'verwarmt of koelt het interieur' als het afgenomen vermogen en de duur lijken
              op het voorverwarmen van Sonia op 28-10-2026 vóór 07:00 (27 min, gemiddeld 3 kW; eerst 4-6,5 kW,
              daarna ~2,2 kW, nooit boven 7 kW): 1-8 kW en al minstens 5 min aan het afnemen. Anders alleen 'Accu is vol'. -#}
          {%- if is_state('input_boolean.ev_sonia_accu_vol', 'on') -%}
            {%- set pw = states('sensor.ev_sonia_vermogen') | float(0) -%}
            {%- set stil = (now() - states.sensor.ev_sonia_status_connector.last_changed).total_seconds() -%}
            {%- set plan_tekst = 'Accu is vol, auto verwarmt of koelt het interieur' if (st == 'Charging' and 1000 <= pw <= 8000 and stil >= 300) else 'Accu is vol' -%}
          {%- elif st == 'Charging' and tg -%}
            {%- set plan_tekst = 'Accu wordt nu op laagste tarief opgeladen → €€' -%}
          {%- elif st == 'Charging' and pvl -%}
            {%- set plan_tekst = 'Accu wordt nu met zonnestroom opgeladen' -%}
          {%- elif tg and st in ['SuspendedEV', 'SuspendedEVSE'] and states('input_number.ev_lb_setpunt_sonia') | float(0) >= 6 and states('sensor.ev_sonia_vermogen') | float(0) < 100
                      and (now() - states.sensor.ev_sonia_status_connector.last_changed).total_seconds() > 120 -%}
            {%- set plan_tekst = 'Laden toegestaan, maar de auto neemt geen stroom af (accu vol?)' -%}
          {%- elif tg and st == 'SuspendedEVSE' and states('input_number.ev_lb_setpunt_sonia') | float(0) < 6 -%}
            {%- set plan_tekst = 'Gepauzeerd door load balancing' -%}
          {%- elif tg and st == 'SuspendedEV' -%}
            {%- set plan_tekst = 'Auto pauzeert even' -%}
          {%- elif tg -%}
            {%- set plan_tekst = 'Laden op laagste tarief wordt gestart' -%}
          {%- elif pvl and st in ['Preparing', 'SuspendedEVSE', 'SuspendedEV'] -%}
            {%- set plan_tekst = 'Wacht: Rob laadt eerst op zon' if (states('sensor.ev_rob_status_connector') == 'Charging' and is_state('binary_sensor.ev_lb_rob_pv_laden', 'on')) else 'Wacht op meer zonne-overschot' -%}
          {%- else -%}
            {%- set vs = states('sensor.ev_sonia_verwachte_start').split('\n')[0] -%}
            {%- set plan_tekst = ('Laden op laagste tarief begint ' ~ vs) if vs is match('^(vandaag|morgen|overmorgen|Vannacht)') else 'Nog geen laadblok gepland' -%}
          {%- endif -%}
          {#- Regel 2: alleen bij een beperking door load balancing, delen of een volle fase (niet bij normaal laden). -#}
          {%- set sp = states('input_number.ev_lb_setpunt_sonia') | float(0) -%}
          {%- set actief = st == 'Charging' or (tg and st in ['Preparing', 'SuspendedEVSE']) -%}
          {%- set i_f = [states('sensor.ev_lb_stroom_l1') | float(0), states('sensor.ev_lb_stroom_l2') | float(0), states('sensor.ev_lb_stroom_l3') | float(0)] -%}
          {%- set p1 = namespace(oud=false) -%}
          {%- for f in [1, 2, 3] -%}
            {%- set e = states['sensor.p1_meter_power_phase_' ~ f] -%}
            {%- if e is none or e.state in ['unavailable', 'unknown'] or (now() - e.last_reported).total_seconds() > 30 -%}{%- set p1.oud = true -%}{%- endif -%}
          {%- endfor -%}
          {%- set extra = '' -%}
          {%- if not actief or is_state('input_boolean.ev_sonia_accu_vol', 'on') or ns.soort in ['uit', 'nacht'] -%}
          {%- elif is_state('binary_sensor.ev_lb_overbelasting', 'on') -%}{%- set extra = 'Gestopt: aansluiting overbelast' -%}
          {%- elif states('input_number.ev_lb_afschakel_niveau') | int(0) > 0 -%}{%- set extra = 'Huislast uit voor het laden' -%}
          {%- elif is_state('binary_sensor.ev_lb_tekort_aanhoudend', 'on') -%}{%- set extra = 'Beperkt: huis gebruikt veel stroom' -%}
          {%- elif p1.oud -%}{%- set extra = 'P1-meter niet bereikbaar, laadt op 6 A' -%}
          {%- elif is_state('input_boolean.ev_lb_actief', 'off') -%}{%- set extra = 'Load balancing uit, laadt op 6 A' -%}
          {%- elif is_state('binary_sensor.ev_lb_deelmodus', 'on') -%}{%- set extra = 'Samen met Rob, max ' ~ (states('input_number.ev_lb_deel_max_sonia') | int(0)) ~ ' A' -%}
          {%- elif st == 'Charging' and sp >= 6 and sp < states('input_number.ev_lb_max_sonia') | float(16)
                    and states('sensor.ev_lb_ruimte') | float(9) < 3
                    and (now() - states['input_number.ev_lb_setpunt_sonia'].last_changed).total_seconds() > 60 -%}
            {%- set fa = states('sensor.ev_lb_sonia_fase_actief') -%}
            {%- set extra = 'Beperkt tot ' ~ (sp | int) ~ ' A door fase ' ~ (fa if fa in ['L1', 'L2', 'L3'] else 'L' ~ (i_f.index(i_f | max) + 1)) -%}
          {%- endif -%}
          {%- set modus = {'direct': 'Accu NU SNEL opladen → €€€',
              'zon': 'Accu GRATIS opladen met de zon maar langzamer',
              'uit': 'Accu opladen uitzetten',
              'nacht': 'Morgen thuis blijven\nAlleen laden met zonlicht',
              'nachtwel': 'Accu wordt \'s-nachts op laagste tarief snel opgeladen → €€',
              'plan': plan_tekst}[ns.soort] -%}
          {%- if st in ['Available', 'unavailable', 'unknown', 'Faulted', 'Reserved'] -%}{{ laad }}
          {%- elif ns.soort == 'uit' and st != 'Charging' -%}Accu opladen uitgezet
          {%- elif ns.soort in ['direct', 'zon', 'nacht', 'nachtwel', 'plan'] -%}{{ modus }}{{ ('\n' ~ extra) if extra else '' }}
          {%- else -%}{{ modus }}{{ '\n' }}{{ laad }}{%- endif -%}
      - name: "EV Rob status NL"
        unique_id: ev_rob_status_nl
        icon: mdi:ev-plug-type2
        state: >-
          {#- Eerste regel: de knop die als laatste is ingedrukt (de actieve stand); tweede regel:
              wat de lader zelf doet. Direct na een knop een tussentekst: de lader zelf
              reageert pas na 5-15 s. -#}
          {%- set st = states('sensor.ev_rob_status_connector') -%}
          {%- if st == 'Charging' and is_state('input_boolean.ev_rob_opladen_uitgezet', 'on') -%}
            {%- set laad = 'Opladen wordt gestopt...' -%}
          {%- elif st in ['Preparing', 'SuspendedEVSE', 'SuspendedEV'] and is_state('input_boolean.ev_rob_direct_laden', 'on') -%}
            {%- set laad = 'Snel laden wordt gestart...' -%}
          {%- else -%}
            {%- set laad = {'Available': 'Beschikbaar', 'Preparing': 'Aangesloten, wacht op start',
                'Charging': 'Laden', 'SuspendedEVSE': 'Accu NU opladen gepauzeerd door EV-lader',
                'SuspendedEV': 'Gepauzeerd door auto', 'Finishing': 'Afronden',
                'Reserved': 'Gereserveerd', 'Unavailable': 'Lader niet bereikbaar',
                'unavailable': 'Lader niet bereikbaar', 'unknown': 'Lader niet bereikbaar',
                'Faulted': 'Storing op de lader'}.get(st, st) -%}
          {%- endif -%}
          {%- set ns = namespace(ts=0, soort='plan') -%}
          {%- for soort, ent in [('direct', 'input_boolean.ev_rob_direct_laden'), ('zon', 'input_boolean.ev_rob_alleen_zon'), ('uit', 'input_boolean.ev_rob_opladen_uitgezet'), ('nacht', 'input_boolean.ev_rob_nacht_overslaan')] -%}
            {%- set v = states.input_boolean | selectattr('entity_id', 'eq', ent) | first -%}
            {%- if v is defined and v.state == 'on' and v.last_changed.timestamp() > ns.ts -%}
              {%- set ns.ts = v.last_changed.timestamp() -%}{%- set ns.soort = soort -%}
            {%- endif -%}
          {%- endfor -%}
          {#- 'Accu 's-nachts WEL opladen': de knop zet 'morgen thuis blijven' uit. Alleen als dat op het
              scherm is gedaan (er is een gebruiker bij; het wissen op de vertrektijd door een
              automatisering telt niet) en het de laatste wijziging is. -#}
          {%- set nv = states.input_boolean | selectattr('entity_id', 'eq', 'input_boolean.ev_rob_nacht_overslaan') | first -%}
          {%- set anders = namespace(ts=0) -%}
          {%- for ent in ['input_boolean.ev_rob_direct_laden', 'input_boolean.ev_rob_alleen_zon', 'input_boolean.ev_rob_opladen_uitgezet'] -%}
            {%- set w = states.input_boolean | selectattr('entity_id', 'eq', ent) | first -%}
            {%- if w is defined and w.last_changed.timestamp() > anders.ts -%}{%- set anders.ts = w.last_changed.timestamp() -%}{%- endif -%}
          {%- endfor -%}
          {%- if ns.soort == 'plan' and nv is defined and nv.state == 'off' and nv.context.user_id is not none and nv.last_changed.timestamp() > anders.ts -%}
            {%- set ns.soort = 'nachtwel' -%}
          {%- endif -%}
          {#- Planning-stand: de tekst volgt wat de lader nu doet (anders staat er 'Afwachten' terwijl hij laadt). -#}
          {%- set tg = is_state('binary_sensor.ev_lb_rob_laden_toegestaan', 'on') -%}
          {%- set pvl = is_state('binary_sensor.ev_lb_rob_pv_laden', 'on') and is_state('input_boolean.ev_rob_opladen_uitgezet', 'off') -%}
          {#- Accu vol: alleen 'verwarmt of koelt het interieur' als het afgenomen vermogen en de duur lijken
              op het voorverwarmen van Sonia op 28-10-2026 vóór 07:00 (27 min, gemiddeld 3 kW; eerst 4-6,5 kW,
              daarna ~2,2 kW, nooit boven 7 kW): 1-8 kW en al minstens 5 min aan het afnemen. Anders alleen 'Accu is vol'. -#}
          {%- if is_state('input_boolean.ev_rob_accu_vol', 'on') -%}
            {%- set pw = states('sensor.ev_rob_vermogen') | float(0) -%}
            {%- set stil = (now() - states.sensor.ev_rob_status_connector.last_changed).total_seconds() -%}
            {%- set plan_tekst = 'Accu is vol, auto verwarmt of koelt het interieur' if (st == 'Charging' and 1000 <= pw <= 8000 and stil >= 300) else 'Accu is vol' -%}
          {%- elif st == 'Charging' and tg -%}
            {%- set plan_tekst = 'Accu wordt nu op laagste tarief opgeladen → €€' -%}
          {%- elif st == 'Charging' and pvl -%}
            {%- set plan_tekst = 'Accu wordt nu met zonnestroom opgeladen' -%}
          {%- elif tg and st in ['SuspendedEV', 'SuspendedEVSE'] and states('input_number.ev_lb_setpunt_rob') | float(0) >= 6 and states('sensor.ev_rob_vermogen') | float(0) < 100
                      and (now() - states.sensor.ev_rob_status_connector.last_changed).total_seconds() > 120 -%}
            {%- set plan_tekst = 'Laden toegestaan, maar de auto neemt geen stroom af (accu vol?)' -%}
          {%- elif tg and st == 'SuspendedEVSE' and states('input_number.ev_lb_setpunt_rob') | float(0) < 6 -%}
            {%- set plan_tekst = 'Wacht op EV-Sonia' if 'Pas na EV-Sonia' in states('sensor.ev_rob_verwachte_start') else 'Gepauzeerd door load balancing' -%}
          {%- elif tg and st == 'SuspendedEV' -%}
            {%- set plan_tekst = 'Auto pauzeert even' -%}
          {%- elif tg -%}
            {%- set plan_tekst = 'Laden op laagste tarief wordt gestart' -%}
          {%- elif pvl and st in ['Preparing', 'SuspendedEVSE', 'SuspendedEV'] -%}
            {%- set plan_tekst = 'Wacht op meer zonne-overschot' -%}
          {%- else -%}
            {%- set vs = states('sensor.ev_rob_verwachte_start').split('\n')[0] -%}
            {%- set plan_tekst = ('Laden op laagste tarief begint ' ~ vs) if vs is match('^(vandaag|morgen|overmorgen|Vannacht)') else 'Nog geen laadblok gepland' -%}
          {%- endif -%}
          {#- Regel 2: alleen bij een beperking door load balancing, delen of een volle fase (niet bij normaal laden). -#}
          {%- set sp = states('input_number.ev_lb_setpunt_rob') | float(0) -%}
          {%- set actief = st == 'Charging' or (tg and st in ['Preparing', 'SuspendedEVSE']) -%}
          {%- set i_f = [states('sensor.ev_lb_stroom_l1') | float(0), states('sensor.ev_lb_stroom_l2') | float(0), states('sensor.ev_lb_stroom_l3') | float(0)] -%}
          {%- set p1 = namespace(oud=false) -%}
          {%- for f in [1, 2, 3] -%}
            {%- set e = states['sensor.p1_meter_power_phase_' ~ f] -%}
            {%- if e is none or e.state in ['unavailable', 'unknown'] or (now() - e.last_reported).total_seconds() > 30 -%}{%- set p1.oud = true -%}{%- endif -%}
          {%- endfor -%}
          {%- set extra = '' -%}
          {%- if not actief or is_state('input_boolean.ev_rob_accu_vol', 'on') or ns.soort in ['uit', 'nacht'] -%}
          {%- elif is_state('binary_sensor.ev_lb_overbelasting', 'on') -%}{%- set extra = 'Gestopt: aansluiting overbelast' -%}
          {%- elif states('input_number.ev_lb_afschakel_niveau') | int(0) > 0 -%}{%- set extra = 'Huislast uit voor het laden' -%}
          {%- elif is_state('binary_sensor.ev_lb_tekort_aanhoudend', 'on') -%}{%- set extra = 'Beperkt: huis gebruikt veel stroom' -%}
          {%- elif p1.oud -%}{%- set extra = 'P1-meter niet bereikbaar, laadt op 6 A' -%}
          {%- elif is_state('input_boolean.ev_lb_actief', 'off') -%}{%- set extra = 'Load balancing uit, laadt op 6 A' -%}
          {%- elif is_state('binary_sensor.ev_lb_deelmodus', 'on') -%}{%- set extra = 'Samen met Sonia, max ' ~ (states('input_number.ev_lb_deel_max_rob') | int(0)) ~ ' A' -%}
          {%- elif st == 'Charging' and sp >= 6 and sp < states('input_number.ev_lb_max_rob') | float(16)
                    and states('sensor.ev_lb_ruimte') | float(9) < 3
                    and (now() - states['input_number.ev_lb_setpunt_rob'].last_changed).total_seconds() > 60 -%}
            {%- set fa = states('sensor.ev_lb_rob_fase_actief') -%}
            {%- set extra = 'Beperkt tot ' ~ (sp | int) ~ ' A door fase ' ~ (fa if fa in ['L1', 'L2', 'L3'] else 'L' ~ (i_f.index(i_f | max) + 1)) -%}
          {%- endif -%}
          {%- set modus = {'direct': 'Accu NU SNEL opladen → €€€',
              'zon': 'Accu GRATIS opladen met de zon maar langzamer',
              'uit': 'Accu opladen uitzetten',
              'nacht': 'Morgen thuis blijven\nAlleen laden met zonlicht',
              'nachtwel': 'Accu wordt \'s-nachts op laagste tarief snel opgeladen → €€',
              'plan': plan_tekst}[ns.soort] -%}
          {%- if st in ['Available', 'unavailable', 'unknown', 'Faulted', 'Reserved'] -%}{{ laad }}
          {%- elif ns.soort == 'uit' and st != 'Charging' -%}Accu opladen uitgezet
          {%- elif ns.soort in ['direct', 'zon', 'nacht', 'nachtwel', 'plan'] -%}{{ modus }}{{ ('\n' ~ extra) if extra else '' }}
          {%- else -%}{{ modus }}{{ '\n' }}{{ laad }}{%- endif -%}

  - sensor:
      # Laadvermogen in kW (weergave op het dashboard), uit de afgeleide W-sensoren.
      - name: "EV Sonia vermogen kW"
        unique_id: ev_sonia_vermogen_kw
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        # Alleen weergave: direct 0 kW zodra de lader niet meer laadt (de afgeleide
        # W-sensor blijft anders tot 150 s op de oude waarde staan).
        state: "{{ (states('sensor.ev_sonia_vermogen') | float(0) / 1000) if is_state('sensor.ev_sonia_status_connector', 'Charging') and is_state('input_boolean.ev_sonia_opladen_uitgezet', 'off') else 0 }}"
      - name: "EV Rob vermogen kW"
        unique_id: ev_rob_vermogen_kw
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        state: "{{ (states('sensor.ev_rob_vermogen') | float(0) / 1000) if is_state('sensor.ev_rob_status_connector', 'Charging') and is_state('input_boolean.ev_rob_opladen_uitgezet', 'off') else 0 }}"

  - sensor:
      # Verwachte laadstart (weergave): eerstvolgende kwartier van de goedkoopste
      # uren tot de vertrektijd. Rob start in de praktijk pas als Sonia vol is.
      - name: "EV Sonia verwachte start"
        unique_id: ev_sonia_verwachte_start
        icon: mdi:clock-start
        state: >-
          {# Verwacht klaar: resterende kWh (planning minus gedaan) / gemeten vermogen; alleen tijdens het laden bij >= 1 kW #}
          {% set k_rest = [states('input_number.ev_lb_sonia_plan_kwh') | float(0) - states('sensor.ev_sonia_sessie_energie') | float(0), 0] | max %}
          {% set k_pw = states('sensor.ev_sonia_vermogen') | float(0) / 1000 %}
          {% set k_dl = today_at(states('input_datetime.ev_sonia_vertrek')) %}
          {% if k_dl <= now() %}{% set k_dl = k_dl + timedelta(days=1) %}{% endif %}
          {% set k_ts = (now() + timedelta(hours=k_rest / k_pw)) if (states('sensor.ev_sonia_status_connector') == 'Charging' and k_pw >= 1 and k_rest > 0) else none %}
          {% set klaar_regel = ('\nVerwacht klaar ' ~ ('morgen ' if k_ts.date() != now().date() else '') ~ k_ts.strftime('%H:%M') ~ (' (na vertrek ' ~ k_dl.strftime('%H:%M') ~ ')' if k_ts > k_dl else '')) if k_ts is not none else '' %}
          {% if states('sensor.ev_sonia_status_connector') == 'Available' %}
            Niet aangesloten
          {% elif states('sensor.ev_sonia_status_connector') in ['unavailable', 'unknown'] %}
            Lader niet bereikbaar
          {% elif states('sensor.ev_sonia_status_connector') == 'Faulted' %}
            Lader heeft een storing
          {% elif is_state('input_boolean.ev_sonia_opladen_uitgezet', 'on') %}
            Opladen wordt niet verwacht
          {% elif is_state('input_boolean.ev_sonia_accu_vol', 'on') %}
            Accu is vol, laden niet meer nodig
          {% elif is_state('binary_sensor.ev_lb_sonia_pv_laden', 'on') and not is_state('binary_sensor.ev_lb_sonia_laden_toegestaan', 'on')
                  and states('sensor.ev_sonia_status_connector') in ['Charging', 'Preparing', 'SuspendedEVSE', 'SuspendedEV'] %}
            {{ ('Laadt nu op zonnestroom' ~ klaar_regel) if states('sensor.ev_sonia_status_connector') == 'Charging' else 'Wacht op zonne-overschot' }}
          {# 'Morgen thuis blijven': alleen PV-laden; geldt als het de laatst ingedrukte stand is #}
          {% elif is_state('input_boolean.ev_sonia_nacht_overslaan', 'on') and not is_state('input_boolean.ev_sonia_direct_laden', 'on')
                  and (is_state('input_boolean.ev_sonia_alleen_zon', 'off')
                       or states.input_boolean.ev_sonia_nacht_overslaan.last_changed > states.input_boolean.ev_sonia_alleen_zon.last_changed) %}
            Alleen met zonlicht, maar wanneer en hoe snel is onbekend
          {% elif is_state('input_boolean.ev_sonia_alleen_zon', 'on') and not is_state('binary_sensor.ev_lb_sonia_laden_toegestaan', 'on') %}
            Alleen met zonlicht, maar wanneer en hoe snel is onbekend
          {% elif is_state('binary_sensor.ev_lb_sonia_laden_toegestaan', 'on') %}
            {# Laden mag nu; wat de tekst zegt hangt af van wat de lader/auto echt doet #}
            {% set st = states('sensor.ev_sonia_status_connector') %}
            {{ ('De accu wordt nu opgeladen' ~ klaar_regel) if st == 'Charging'
               else 'Laden toegestaan, maar de auto neemt geen stroom af' if st == 'SuspendedEV'
               else 'Gepauzeerd door load balancing' if (st == 'SuspendedEVSE' and states('input_number.ev_lb_setpunt_sonia') | float(0) < 6)
               else 'Laden toegestaan, wacht op start' }}
          {% else %}
            {% set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] %}
            {% set dl = today_at(states('input_datetime.ev_sonia_vertrek')) %}
            {% if dl <= now() %}{% set dl = dl + timedelta(days=1) %}{% endif %}
            {% set k = (states('sensor.ev_sonia_plan_uren') | float(0) * 4) | round(0, 'ceil') | int %}
            {# Vastgelegd aaneengesloten blok (input_datetime); alleen tonen als het bij deze cyclus hoort en nog niet voorbij is #}
            {% set s_ts = state_attr('input_datetime.ev_sonia_blok_start', 'timestamp') | float(0) %}
            {% set actief = s_ts > dl.timestamp() - 86400 and s_ts + k * 900 > now().timestamp() %}
            {% set goed = [{'t': now().replace(microsecond=0) + timedelta(seconds=(s_ts - now().replace(microsecond=0).timestamp()) | round(0))}] if actief else [] %}
            {% if fc | count == 0 %}
              {{ 'vandaag 11:00' if now().hour < 11 else 'Vannacht om 00:00' }} (noodschema, geen prijzen)
            {% elif goed | count == 0 %}
              Geen goedkoop uur gepland
            {% else %}
              {% set s = goed[0].t | as_local %}
              {% set kp = s + timedelta(hours=states('sensor.ev_sonia_plan_uren') | float(0)) %}
              {% set kp_regel = ('\nVerwacht klaar ' ~ ('morgen ' if kp.date() != now().date() else '') ~ kp.strftime('%H:%M')) if states('sensor.ev_sonia_plan_uren') | float(0) > 0 else '' %}
              {{ 'Vannacht om' if s.hour < 6 else 'vandaag' if s.date() == now().date() else 'morgen' }} {{ s.strftime('%H:%M') }}{{ kp_regel }}
            {% endif %}
          {% endif %}
      - name: "EV Rob verwachte start"
        unique_id: ev_rob_verwachte_start
        icon: mdi:clock-start
        state: >-
          {# Verwacht klaar: resterende kWh (planning minus gedaan) / gemeten vermogen; alleen tijdens het laden bij >= 1 kW #}
          {% set k_rest = [states('input_number.ev_lb_rob_plan_kwh') | float(0) - states('sensor.ev_rob_sessie_energie') | float(0), 0] | max %}
          {% set k_pw = states('sensor.ev_rob_vermogen') | float(0) / 1000 %}
          {% set k_dl = today_at(states('input_datetime.ev_rob_vertrek')) %}
          {% if k_dl <= now() %}{% set k_dl = k_dl + timedelta(days=1) %}{% endif %}
          {% set k_ts = (now() + timedelta(hours=k_rest / k_pw)) if (states('sensor.ev_rob_status_connector') == 'Charging' and k_pw >= 1 and k_rest > 0) else none %}
          {% set klaar_regel = ('\nVerwacht klaar ' ~ ('morgen ' if k_ts.date() != now().date() else '') ~ k_ts.strftime('%H:%M') ~ (' (na vertrek ' ~ k_dl.strftime('%H:%M') ~ ')' if k_ts > k_dl else '')) if k_ts is not none else '' %}
          {# Sonia heeft voorrang: zolang zij aangesloten is en nog laadt/wacht, start Rob pas daarna #}
          {# Alleen als Sonia ook echt mag laden (niet bij 'nacht overslaan' / buiten haar uren) #}
          {# Ook vooruitkijkend: Sonia's geplande blok loopt op Rob's startmoment (en ze slaat de nacht niet over) #}
          {% set r_ts = state_attr('input_datetime.ev_rob_blok_start', 'timestamp') | float(0) %}
          {% set s_ts = state_attr('input_datetime.ev_sonia_blok_start', 'timestamp') | float(0) %}
          {% set s_k = (states('sensor.ev_sonia_plan_uren') | float(0) * 4) | round(0, 'ceil') | int %}
          {% set sonia_gepland = is_state('input_boolean.ev_sonia_nacht_overslaan', 'off')
                                 and s_ts <= r_ts < s_ts + s_k * 900 %}
          {% set sonia_actief = states('sensor.ev_sonia_status_connector') in ['Preparing', 'Charging', 'SuspendedEVSE']
                      and (is_state('binary_sensor.ev_lb_sonia_laden_toegestaan', 'on')
                           or is_state('binary_sensor.ev_lb_sonia_pv_laden', 'on')
                           or sonia_gepland) %}
          {# 's Nachts (22:00-07:00) laden beide samen (deelmodus): Rob wacht dan niet op Sonia #}
          {% set r_uur = (r_ts | timestamp_custom('%H') | int(12)) %}
          {% set samen = sonia_actief and (is_state('binary_sensor.ev_lb_deelmodus', 'on') or r_uur >= 22 or r_uur < 7) %}
          {% set na = sonia_actief and not samen %}
          {% if states('sensor.ev_rob_status_connector') == 'Available' %}
            Niet aangesloten
          {% elif states('sensor.ev_rob_status_connector') in ['unavailable', 'unknown'] %}
            Lader niet bereikbaar
          {% elif states('sensor.ev_rob_status_connector') == 'Faulted' %}
            Lader heeft een storing
          {% elif is_state('input_boolean.ev_rob_opladen_uitgezet', 'on') %}
            Opladen wordt niet verwacht
          {% elif is_state('input_boolean.ev_rob_accu_vol', 'on') %}
            Accu is vol, laden niet meer nodig
          {% elif is_state('binary_sensor.ev_lb_rob_pv_laden', 'on') and not is_state('binary_sensor.ev_lb_rob_laden_toegestaan', 'on')
                  and states('sensor.ev_rob_status_connector') in ['Charging', 'Preparing', 'SuspendedEVSE', 'SuspendedEV'] %}
            {{ ('Laadt nu op zonnestroom' ~ klaar_regel) if states('sensor.ev_rob_status_connector') == 'Charging' else 'Wacht op zonne-overschot' }}
          {# 'Morgen thuis blijven': alleen PV-laden; geldt als het de laatst ingedrukte stand is #}
          {% elif is_state('input_boolean.ev_rob_nacht_overslaan', 'on') and not is_state('input_boolean.ev_rob_direct_laden', 'on')
                  and (is_state('input_boolean.ev_rob_alleen_zon', 'off')
                       or states.input_boolean.ev_rob_nacht_overslaan.last_changed > states.input_boolean.ev_rob_alleen_zon.last_changed) %}
            Alleen met zonlicht, maar wanneer en hoe snel is onbekend
          {% elif is_state('input_boolean.ev_rob_alleen_zon', 'on') and not is_state('binary_sensor.ev_lb_rob_laden_toegestaan', 'on') %}
            Alleen met zonlicht, maar wanneer en hoe snel is onbekend
          {% elif is_state('binary_sensor.ev_lb_rob_laden_toegestaan', 'on') %}
            {% set st = states('sensor.ev_rob_status_connector') %}
            {{ ('De accu wordt nu opgeladen' ~ klaar_regel) if st == 'Charging'
               else 'Pas na EV-Sonia' if na
               else 'Laden toegestaan, maar de auto neemt geen stroom af' if st == 'SuspendedEV'
               else 'Gepauzeerd door load balancing' if (st == 'SuspendedEVSE' and states('input_number.ev_lb_setpunt_rob') | float(0) < 6)
               else 'Laden toegestaan, wacht op start' }}
          {% else %}
            {% set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] %}
            {% set dl = today_at(states('input_datetime.ev_rob_vertrek')) %}
            {% if dl <= now() %}{% set dl = dl + timedelta(days=1) %}{% endif %}
            {% set k = (states('sensor.ev_rob_plan_uren') | float(0) * 4) | round(0, 'ceil') | int %}
            {# Vastgelegd aaneengesloten blok (input_datetime); alleen tonen als het bij deze cyclus hoort en nog niet voorbij is #}
            {% set s_ts = state_attr('input_datetime.ev_rob_blok_start', 'timestamp') | float(0) %}
            {% set actief = s_ts > dl.timestamp() - 86400 and s_ts + k * 900 > now().timestamp() %}
            {% set goed = [{'t': now().replace(microsecond=0) + timedelta(seconds=(s_ts - now().replace(microsecond=0).timestamp()) | round(0))}] if actief else [] %}
            {% if fc | count == 0 %}
              {{ 'vandaag 11:00' if now().hour < 11 else 'Vannacht om 00:00' }} (noodschema, geen prijzen){{ ' – Pas na EV-Sonia' if na else ' – Samen met EV-Sonia' if samen else '' }}
            {% elif goed | count == 0 %}
              Geen goedkoop uur gepland
            {% else %}
              {% set s = goed[0].t | as_local %}
              {% set kp = s + timedelta(hours=states('sensor.ev_rob_plan_uren') | float(0)) %}
              {% set kp_regel = ('\nVerwacht klaar ' ~ ('morgen ' if kp.date() != now().date() else '') ~ kp.strftime('%H:%M')) if states('sensor.ev_rob_plan_uren') | float(0) > 0 and not na else '' %}
              {{ 'Vannacht om' if s.hour < 6 else 'vandaag' if s.date() == now().date() else 'morgen' }} {{ s.strftime('%H:%M') }}{{ ' – Pas na EV-Sonia' if na else ' – Samen met EV-Sonia' if samen else '' }}{{ kp_regel }}
            {% endif %}
          {% endif %}

  - sensor:
      # Geplande laadduur (uren) = te laden kWh / vermogen bij samen laden (nacht):
      # fasen x 230 V x max stroom bij samen laden. Alleen voor het kiezen van de starttijd.
      - name: "EV Sonia plan uren"
        unique_id: ev_sonia_plan_uren
        unit_of_measurement: h
        state: >
          {% set kwh = states('input_number.ev_lb_sonia_plan_kwh') | float(0) %}
          {% set f = 3 if is_state('sensor.ev_lb_sonia_fase_actief', '3-fase') else 1 %}
          {% set kw = f * 230 * states('input_number.ev_lb_deel_max_sonia') | float(13) / 1000 %}
          {{ ((kwh / kw * 4) | round(0, 'ceil') / 4) if kw > 0 else 0 }}
      - name: "EV Rob plan uren"
        unique_id: ev_rob_plan_uren
        unit_of_measurement: h
        state: >
          {% set kwh = states('input_number.ev_lb_rob_plan_kwh') | float(0) %}
          {% set f = 3 if is_state('sensor.ev_lb_rob_fase_actief', '3-fase') else 1 %}
          {# Alleen aan de lader: Rob laadt met zijn volle stroom (ev_lb_max_rob, 16 A). Is Sonia ook aangesloten, dan telt de deelmodus-stroom #}
          {% set sonia_aan = states('sensor.ev_sonia_status_connector') in ['Preparing', 'Charging', 'SuspendedEVSE', 'SuspendedEV'] %}
          {% set a = states('input_number.ev_lb_deel_max_rob') | float(9) if sonia_aan else states('input_number.ev_lb_max_rob') | float(16) %}
          {% set kw = f * 230 * a / 1000 %}
          {{ ((kwh / kw * 4) | round(0, 'ceil') / 4) if kw > 0 else 0 }}

  - sensor:
      # Aaneengesloten goedkoopste laadblok (k kwartieren). Alleen kandidaten;
      # het vastleggen gebeurt in automation ev_blok_vastleggen.
      - name: "EV Sonia blokplanning"
        unique_id: ev_sonia_blokplanning
        state: "ok"
        attributes:
          kandidaat_start: >-
            {%- macro blok(fc, k, lo, hi, strikt) -%}
            {%- set ns = namespace(l=[], best='', bp=-1) -%}
            {%- for f in fc -%}
            {%- set st = as_datetime(f.start_date) -%}
            {%- set en = as_datetime(f.end_date) -%}
            {%- if st is not none and en is not none and en <= hi and ((st >= lo) if strikt else (en > lo)) -%}
            {%- set ns.l = ns.l + [{'t': st, 'p': f.price_tax_included.amount | float(0)}] -%}
            {%- endif -%}
            {%- endfor -%}
            {%- set l = ns.l | sort(attribute='t') -%}
            {%- if k > 0 -%}
            {%- for i in range(0, l | count - k + 1) -%}
            {%- if (l[i + k - 1].t - l[i].t).total_seconds() == (k - 1) * 900 -%}
            {%- set som = l[i:i + k] | sum(attribute='p') -%}
            {%- if ns.bp < 0 or som < ns.bp -%}{%- set ns.bp = som -%}{%- set ns.best = l[i].t.isoformat() -%}{%- endif -%}
            {%- endif -%}
            {%- endfor -%}
            {%- endif -%}
            {{- ns.best -}}
            {%- endmacro -%}
            {%- set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] -%}
            {%- set dl = today_at(states('input_datetime.ev_sonia_vertrek')) -%}
            {%- if dl <= now() -%}{%- set dl = dl + timedelta(days=1) -%}{%- endif -%}
            {%- set k = (states('sensor.ev_sonia_plan_uren') | float(0) * 4) | round(0, 'ceil') | int -%}
            {{ blok(fc, k, now(), dl, false) }}
          start_na_nacht: >-
            {%- macro blok(fc, k, lo, hi, strikt) -%}
            {%- set ns = namespace(l=[], best='', bp=-1) -%}
            {%- for f in fc -%}
            {%- set st = as_datetime(f.start_date) -%}
            {%- set en = as_datetime(f.end_date) -%}
            {%- if st is not none and en is not none and en <= hi and ((st >= lo) if strikt else (en > lo)) -%}
            {%- set ns.l = ns.l + [{'t': st, 'p': f.price_tax_included.amount | float(0)}] -%}
            {%- endif -%}
            {%- endfor -%}
            {%- set l = ns.l | sort(attribute='t') -%}
            {%- if k > 0 -%}
            {%- for i in range(0, l | count - k + 1) -%}
            {%- if (l[i + k - 1].t - l[i].t).total_seconds() == (k - 1) * 900 -%}
            {%- set som = l[i:i + k] | sum(attribute='p') -%}
            {%- if ns.bp < 0 or som < ns.bp -%}{%- set ns.bp = som -%}{%- set ns.best = l[i].t.isoformat() -%}{%- endif -%}
            {%- endif -%}
            {%- endfor -%}
            {%- endif -%}
            {{- ns.best -}}
            {%- endmacro -%}
            {%- set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] -%}
            {%- set dl = today_at(states('input_datetime.ev_sonia_vertrek')) -%}
            {%- if dl <= now() -%}{%- set dl = dl + timedelta(days=1) -%}{%- endif -%}
            {%- set k = (states('sensor.ev_sonia_plan_uren') | float(0) * 4) | round(0, 'ceil') | int -%}
            {{ blok(fc, k, dl, dl + timedelta(days=1), true) }}
          eerste_start: >-
            {%- set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] -%}
            {%- set dl = today_at(states('input_datetime.ev_sonia_vertrek')) -%}
            {%- if dl <= now() -%}{%- set dl = dl + timedelta(days=1) -%}{%- endif -%}
            {%- set k = (states('sensor.ev_sonia_plan_uren') | float(0) * 4) | round(0, 'ceil') | int -%}
            {%- set ns = namespace(f='') -%}
            {%- for f in fc | sort(attribute='start_date') -%}
            {%- if not ns.f and as_datetime(f.end_date) > now() and as_datetime(f.end_date) <= dl -%}{%- set ns.f = as_datetime(f.start_date).isoformat() -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.f }}
          dl: >-
            {%- set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] -%}
            {%- set dl = today_at(states('input_datetime.ev_sonia_vertrek')) -%}
            {%- if dl <= now() -%}{%- set dl = dl + timedelta(days=1) -%}{%- endif -%}
            {%- set k = (states('sensor.ev_sonia_plan_uren') | float(0) * 4) | round(0, 'ceil') | int -%}
            {{ dl.isoformat() }}
          k: >-
            {%- set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] -%}
            {%- set dl = today_at(states('input_datetime.ev_sonia_vertrek')) -%}
            {%- if dl <= now() -%}{%- set dl = dl + timedelta(days=1) -%}{%- endif -%}
            {%- set k = (states('sensor.ev_sonia_plan_uren') | float(0) * 4) | round(0, 'ceil') | int -%}
            {{ k }}
      - name: "EV Rob blokplanning"
        unique_id: ev_rob_blokplanning
        state: "ok"
        attributes:
          kandidaat_start: >-
            {%- macro blok(fc, k, lo, hi, strikt) -%}
            {%- set ns = namespace(l=[], best='', bp=-1) -%}
            {%- for f in fc -%}
            {%- set st = as_datetime(f.start_date) -%}
            {%- set en = as_datetime(f.end_date) -%}
            {%- if st is not none and en is not none and en <= hi and ((st >= lo) if strikt else (en > lo)) -%}
            {%- set ns.l = ns.l + [{'t': st, 'p': f.price_tax_included.amount | float(0)}] -%}
            {%- endif -%}
            {%- endfor -%}
            {%- set l = ns.l | sort(attribute='t') -%}
            {%- if k > 0 -%}
            {%- for i in range(0, l | count - k + 1) -%}
            {%- if (l[i + k - 1].t - l[i].t).total_seconds() == (k - 1) * 900 -%}
            {%- set som = l[i:i + k] | sum(attribute='p') -%}
            {%- if ns.bp < 0 or som < ns.bp -%}{%- set ns.bp = som -%}{%- set ns.best = l[i].t.isoformat() -%}{%- endif -%}
            {%- endif -%}
            {%- endfor -%}
            {%- endif -%}
            {{- ns.best -}}
            {%- endmacro -%}
            {%- set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] -%}
            {%- set dl = today_at(states('input_datetime.ev_rob_vertrek')) -%}
            {%- if dl <= now() -%}{%- set dl = dl + timedelta(days=1) -%}{%- endif -%}
            {%- set k = (states('sensor.ev_rob_plan_uren') | float(0) * 4) | round(0, 'ceil') | int -%}
            {{ blok(fc, k, now(), dl, false) }}
          start_na_nacht: >-
            {%- macro blok(fc, k, lo, hi, strikt) -%}
            {%- set ns = namespace(l=[], best='', bp=-1) -%}
            {%- for f in fc -%}
            {%- set st = as_datetime(f.start_date) -%}
            {%- set en = as_datetime(f.end_date) -%}
            {%- if st is not none and en is not none and en <= hi and ((st >= lo) if strikt else (en > lo)) -%}
            {%- set ns.l = ns.l + [{'t': st, 'p': f.price_tax_included.amount | float(0)}] -%}
            {%- endif -%}
            {%- endfor -%}
            {%- set l = ns.l | sort(attribute='t') -%}
            {%- if k > 0 -%}
            {%- for i in range(0, l | count - k + 1) -%}
            {%- if (l[i + k - 1].t - l[i].t).total_seconds() == (k - 1) * 900 -%}
            {%- set som = l[i:i + k] | sum(attribute='p') -%}
            {%- if ns.bp < 0 or som < ns.bp -%}{%- set ns.bp = som -%}{%- set ns.best = l[i].t.isoformat() -%}{%- endif -%}
            {%- endif -%}
            {%- endfor -%}
            {%- endif -%}
            {{- ns.best -}}
            {%- endmacro -%}
            {%- set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] -%}
            {%- set dl = today_at(states('input_datetime.ev_rob_vertrek')) -%}
            {%- if dl <= now() -%}{%- set dl = dl + timedelta(days=1) -%}{%- endif -%}
            {%- set k = (states('sensor.ev_rob_plan_uren') | float(0) * 4) | round(0, 'ceil') | int -%}
            {{ blok(fc, k, dl, dl + timedelta(days=1), true) }}
          eerste_start: >-
            {%- set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] -%}
            {%- set dl = today_at(states('input_datetime.ev_rob_vertrek')) -%}
            {%- if dl <= now() -%}{%- set dl = dl + timedelta(days=1) -%}{%- endif -%}
            {%- set k = (states('sensor.ev_rob_plan_uren') | float(0) * 4) | round(0, 'ceil') | int -%}
            {%- set ns = namespace(f='') -%}
            {%- for f in fc | sort(attribute='start_date') -%}
            {%- if not ns.f and as_datetime(f.end_date) > now() and as_datetime(f.end_date) <= dl -%}{%- set ns.f = as_datetime(f.start_date).isoformat() -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.f }}
          dl: >-
            {%- set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] -%}
            {%- set dl = today_at(states('input_datetime.ev_rob_vertrek')) -%}
            {%- if dl <= now() -%}{%- set dl = dl + timedelta(days=1) -%}{%- endif -%}
            {%- set k = (states('sensor.ev_rob_plan_uren') | float(0) * 4) | round(0, 'ceil') | int -%}
            {{ dl.isoformat() }}
          k: >-
            {%- set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] -%}
            {%- set dl = today_at(states('input_datetime.ev_rob_vertrek')) -%}
            {%- if dl <= now() -%}{%- set dl = dl + timedelta(days=1) -%}{%- endif -%}
            {%- set k = (states('sensor.ev_rob_plan_uren') | float(0) * 4) | round(0, 'ceil') | int -%}
            {{ k }}

  - sensor:
      # PV-overschot voor de laders: wat er na het huisverbruik overblijft.
      # P1 (negatief = teruglevering) + wat de laders nu zelf afnemen.
      - name: "EV LB PV overschot"
        unique_id: ev_lb_pv_overschot
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.p1_meter_power') and has_value('sensor.envoy_122331077486_current_power_production') }}"
        # Overschot = teruglevering + wat de laders nu zelf afnemen, MAAR:
        # - het laadvermogen telt alleen mee als de lader echt laadt (het afgeleide
        #   vermogen blijft na een pauze nog tot 150 s op de oude waarde staan en
        #   gaf zo een nep-overschot, 20-10-2026 's avonds);
        # - nooit meer dan de echte PV-productie (Enphase).
        state: >
          {# Direct na een start of stroomverhoging loopt het afgeleide vermogen 10-20 s achter
             (energieteller verspringt per 10 s) en telde de lader te laag mee: het overschot leek
             dan te klein, de zonlading zette de lader op 0 A en dat herhaalde zich elke ~30 s
             (27-10-2026). Daarom telt voor een lader die laadt minstens het ingestelde setpunt mee. #}
          {% set rob = ([states('sensor.ev_rob_vermogen') | float(0), states('input_number.ev_lb_setpunt_rob') | float(0) * 230 * (3 if is_state('sensor.ev_lb_rob_fase_actief', '3-fase') else 1)] | max) if is_state('sensor.ev_rob_status_connector', 'Charging') else 0 %}
          {% set sonia = ([states('sensor.ev_sonia_vermogen') | float(0), states('input_number.ev_lb_setpunt_sonia') | float(0) * 230 * (3 if is_state('sensor.ev_lb_sonia_fase_actief', '3-fase') else 1)] | max) if is_state('sensor.ev_sonia_status_connector', 'Charging') else 0 %}
          {% set pv = states('sensor.envoy_122331077486_current_power_production') | float(0) %}
          {{ [[0 - states('sensor.p1_meter_power') | float(0) + rob + sonia, pv] | min, 0] | max | round(0) }}

  - binary_sensor:
      # Zonlading: genoeg PV-overschot (start 1500 W, blijft aan tot 1300 W).
      # delay_off 3 min (27-10-2026): na de start loopt het afgeleide laadvermogen
      # 10-20 s achter, waardoor het berekende overschot even onder 1300 W zakte;
      # de zonlading ging dan uit en weer aan (pendel elke ~30 s, 71x in 40 min).
      - name: "EV LB Rob PV laden"
        unique_id: ev_lb_rob_pv_laden
        delay_off: "00:03:00"
        state: >
          {% set o = states('sensor.ev_lb_pv_overschot') | float(0) %}
          {{ o >= 1500 or (this.state == 'on' and o >= 1300) }}
      - name: "EV LB Sonia PV laden"
        unique_id: ev_lb_sonia_pv_laden
        delay_off: "00:03:00"
        state: >
          {% set o = states('sensor.ev_lb_pv_overschot') | float(0) %}
          {{ o >= 1500 or (this.state == 'on' and o >= 1300) }}

  - binary_sensor:
      # ---------------------------------------------------------------
      # PRIJSSTURING (20-10-2026): mag deze lader nu laden? Ja bij: boost
      # (direct laden), OF tarief <= ev_prijsdrempel, OF het huidige kwartier
      # hoort bij het vastgelegde startmoment (planning op te laden kWh)
      # tot de vertrektijd (Zonneplan kwartier-forecast). Het aantal benodigde
      # kWh is dus NIET nodig: de auto laadt op die momenten tot hij vol is.
      # Niet toegestaan = 0 A (pauze), toegestaan = zo hoog als de ruimte toelaat.
      # ---------------------------------------------------------------
      - name: "EV LB Sonia goedkoop uur"
        unique_id: ev_lb_sonia_goedkoop_uur
        state: >
          {% set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] %}
          {# NOODSCHEMA: levert Zonneplan geen prijzen, dan 00:00-06:00 en 11:00-15:00 laden #}
          {% if fc | count == 0 %}
            {{ now().hour < 6 or 11 <= now().hour < 15 }}
          {% else %}
            {% set dl = today_at(states('input_datetime.ev_sonia_vertrek')) %}
            {% if dl <= now() %}{% set dl = dl + timedelta(days=1) %}{% endif %}
            {# Vanaf de vastgelegde starttijd (goedkoopste aaneengesloten blok, zie ev_blok_vastleggen)
               laden tot de auto zelf stopt of tot de vertrektijd; GEEN eindtijd van het blok. #}
            {% set k = (states('sensor.ev_sonia_plan_uren') | float(0) * 4) | round(0, 'ceil') | int %}
            {% set s_ts = state_attr('input_datetime.ev_sonia_blok_start', 'timestamp') | float(0) %}
            {% set nu = now().timestamp() %}
            {{ s_ts > dl.timestamp() - 86400 and s_ts <= nu }}
          {% endif %}
        attributes:
          doel_tijd: "{{ today_at(states('input_datetime.ev_sonia_vertrek')) if today_at(states('input_datetime.ev_sonia_vertrek')) > now() else today_at(states('input_datetime.ev_sonia_vertrek')) + timedelta(days=1) }}"
      - name: "EV LB Rob goedkoop uur"
        unique_id: ev_lb_rob_goedkoop_uur
        state: >
          {% set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] %}
          {# NOODSCHEMA: levert Zonneplan geen prijzen, dan 00:00-06:00 en 11:00-15:00 laden #}
          {% if fc | count == 0 %}
            {{ now().hour < 6 or 11 <= now().hour < 15 }}
          {% else %}
            {% set dl = today_at(states('input_datetime.ev_rob_vertrek')) %}
            {% if dl <= now() %}{% set dl = dl + timedelta(days=1) %}{% endif %}
            {# Vanaf de vastgelegde starttijd (goedkoopste aaneengesloten blok, zie ev_blok_vastleggen)
               laden tot de auto zelf stopt of tot de vertrektijd; GEEN eindtijd van het blok. #}
            {% set k = (states('sensor.ev_rob_plan_uren') | float(0) * 4) | round(0, 'ceil') | int %}
            {% set s_ts = state_attr('input_datetime.ev_rob_blok_start', 'timestamp') | float(0) %}
            {% set nu = now().timestamp() %}
            {{ s_ts > dl.timestamp() - 86400 and s_ts <= nu }}
          {% endif %}
        attributes:
          doel_tijd: "{{ today_at(states('input_datetime.ev_rob_vertrek')) if today_at(states('input_datetime.ev_rob_vertrek')) > now() else today_at(states('input_datetime.ev_rob_vertrek')) + timedelta(days=1) }}"
      - name: "EV LB Sonia laden toegestaan"
        unique_id: ev_lb_sonia_laden_toegestaan
        state: >
          {{ is_state('input_boolean.ev_sonia_direct_laden', 'on')
             or (is_state('input_boolean.ev_sonia_nacht_overslaan', 'off')
                 and is_state('input_boolean.ev_sonia_opladen_uitgezet', 'off')
                 and is_state('input_boolean.ev_sonia_alleen_zon', 'off')
                 and (states('sensor.zonneplan_current_electricity_tariff') | float(99)
                      <= states('input_number.ev_prijsdrempel') | float(-99)
                      or is_state('binary_sensor.ev_lb_sonia_goedkoop_uur', 'on'))) }}
      - name: "EV LB Rob laden toegestaan"
        unique_id: ev_lb_rob_laden_toegestaan
        state: >
          {{ is_state('input_boolean.ev_rob_direct_laden', 'on')
             or (is_state('input_boolean.ev_rob_nacht_overslaan', 'off')
                 and is_state('input_boolean.ev_rob_opladen_uitgezet', 'off')
                 and is_state('input_boolean.ev_rob_alleen_zon', 'off')
                 and (states('sensor.zonneplan_current_electricity_tariff') | float(99)
                      <= states('input_number.ev_prijsdrempel') | float(-99)
                      or is_state('binary_sensor.ev_lb_rob_goedkoop_uur', 'on'))) }}

      # ---------------------------------------------------------------
      # Is de lader echt verbonden en onder controle van HA?
      # De OCPP-integratie houdt na een verbroken verbinding soms de
      # oude waarden vast. Daarom kijken we naar de latency-sensor die
      # bij elke websocket-ping wordt bijgewerkt: is die > 120 s oud,
      # dan is de verbinding weg (bijv. OCPP uitgezet in de Ratio-app).
      # ---------------------------------------------------------------
      - name: "EV LB Rob onder controle"
        unique_id: ev_lb_rob_onder_controle
        device_class: connectivity
        state: >
          {% set e = states.sensor.ev_rob_latency_ping %}
          {{ e is not none and e.state not in ['unavailable', 'unknown']
             and (now() - e.last_reported).total_seconds() < 120
             and has_value('sensor.ev_rob_status_connector') }}
      - name: "EV LB Sonia onder controle"
        unique_id: ev_lb_sonia_onder_controle
        device_class: connectivity
        state: >
          {% set e = states.sensor.ev_sonia_latency_ping %}
          {{ e is not none and e.state not in ['unavailable', 'unknown']
             and (now() - e.last_reported).total_seconds() < 120
             and has_value('sensor.ev_sonia_status_connector') }}

      # Tekort t.o.v. regelgrens, 3 s aanhoudend (korte inschakelpieken negeren)
      - name: "EV LB tekort"
        unique_id: ev_lb_tekort
        delay_on: "00:00:03"
        availability: "{{ has_value('sensor.ev_lb_ruimte') }}"
        state: "{{ states('sensor.ev_lb_ruimte') | float(0) < 0 }}"
      # Tekort (boven regelgrens) 12 s aanhoudend: korte pulsen (Quooker, 5-10 s)
      # leiden niet tot terugregelen van de laders.
      - name: "EV LB tekort aanhoudend"
        unique_id: ev_lb_tekort_aanhoudend
        delay_on: "00:00:12"
        availability: "{{ has_value('sensor.ev_lb_ruimte') }}"
        state: "{{ states('sensor.ev_lb_ruimte') | float(0) < 0 }}"
      # 's Nachts (22:00-07:00) laden beide auto's tegelijk met een eigen
      # maximum (Sonia 12 A, Rob 10 A: samen past dat op L2 binnen de regelgrens)
      # in plaats van Rob te laten wachten tot Sonia klaar is. Overdag: strikte voorrang.
      - name: "EV LB deelmodus"
        unique_id: ev_lb_deelmodus
        state: >
          {% set nacht = now().hour >= 22 or now().hour < 7 %}
          {% set sonia = states('sensor.ev_sonia_status_connector') in ['Preparing', 'Charging', 'SuspendedEVSE']
                         and (is_state('binary_sensor.ev_lb_sonia_laden_toegestaan', 'on')
                              or is_state('binary_sensor.ev_lb_sonia_pv_laden', 'on')) %}
          {% set rob = states('sensor.ev_rob_status_connector') in ['Preparing', 'Charging', 'SuspendedEVSE']
                       and (is_state('binary_sensor.ev_lb_rob_laden_toegestaan', 'on')
                            or is_state('binary_sensor.ev_lb_rob_pv_laden', 'on')) %}
          {{ nacht and sonia and rob }}
      # Echte overschrijding van 25 A, 15 s aanhoudend (de Quooker geeft elke ~36 min
      # een puls van 5-10 s van ~9 A op L2; dat is voor de zekering geen gevaar).
      # Zware overschrijding (> zekering + 4 A) telt na 12 s (was 3 s, 28-10-2026: een
      # Quooker-puls van 5-10 s tot ~32 A zette Sonia op 0 A).
      - name: "EV LB overbelasting"
        unique_id: ev_lb_overbelasting
        device_class: problem
        delay_on: >
          {% set z = states('input_number.ev_lb_zekering') | float(25) %}
          {% set m = [ states('sensor.ev_lb_stroom_l1') | float(0),
                       states('sensor.ev_lb_stroom_l2') | float(0),
                       states('sensor.ev_lb_stroom_l3') | float(0) ] | max %}
          {{ '00:00:12' if m > z + 4 else '00:00:15' }}
        state: >
          {% set z = states('input_number.ev_lb_zekering') | float(25) %}
          {{ [ states('sensor.ev_lb_stroom_l1') | float(0),
               states('sensor.ev_lb_stroom_l2') | float(0),
               states('sensor.ev_lb_stroom_l3') | float(0) ] | max > z }}

script:
  ev_sonia_opladen_uitzetten:
    alias: "EV-Sonia – opladen uitzetten (knop)"
    sequence:
      # Eerst de vlag (dashboard-kleur direct goed), dan pas de boost uit
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev_sonia_opladen_uitgezet
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.ev_sonia_direct_laden
            - input_boolean.ev_sonia_alleen_zon
  ev_sonia_alleen_zon_laden:
    alias: "EV-Sonia – alleen gratis laden op zonnepanelen (knop)"
    sequence:
      # Dit was de routine van de knop 'Accu opladen uitzetten' voordat die ook
      # het zonneladen stopte: prijssturing uit, boost uit, PV-laden blijft werken.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev_sonia_alleen_zon
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.ev_sonia_opladen_uitgezet
            - input_boolean.ev_sonia_direct_laden
  ev_rob_opladen_uitzetten:
    alias: "EV-Rob – opladen uitzetten (knop)"
    sequence:
      # Eerst de vlag (dashboard-kleur direct goed), dan pas de boost uit
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev_rob_opladen_uitgezet
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.ev_rob_direct_laden
            - input_boolean.ev_rob_alleen_zon
  ev_rob_alleen_zon_laden:
    alias: "EV-Rob – alleen gratis laden op zonnepanelen (knop)"
    sequence:
      # Dit was de routine van de knop 'Accu opladen uitzetten' voordat die ook
      # het zonneladen stopte: prijssturing uit, boost uit, PV-laden blijft werken.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev_rob_alleen_zon
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.ev_rob_opladen_uitgezet
            - input_boolean.ev_rob_direct_laden
  ev_sonia_laden_volgens_planning:
    alias: "EV-Sonia – weer volgens planning laden (knop)"
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.ev_sonia_opladen_uitgezet
            - input_boolean.ev_sonia_alleen_zon
            - input_boolean.ev_sonia_direct_laden
      # Oude blokstart wissen (datum ver in het verleden = geen lopende cyclus);
      # ev_blok_vastleggen legt direct daarna de nieuwe start vast.
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ev_sonia_blok_start
        data:
          timestamp: 946684800
      - action: automation.trigger
        target:
          entity_id: automation.ev_goedkoopste_laadblok_vastleggen
        data:
          skip_condition: true
  ev_rob_laden_volgens_planning:
    alias: "EV-Rob – weer volgens planning laden (knop)"
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.ev_rob_opladen_uitgezet
            - input_boolean.ev_rob_alleen_zon
            - input_boolean.ev_rob_direct_laden
      # Oude blokstart wissen (datum ver in het verleden = geen lopende cyclus);
      # ev_blok_vastleggen legt direct daarna de nieuwe start vast.
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ev_rob_blok_start
        data:
          timestamp: 946684800
      - action: automation.trigger
        target:
          entity_id: automation.ev_goedkoopste_laadblok_vastleggen
        data:
          skip_condition: true
  # Schakelt huislasten uit (in lijstvolgorde, alleen wat aan staat)
  # tot er minstens 'nodig' ampère is afgeschakeld.
  # nodig = 0 → precies één last.
  ev_lb_volgende_uit:
    alias: "EV LB – huislasten afschakelen"
    mode: single
    fields:
      nodig:
        description: "Minimaal af te schakelen stroom in A (0 = één last)"
        default: 0
    sequence:
      - variables:
          lasten: "{{ state_attr('sensor.ev_lb_afschakellijst', 'lasten') or [] }}"
          doel: "{{ [nodig | float(0), 0.1] | max }}"
      - condition: template
        value_template: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) < lasten | count }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.ev_lb_afgeschakeld_a
        data:
          value: 0
      - repeat:
          sequence:
            - variables:
                idx: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) + 1 }}"
                l: "{{ lasten[idx - 1] }}"
                staat_aan: >
                  {{ states(l.entity) not in ['off', 'unavailable', 'unknown', l.uit | default('off')] }}
            - action: input_number.set_value
              target:
                entity_id: input_number.ev_lb_afschakel_niveau
              data:
                value: "{{ idx }}"
            - if: "{{ staat_aan }}"
              then:
                - action: scene.create
                  data:
                    scene_id: "ev_lb_last_{{ idx }}"
                    snapshot_entities:
                      - "{{ l.entity }}"
                - choose:
                    - conditions: "{{ l.type == 'select' }}"
                      sequence:
                        - action: select.select_option
                          target:
                            entity_id: "{{ l.entity }}"
                          data:
                            option: "{{ l.uit }}"
                  default:
                    - action: homeassistant.turn_off
                      target:
                        entity_id: "{{ l.entity }}"
                - action: input_number.set_value
                  target:
                    entity_id: input_number.ev_lb_afgeschakeld_a
                  data:
                    value: >
                      {{ [states('input_number.ev_lb_afgeschakeld_a') | float(0) + l.ampere | float(0), 200] | min }}
                - action: logbook.log
                  data:
                    name: "EV load balancing"
                    message: "Afgeschakeld: {{ l.naam }} (ruimte {{ states('sensor.ev_lb_ruimte') }} A)"
          until: >
            {{ states('input_number.ev_lb_afschakel_niveau') | int(0) >= lasten | count
               or states('input_number.ev_lb_afgeschakeld_a') | float(0) >= doel }}

  # Zet de laatst afgeschakelde last terug in zijn vorige stand
  ev_lb_volgende_aan:
    alias: "EV LB – volgende huislast herstellen"
    mode: single
    sequence:
      - variables:
          lasten: "{{ state_attr('sensor.ev_lb_afschakellijst', 'lasten') or [] }}"
      - condition: template
        value_template: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) > 0 }}"
      - repeat:
          sequence:
            - variables:
                idx: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) }}"
                sc: "scene.ev_lb_last_{{ idx }}"
                heeft_scene: "{{ sc in (states.scene | map(attribute='entity_id') | list) }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.ev_lb_afschakel_niveau
              data:
                value: "{{ idx - 1 }}"
            - if: "{{ heeft_scene }}"
              then:
                - action: scene.turn_on
                  target:
                    entity_id: "{{ sc }}"
                - action: scene.delete
                  target:
                    entity_id: "{{ sc }}"
                  continue_on_error: true
                - action: logbook.log
                  data:
                    name: "EV load balancing"
                    message: "Hersteld: {{ lasten[idx - 1].naam if idx <= lasten | count else sc }}"
                - stop: "Eén last hersteld"
          until: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) <= 0 }}"

  # Dynamisch profiel dat na 'duur' seconden vanzelf verloopt
  ev_lb_profiel:
    alias: "EV LB – verlopend laadprofiel sturen"
    mode: parallel
    fields:
      devid:
        description: "Charge point id"
      ampere:
        description: "Laadstroom in A"
      duur:
        description: "Geldigheid in seconden"
        default: 60
    sequence:
      - action: ocpp.set_charge_rate
        data:
          devid: "{{ devid }}"
          conn_id: 1
          custom_profile:
            chargingProfileId: 10
            stackLevel: 0
            chargingProfilePurpose: TxDefaultProfile
            chargingProfileKind: Absolute
            chargingSchedule:
              chargingRateUnit: A
              startSchedule: "{{ now() | as_timestamp | timestamp_custom('%Y-%m-%dT%H:%M:%SZ', false) }}"
              # Geen duration: de laatste periode blijft gelden. Na 'duur' s zonder
              # verversing valt de lader dus zelf terug op de terugvalstroom.
              chargingSchedulePeriod:
                - startPeriod: 0
                  limit: "{{ ampere | int }}"
                - startPeriod: "{{ duur | int(60) }}"
                  limit: "{{ states('input_number.ev_lb_terugval') | int(6) }}"
        continue_on_error: true

automation:
  - id: ev_opladen_uitgezet_vlag_wissen
    alias: "EV – knopvlag 'opladen uitgezet' wissen bij start laden of boost"
    mode: parallel
    triggers:
      - trigger: state
        entity_id: sensor.ev_sonia_status_connector
        to: "Charging"
        id: sonia
      - trigger: state
        entity_id: input_boolean.ev_sonia_direct_laden
        to: "on"
        id: sonia
      - trigger: state
        entity_id: sensor.ev_rob_status_connector
        to: "Charging"
        id: rob
      - trigger: state
        entity_id: input_boolean.ev_rob_direct_laden
        to: "on"
        id: rob
    # Een kortstondig 'Charging' (paar seconden) direct na het indrukken van
    # 'Opladen uitzetten' is de lader die nog niet op 0 A staat: de vlag dan
    # NIET wissen (gaf een gele flits op de knop, 21-10-2026). Boost wist altijd.
    conditions:
      - condition: template
        value_template: >
          {% set eid = 'input_boolean.ev_' ~ trigger.id ~ '_opladen_uitgezet' %}
          {% set v = states.input_boolean | selectattr('entity_id', 'eq', eid) | first %}
          {{ trigger.entity_id.endswith('direct_laden')
             or v is not defined
             or (now() - v.last_changed).total_seconds() > 60 }}
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: "input_boolean.ev_{{ trigger.id }}_opladen_uitgezet"
  - id: ev_id_tag_vastleggen
    alias: "EV – id_tag per laadsessie vastleggen"
    mode: parallel
    triggers:
      - trigger: state
        entity_id:
          - sensor.ev_sonia_id_tag
          - sensor.ev_rob_id_tag
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['', 'unknown', 'unavailable'] }}"
    actions:
      - variables:
          lader: "{{ 'sonia' if 'sonia' in trigger.entity_id else 'rob' }}"
          vorige: "{{ states('input_text.ev_' ~ lader ~ '_laatste_id_tag') | replace('unknown', '') | replace('unavailable', '') }}"
      - action: input_text.set_value
        target:
          entity_id: "input_text.ev_{{ lader }}_laatste_id_tag"
        data:
          value: "{{ trigger.to_state.state }}"
      - action: logbook.log
        data:
          name: "EV id_tag"
          message: >
            Lader {{ lader }}: sessie met id_tag {{ trigger.to_state.state }}
            ({{ 'zelfde als vorige sessie' if vorige == trigger.to_state.state else 'ANDERS dan vorige sessie (' ~ (vorige or 'geen') ~ ')' }}).
  # ---------------------------------------------------------------
  # Aantal fasen van de aangesloten auto herkennen aan het laadvermogen.
  # De lader meldt geen fasen; wel het (afgeleide) vermogen. Bij een stabiel
  # setpunt geldt: vermogen / (230 V x setpunt) = aantal fasen dat de auto
  # gebruikt (1 of 3). > 2,0 kan alleen 3-fase zijn -> direct. <= 1,25 (de auto
  # neemt dan 1 fase af) pas na 3 opeenvolgende metingen, om een 3-fase auto
  # aan het eind van de lading (neemt minder af dan het setpunt) niet als 1-fase
  # te zien. 1-fase staat op L2 (de Passat verscheen daar aan beide laders).
  # ---------------------------------------------------------------
  - id: ev_fasen_detecteren
    alias: "EV – aantal fasen van de auto herkennen"
    mode: queued
    triggers:
      - trigger: time_pattern
        seconds: "/15"
    actions:
      - repeat:
          for_each:
            - {naam: sonia, stabiel: 90}
            - {naam: rob, stabiel: 45}
          sequence:
            - variables:
                n: "{{ repeat.item.naam }}"
                fase_ent: "sensor.ev_lb_{{ n }}_fase_actief"
                tel_ent: "input_number.ev_{{ n }}_fase_bewijs"
                i_set: "{{ states('input_number.ev_lb_setpunt_' ~ n) | float(0) }}"
                p: "{{ states('sensor.ev_' ~ n ~ '_vermogen') | float(0) }}"
                stabiel_s: "{{ (now() - states['input_number.ev_lb_setpunt_' ~ n].last_changed).total_seconds() }}"
                geldig: >
                  {{ is_state('sensor.ev_' ~ n ~ '_status_connector', 'Charging')
                     and i_set >= 6 and p > 500 and stabiel_s >= repeat.item.stabiel }}
                r: "{{ (p / (230 * i_set)) if i_set > 0 else 0 }}"
                huidig: "{{ states(fase_ent) }}"
                teller: "{{ states(tel_ent) | int(0) }}"
            - choose:
                # Sterk bewijs voor 3 fasen (een 1-fase auto kan niet > 1,1 x halen)
                - conditions: "{{ geldig and r >= 2.0 and huidig != '3-fase' }}"
                  sequence:
                    - action: input_select.select_option
                      target:
                        entity_id: "{{ fase_ent }}"
                      data:
                        option: "3-fase"
                    - action: input_number.set_value
                      target:
                        entity_id: "{{ tel_ent }}"
                      data:
                        value: 0
                    - action: logbook.log
                      data:
                        name: "EV fasen"
                        message: "Lader {{ n }}: auto laadt op 3 fasen ({{ p | round(0) }} W bij {{ i_set | round(0) }} A)."
                # Auto neemt maar 1 fase af: pas na 3 metingen achter elkaar
                - conditions: "{{ geldig and 0.7 <= r <= 1.25 and huidig == '3-fase' }}"
                  sequence:
                    - if: "{{ teller >= 2 }}"
                      then:
                        - action: input_select.select_option
                          target:
                            entity_id: "{{ fase_ent }}"
                          data:
                            option: "L2"
                        - action: input_number.set_value
                          target:
                            entity_id: "{{ tel_ent }}"
                          data:
                            value: 0
                        - action: logbook.log
                          data:
                            name: "EV fasen"
                            message: "Lader {{ n }}: auto laadt op 1 fase, L2 ({{ p | round(0) }} W bij {{ i_set | round(0) }} A)."
                      else:
                        - action: input_number.set_value
                          target:
                            entity_id: "{{ tel_ent }}"
                          data:
                            value: "{{ teller + 1 }}"
              default:
                - if: "{{ teller > 0 and geldig }}"
                  then:
                    - action: input_number.set_value
                      target:
                        entity_id: "{{ tel_ent }}"
                      data:
                        value: 0
  - id: ev_nul_verlaten_vastleggen
    alias: "EV – vastleggen wanneer een setpunt van 0 A omhoog gaat"
    mode: parallel
    triggers:
      - trigger: state
        entity_id:
          - input_number.ev_lb_setpunt_sonia
          - input_number.ev_lb_setpunt_rob
        from: "0.0"
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state | float(0) > 0 }}"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: "input_datetime.ev_{{ 'sonia' if 'sonia' in trigger.entity_id else 'rob' }}_nul_verlaten"
        data:
          timestamp: "{{ now().timestamp() }}"
  - id: ev_blok_vastleggen
    alias: "EV – goedkoopste laadblok vastleggen"
    mode: queued
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - sensor.ev_sonia_blokplanning
          - sensor.ev_rob_blokplanning
    actions:
      - repeat:
          for_each: ["sonia", "rob"]
          sequence:
            - variables:
                p: "sensor.ev_{{ repeat.item }}_blokplanning"
                h: "input_datetime.ev_{{ repeat.item }}_blok_start"
                s_ts: "{{ state_attr(h, 'timestamp') | float(0) }}"
                nu: "{{ now().timestamp() }}"
                dl_iso: "{{ state_attr(p, 'dl') or '' }}"
                kand: "{{ state_attr(p, 'kandidaat_start') or '' }}"
                eerst: "{{ state_attr(p, 'eerste_start') or '' }}"
                # Blok hoort bij de lopende cyclus (na de vorige vertrektijd)
                cyclus: "{{ dl_iso != '' and s_ts > (dl_iso | as_datetime).timestamp() - 86400 }}"
                # Gestart (loopt of is klaar): niet meer verschuiven
                vast: "{{ cyclus and nu >= s_ts }}"
                k: "{{ state_attr(p, 'k') | int(0) }}"
                # 'Meteen starten' (eerst) alleen als er echt iets te laden is (k > 0);
                # bij k = 0 (bv. tijdens een herlaad) nooit een start vastleggen
                nieuw: "{{ kand or (eerst if k > 0 else '') }}"
            - if: >
                {{ not vast and nieuw != ''
                   and ((nieuw | as_datetime).timestamp() | round(0)) != (s_ts | round(0)) }}
              then:
                - action: input_datetime.set_datetime
                  target:
                    entity_id: "{{ h }}"
                  data:
                    timestamp: "{{ (nieuw | as_datetime).timestamp() }}"
  - id: ev_meetinterval_herstellen
    alias: "EV – meetinterval van de laders terugzetten op 10 s (na stroomuitval)"
    description: >
      Na een stroomuitval valt een lader terug op zijn standaard meetinterval van 60 s (gebeurde bij
      EV-Sonia op 27-10-2026). Met 60 s verspringt de energieteller maar één keer per minuut en loopt
      het afgeleide laadvermogen een minuut achter. Deze automatisering zet hem terug op 10 s zodra
      een lader weer verbonden is, bij het starten van HA en voor de zekerheid elk half uur.
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.ev_lb_rob_onder_controle
          - binary_sensor.ev_lb_sonia_onder_controle
        from:
          - "off"
          - "unavailable"
          - "unknown"
        to: "on"
        for: "00:00:30"
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/30"
    actions:
      - repeat:
          for_each:
            - ev_rob
            - ev_sonia
          sequence:
            - action: ocpp.get_configuration
              data:
                devid: "{{ repeat.item }}"
                ocpp_key: MeterValueSampleInterval
              response_variable: huidig
              continue_on_error: true
            - if: "{{ huidig is defined and huidig is mapping and (huidig.value | string) not in ['10', 'None', ''] }}"
              then:
                - action: ocpp.configure
                  data:
                    devid: "{{ repeat.item }}"
                    ocpp_key: MeterValueSampleInterval
                    value: "10"
                  continue_on_error: true
                - action: logbook.log
                  data:
                    name: "EV laders"
                    message: "Meetinterval van {{ repeat.item }} stond op {{ huidig.value }} s en is teruggezet op 10 s."
  - id: ev_fase_keuze_terug_naar_automatisch
    alias: "EV – fasekeuze van de lader terug naar Automatisch als de auto wordt losgekoppeld"
    description: >
      De fase van de auto wordt bij de start van het laden gemeten ('Automatisch'). Een vaste keuze in
      input_select.ev_lb_<lader>_fase blijft daarom maar voor één sessie gelden: zodra de auto wordt
      losgekoppeld (status Available) gaat de lader terug naar 'Automatisch' (27-10-2026).
    mode: parallel
    triggers:
      - trigger: state
        entity_id: sensor.ev_rob_status_connector
        to: "Available"
        for: "00:00:20"
        id: rob
      - trigger: state
        entity_id: sensor.ev_sonia_status_connector
        to: "Available"
        for: "00:00:20"
        id: sonia
    actions:
      - action: input_select.select_option
        target:
          entity_id: "input_select.ev_lb_{{ trigger.id }}_fase"
        data:
          option: "Automatisch"
  - id: ev_nacht_wel_opladen_knop
    alias: "EV – knop 's-nachts WEL opladen: gratis- en uitgezet-stand ook uit"
    description: >
      De knop 'Accu 's-nachts WEL opladen' zet 'morgen thuis blijven' uit. Alleen als dat op het
      scherm is gedaan (er is een gebruiker bij; het wissen op de vertrektijd telt niet) gaan ook
      'gratis laden' en 'opladen uitgezet' uit, anders blijft het laden geblokkeerd terwijl de
      status zegt dat 's-nachts wordt opgeladen (27-10-2026).
    mode: parallel
    triggers:
      - trigger: state
        entity_id: input_boolean.ev_sonia_nacht_overslaan
        from: "on"
        to: "off"
        id: sonia
      - trigger: state
        entity_id: input_boolean.ev_rob_nacht_overslaan
        from: "on"
        to: "off"
        id: rob
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.context.user_id is not none }}"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - "input_boolean.ev_{{ trigger.id }}_alleen_zon"
            - "input_boolean.ev_{{ trigger.id }}_opladen_uitgezet"
  - id: ev_nacht_overslaan_wissen
    alias: "EV – knop 'nacht overslaan' wissen op vertrektijd of bij boost"
    mode: parallel
    triggers:
      - trigger: time
        at: input_datetime.ev_sonia_vertrek
        id: sonia
      - trigger: time
        at: input_datetime.ev_rob_vertrek
        id: rob
      - trigger: state
        entity_id: input_boolean.ev_sonia_direct_laden
        to: "on"
        id: sonia
      - trigger: state
        entity_id: input_boolean.ev_rob_direct_laden
        to: "on"
        id: rob
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: "input_boolean.ev_{{ trigger.id }}_nacht_overslaan"
      - action: input_boolean.turn_off
        target:
          entity_id: "input_boolean.ev_{{ trigger.id }}_opladen_uitgezet"
      - action: input_boolean.turn_off
        target:
          entity_id: "input_boolean.ev_{{ trigger.id }}_alleen_zon"
  # ---------------------------------------------------------------
  # Na een herstart van HA: setpunten op 6 A, daarna rustig opbouwen.
  # (Hier worden bewust GEEN profielen naar de laders geschreven: een apart
  # basisprofiel begrenst de dynamische stroom, de lader neemt het laagste.
  # Het oude script ev_lb_basisprofiel werd ook bij 'weer verbonden' aangeroepen
  # en zette zo na elke template-/automation-reload een 6 A-limiet. Verwijderd.)
  # ---------------------------------------------------------------
  - id: ev_lb_herstart_setpunten
    alias: "EV – setpunten na herstart op 6 A"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.ev_lb_setpunt_rob
            - input_number.ev_lb_setpunt_sonia
        data:
          value: 6

  # ---------------------------------------------------------------
  # Dynamische regeling: snel omlaag, langzaam omhoog, elke 20 s verversen
  # ---------------------------------------------------------------
  - id: ev_lb_dynamisch
    alias: "EV – dynamische load balancing (P1, voorrang Sonia)"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.ev_lb_ruimte
        id: meting
      - trigger: state
        entity_id:
          - binary_sensor.ev_lb_overbelasting
          - binary_sensor.ev_lb_tekort_aanhoudend
        to: "on"
        id: meting
      - trigger: time_pattern
        seconds: "/10"
        id: ramp
      - trigger: state
        entity_id:
          - binary_sensor.ev_lb_rob_laden_toegestaan
          - binary_sensor.ev_lb_sonia_laden_toegestaan
        id: ramp
      - trigger: state
        entity_id:
          - sensor.ev_rob_status_connector
          - sensor.ev_sonia_status_connector
        to: "Charging"
        id: start
    conditions:
      - condition: state
        entity_id: input_boolean.ev_lb_actief
        state: "on"
      # P1-data moet vers zijn; anders niets sturen → lader valt terug op basis
      - condition: template
        value_template: >
          {% set ns = namespace(ok=true) %}
          {% for f in [1, 2, 3] %}
            {% set e = states['sensor.p1_meter_power_phase_' ~ f] %}
            {% if e is none or e.state in ['unavailable', 'unknown']
                  or (now() - e.last_reported).total_seconds() > 30 %}
              {% set ns.ok = false %}
            {% endif %}
          {% endfor %}
          {{ ns.ok and has_value('sensor.ev_lb_ruimte') }}
      # Beschermt tegen een tijdelijk 'unavailable' van de eigen template-sensoren
      # (template.reload, herstart): anders ziet de regeling de laders ten onrechte
      # als 'niet bezig' en zet hij ze op 0/6 A (gebeurde op 20-10-2026 om 19:26).
      - condition: template
        value_template: >
          {{ has_value('binary_sensor.ev_lb_sonia_onder_controle')
             and has_value('binary_sensor.ev_lb_rob_onder_controle')
             and has_value('binary_sensor.ev_lb_sonia_laden_toegestaan')
             and has_value('binary_sensor.ev_lb_rob_laden_toegestaan')
             and has_value('binary_sensor.ev_lb_sonia_pv_laden')
             and has_value('binary_sensor.ev_lb_rob_pv_laden')
             and has_value('sensor.ev_lb_pv_overschot') }}
    variables:
      # VOLGORDE = VOORRANG. De eerste krijgt als eerste ruimte bij opregelen;
      # bij terugregelen gaat de laatste (Rob) als eerste omlaag.
      laders:
        - naam: sonia
          devid: "ev_sonia"
          status: sensor.ev_sonia_status_connector
          setpunt: input_number.ev_lb_setpunt_sonia
          max: input_number.ev_lb_max_sonia
          stap: 4          # sneller omhoog: +4 A per 10 s
          controle: binary_sensor.ev_lb_sonia_onder_controle
          toegestaan: binary_sensor.ev_lb_sonia_laden_toegestaan
          pv: binary_sensor.ev_lb_sonia_pv_laden
          uitgezet: input_boolean.ev_sonia_opladen_uitgezet
          vermogen: sensor.ev_sonia_vermogen
          fase: sensor.ev_lb_sonia_fase_actief
        - naam: rob
          devid: "ev_rob"
          status: sensor.ev_rob_status_connector
          setpunt: input_number.ev_lb_setpunt_rob
          max: input_number.ev_lb_max_rob
          stap: 2
          controle: binary_sensor.ev_lb_rob_onder_controle
          toegestaan: binary_sensor.ev_lb_rob_laden_toegestaan
          pv: binary_sensor.ev_lb_rob_pv_laden
          uitgezet: input_boolean.ev_rob_opladen_uitgezet
          vermogen: sensor.ev_rob_vermogen
          fase: sensor.ev_lb_rob_fase_actief
      # Werkelijke laadstroom van Sonia's lader (OCPP), om te zien of haar auto
      # het aangeboden vermogen ook echt afneemt.
      sonia_stroom: sensor.ev_sonia_stroom   # afgeleid uit de energieteller (A per fase)
      bezig_statussen: ["Charging", "SuspendedEVSE"]
    actions:
      - variables:
          ruimte: "{{ states('sensor.ev_lb_ruimte') | float(0) }}"
          overbelast: "{{ is_state('binary_sensor.ev_lb_overbelasting', 'on') }}"
          niveau: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) }}"
          verversen: "{{ trigger.id == 'ramp' and now().second % 20 < 10 }}"
          deel: "{{ is_state('binary_sensor.ev_lb_deelmodus', 'on') }}"
          # 'Zwaar' = meer dan zekering + 4 A (29 A), onafhankelijk van de marge:
          # ruimte < -(4 + marge)
          zwaar: "{{ -(4 + states('input_number.ev_lb_marge') | float(2)) }}"
          tekort_lang: "{{ is_state('binary_sensor.ev_lb_tekort_aanhoudend', 'on') }}"
          # Eerst de huislasten (fietsaccu) uit; pas als de hele afschakellijst
          # uit staat gaan de laders terug (zie ev_lb_afschakelen)
          lasten_uit: "{{ niveau >= (state_attr('sensor.ev_lb_afschakellijst', 'lasten') or []) | count }}"
      - condition: template
        value_template: "{{ trigger.id != 'meting' or ruimte < 0 or overbelast }}"
      - variables:
          plan: >
            {% set ns = namespace(rest=ruimte, out={}) %}
            {# Zwaarst belaste fase: alleen laders die op die fase laden helpen daar #}
            {% set fi = {'L1': states('sensor.ev_lb_stroom_l1') | float(0),
                         'L2': states('sensor.ev_lb_stroom_l2') | float(0),
                         'L3': states('sensor.ev_lb_stroom_l3') | float(0)} %}
            {% set slechtste = fi | dictsort(false, 'value') | last | first %}
            {% for l in laders %}
              {# Niet verbonden = niet stuurbaar: telt niet mee als 'bezig'.
                 Zijn stroom zit wel in de P1-meting, dus de rest regelt eromheen. #}
              {% set b = states(l.status) in bezig_statussen and is_state(l.controle, 'on') %}
              {% set h = states(l.setpunt) | int(0) %}
              {% set ns.out = dict(ns.out, **{l.naam: {'bezig': b, 'huidig': h, 'nieuw': (h if b else 6), 'tg': is_state(l.toegestaan, 'on'), 'pv': is_state(l.pv, 'on') and is_state(l.uitgezet, 'off')}}) %}
            {% endfor %}
            {# PV-PRIORITEIT (27-10-2026): laden beide auto's alleen op zonne-overschot (geen van beide
               mag om prijsredenen), dan gaat de auto op 1 fase voor: die kan al vanaf 1,4 kW laden,
               een 3-fase auto pas vanaf 4,1 kW. Anders is Sonia (voorrang) de eerste. Alleen overdag;
               's nachts (deelmodus) delen ze. #}
            {% set so = ns.out['sonia'] %}
            {% set ro = ns.out['rob'] %}
            {% set rob_voor = not deel and so.bezig and ro.bezig and not so.tg and not ro.tg and so.pv and ro.pv
                              and is_state('sensor.ev_lb_sonia_fase_actief', '3-fase')
                              and not is_state('sensor.ev_lb_rob_fase_actief', '3-fase') %}
            {% set voorrang = 'rob' if rob_voor else 'sonia' %}
            {% set volgorde = (laders | reverse | list) if rob_voor else (laders | list) %}

            {% if overbelast and ruimte < zwaar and lasten_uit %}
              {# Noodstop: zware overschrijding (> 29 A): alles wat laadt eerst naar
                 6 A (de auto blijft dan doorladen); staat hij al op <= 6 A en blijft
                 het overbelast, dan naar 0 A #}
              {% for l in laders %}
                {% set o = ns.out[l.naam] %}
                {% if o.bezig %}{% set ns.out = dict(ns.out, **{l.naam: dict(o, nieuw=(6 if o.huidig > 6 else 0))}) %}{% endif %}
              {% endfor %}

            {% elif overbelast and lasten_uit %}
              {# Lichte overschrijding (25-29 A, bv. een korte piek van de Quooker):
                 niet stoppen maar zo ver omlaag als nodig, met 3 A extra marge.
                 Eerst Rob, dan Sonia; pas bij < 6 A gaat een lader naar 0 A.
                 Daarna loopt de ramp-regeling hem vanzelf weer omhoog. #}
              {% set ns.rest = ruimte - 3 %}
              {% for l in laders | reverse %}
                {% set o = ns.out[l.naam] %}
                {% if o.bezig and ns.rest < 0 and o.huidig > 0 and (is_state(l.fase, '3-fase') or states(l.fase) == slechtste) %}
                  {% set x = (o.huidig + ns.rest) | round(0, 'floor') | int %}
                  {% set x = x if x >= 6 else 0 %}
                  {% set ns.rest = ns.rest + (o.huidig - x) %}
                  {% set ns.out = dict(ns.out, **{l.naam: dict(o, nieuw=x)}) %}
                {% endif %}
              {% endfor %}

            {% elif ruimte < 0 and tekort_lang and lasten_uit %}
              {# OMLAAG na 12 s tekort (ook bij zwaar tekort, zodat een Quooker-puls van 5-10 s niet tot 0 A leidt): eerst Rob, dan pas Sonia #}
              {% for l in laders | reverse %}
                {% set o = ns.out[l.naam] %}
                {% if o.bezig and ns.rest < 0 and o.huidig > 0 and (is_state(l.fase, '3-fase') or states(l.fase) == slechtste) %}
                  {% set x = (o.huidig + ns.rest) | round(0, 'floor') | int %}
                  {% set x = x if x >= 6 else 0 %}
                  {% set ns.rest = ns.rest + (o.huidig - x) %}
                  {% set ns.out = dict(ns.out, **{l.naam: dict(o, nieuw=x)}) %}
                {% endif %}
              {% endfor %}

            {% elif trigger.id == 'start' %}
              {# Nieuwe sessie op de lader die de trigger gaf: laag beginnen #}
              {% for l in laders %}
                {% set o = ns.out[l.naam] %}
                {% set sw = l.naam != voorrang and not deel and ns.out[voorrang].bezig and (ns.out[voorrang].tg or ns.out[voorrang].pv)
                            and ns.out[voorrang].huidig < states('input_number.ev_lb_max_' ~ voorrang) | int(16) %}
                {% if o.bezig and trigger.entity_id == l.status %}
                  {% set ns.out = dict(ns.out, **{l.naam: dict(o, nieuw=(6 if (ruimte >= 0 and not sw) else 0))}) %}
                {% endif %}
              {% endfor %}

            {% elif trigger.id == 'ramp' and niveau == 0 %}
              {# OMHOOG: Sonia eerst, Rob krijgt wat overblijft; 1 A buffer #}
              {% set ns.rest = ns.rest - 1 %}
              {% for l in volgorde %}
                {% set o = ns.out[l.naam] %}
                {% set mx = states(l.max) | int(10) %}
                {% if deel %}{% set mx = [mx, states('input_number.ev_lb_deel_max_' ~ l.naam) | int(mx)] | min %}{% endif %}
                {# STRIKTE VOORRANG (overdag): Rob mag pas omhoog als Sonia op haar max zit (of niet laadt/mag laden).
                   's Nachts (deelmodus) laden beide tegelijk met eigen maximum. #}
                {% set wacht = l.naam != voorrang and not deel and ns.out[voorrang].bezig and (ns.out[voorrang].tg or ns.out[voorrang].pv)
                               and ns.out[voorrang].nieuw < states('input_number.ev_lb_max_' ~ voorrang) | int(16) %}
                {% if o.bezig and (o.tg or o.pv) and not wacht %}
                  {% if o.huidig > mx %}
                    {% set x = mx %}
                  {% elif o.huidig == 0 %}
                    {% set x = 6 if ns.rest >= 7 else 0 %}
                  {% else %}
                    {% set st = [[l.stap, ns.rest | round(0, 'floor') | int] | min, 0] | max %}
                    {% set x = [o.huidig + st, mx] | min %}
                  {% endif %}
                  {% set ns.rest = ns.rest - (x - o.huidig) %}
                  {% set ns.out = dict(ns.out, **{l.naam: dict(o, nieuw=x)}) %}
                {% endif %}
              {% endfor %}

              {# VOORRANG: Sonia zit niet op max, krijgt geen ruimte erbij en haar
                 auto neemt het aanbod echt af → Rob 2 A omlaag. De vrijgekomen
                 ruimte gaat bij de volgende ronde (10 s) naar Sonia. #}
              {% set s = ns.out['sonia'] %}
              {% set r = ns.out['rob'] %}
              {% set smax = states('input_number.ev_lb_max_sonia') | int(16) %}
              {% if deel %}{% set smax = [smax, states('input_number.ev_lb_deel_max_sonia') | int(smax)] | min %}{% endif %}
              {% set rmin = states('input_number.ev_lb_min_rob') | int(6) %}
              {% set s_neemt_af = states(sonia_stroom) | float(99) >= s.huidig - 2 %}
              {% if not rob_voor and s.bezig and r.bezig and s.huidig > 0 and s.nieuw == s.huidig
                    and s.nieuw < smax and s_neemt_af and r.nieuw > rmin and r.nieuw > 0 %}
                {% set x = [r.nieuw - 2, rmin] | max %}
                {% set x = x if x >= 6 else 0 %}
                {% set ns.out = dict(ns.out, **{'rob': dict(r, nieuw=x)}) %}
              {% endif %}
            {% endif %}
            {# PRIJSSTURING: lader die om prijsredenen mag laden krijgt de volle
               ruimte. Een lader die dat niet mag maar wel zon heeft (pv), wordt
               begrensd op het PV-overschot (A = W / (230 x fasen)), na aftrek van
               wat de prijs-laders al afnemen. Geen van beide: 0 A (pauze). #}
            {% set pvs = namespace(w=states('sensor.ev_lb_pv_overschot') | float(0)) %}
            {% for l in laders %}
              {% if ns.out[l.naam].tg %}{% set pvs.w = pvs.w - states(l.vermogen) | float(0) %}{% endif %}
            {% endfor %}
            {% for l in volgorde %}
              {% set o = ns.out[l.naam] %}
              {% if o.bezig and not o.tg %}
                {% set f = 3 if is_state(l.fase, '3-fase') else 1 %}
                {% set cap = ([pvs.w, 0] | max / (230 * f)) | int if o.pv else 0 %}
                {# 3-fase lader: al starten op 6 A als het restoverschot minstens de ingestelde drempel is
                   (standaard 2 kW); het tekort tot 4,1 kW komt uit het net. Als hij al laadt geldt een
                   lagere drempel (-300 W), tegen aan/uit-pendelen rond de grens (27-10-2026). #}
                {% set drempel = states('input_number.ev_lb_zon_min_3fase') | float(9999) %}
                {% set drempel = drempel if o.huidig < 6 else drempel - 300 %}
                {% if f == 3 and cap < 6 and o.pv and drempel < 4140 and ([pvs.w, 0] | max) >= drempel %}{% set cap = 6 %}{% endif %}
                {% set cap = cap if cap >= 6 else 0 %}
                {# Reserveer hooguit wat deze lader maximaal kan gebruiken (zijn max), anders claimt de
                   eerste lader al het overschot en blijft er voor de tweede niets over (27-10-2026). #}
                {% set pvs.w = pvs.w - ([cap, states(l.max) | int(16)] | min) * 230 * f %}
                {% set x = [o.nieuw, cap] | min %}
                {% set x = x if x >= 6 else 0 %}
                {% set ns.out = dict(ns.out, **{l.naam: dict(o, nieuw=x)}) %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ laders }}"
          sequence:
            - variables:
                o: "{{ plan[repeat.item.naam] }}"
            - if: >
                {{ o.bezig and ((o.nieuw | int) != (o.huidig | int) or trigger.id == 'start' or verversen) }}
              then:
                - action: script.ev_lb_profiel
                  data:
                    devid: "{{ repeat.item.devid }}"
                    ampere: "{{ o.nieuw | int }}"
                    duur: 60
            - if: "{{ (o.nieuw | int) != (o.huidig | int) }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item.setpunt }}"
                  data:
                    value: "{{ o.nieuw | int }}"

  # ---------------------------------------------------------------
  # PRIJSSTURING: lader automatisch starten (charge_control) zodra de auto
  # is aangesloten (status Preparing) en laden is toegestaan. Pauzeren gebeurt
  # via 0 A in ev_lb_dynamisch, niet via charge_control (een gestopte sessie
  # kan alleen na opnieuw insteken weer starten). Eerst 6 A als profiel,
  # zodat de lader niet even op vol vermogen start.
  # ---------------------------------------------------------------
  - id: ev_lb_laden_starten
    alias: "EV – lader automatisch starten (prijssturing)"
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - sensor.ev_rob_status_connector
          - sensor.ev_sonia_status_connector
        to: "Preparing"
        for: "00:00:05"
      - trigger: state
        entity_id:
          - binary_sensor.ev_lb_rob_laden_toegestaan
          - binary_sensor.ev_lb_sonia_laden_toegestaan
          - binary_sensor.ev_lb_rob_pv_laden
          - binary_sensor.ev_lb_sonia_pv_laden
        to: "on"
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.ev_lb_actief
        state: "on"
    actions:
      - repeat:
          for_each:
            - {naam: sonia, devid: ev_sonia}
            - {naam: rob, devid: ev_rob}
          sequence:
            - variables:
                status: "sensor.ev_{{ repeat.item.naam }}_status_connector"
                toegestaan: "binary_sensor.ev_lb_{{ repeat.item.naam }}_laden_toegestaan"
                pv: "binary_sensor.ev_lb_{{ repeat.item.naam }}_pv_laden"
                controle: "binary_sensor.ev_lb_{{ repeat.item.naam }}_onder_controle"
                schakelaar: "switch.ev_{{ repeat.item.naam }}_charge_control"
            - if:
                - condition: template
                  value_template: >
                    {# De lader zonder voorrang start pas als de lader MET voorrang op zijn max zit (of niet
                       laadt/mag laden) EN er minstens 7 A ruimte is (6 A minimum + 1 A buffer); zonder
                       ruimte gaf de start een piek van > 23 A op de zwaarst belaste fase.
                       Voorrang = Sonia, behalve als beide auto's alleen op zonne-overschot laden en Rob
                       op 1 fase en Sonia op 3 fasen laadt: dan Rob (27-10-2026). #}
                    {% set deel = is_state('binary_sensor.ev_lb_deelmodus', 'on') %}
                    {% set verbonden = ['Preparing', 'Charging', 'SuspendedEVSE'] %}
                    {% set pv_alleen = states('sensor.ev_sonia_status_connector') in verbonden
                         and states('sensor.ev_rob_status_connector') in verbonden
                         and is_state('binary_sensor.ev_lb_sonia_laden_toegestaan', 'off')
                         and is_state('binary_sensor.ev_lb_rob_laden_toegestaan', 'off')
                         and is_state('binary_sensor.ev_lb_sonia_pv_laden', 'on')
                         and is_state('binary_sensor.ev_lb_rob_pv_laden', 'on')
                         and is_state('input_boolean.ev_sonia_opladen_uitgezet', 'off')
                         and is_state('input_boolean.ev_rob_opladen_uitgezet', 'off') %}
                    {% set rob_voor = not deel and pv_alleen
                         and is_state('sensor.ev_lb_sonia_fase_actief', '3-fase')
                         and not is_state('sensor.ev_lb_rob_fase_actief', '3-fase') %}
                    {% set voor = 'rob' if rob_voor else 'sonia' %}
                    {% set sonia_wacht = repeat.item.naam != voor
                         and not deel
                         and states('sensor.ev_' ~ voor ~ '_status_connector') in verbonden
                         and (is_state('binary_sensor.ev_lb_' ~ voor ~ '_laden_toegestaan', 'on')
                              or is_state('binary_sensor.ev_lb_' ~ voor ~ '_pv_laden', 'on'))
                         and states('input_number.ev_lb_setpunt_' ~ voor) | int(0)
                             < states('input_number.ev_lb_max_' ~ voor) | int(16) %}
                    {{ is_state(status, 'Preparing')
                       and (is_state(toegestaan, 'on')
                            or (is_state(pv, 'on') and is_state('input_boolean.ev_' ~ repeat.item.naam ~ '_opladen_uitgezet', 'off')))
                       and is_state(controle, 'on') and is_state(schakelaar, 'off')
                       and not sonia_wacht
                       and (repeat.item.naam != 'rob' or states('sensor.ev_lb_ruimte') | float(0) >= 7) }}
              then:
                - action: script.ev_lb_profiel
                  data:
                    devid: "{{ repeat.item.devid }}"
                    ampere: 6
                    duur: 60
                - delay: "00:00:02"
                - action: switch.turn_on
                  target:
                    entity_id: "{{ schakelaar }}"
                # De lader legt bij de start een profiel vast dat ons dynamische
                # profiel niet meer overschrijft (auto bleef op 6 A). Daarom na
                # de start eenmalig wissen en direct een nieuw profiel sturen.
                - wait_template: "{{ is_state(status, 'Charging') }}"
                  timeout: "00:00:30"
                  continue_on_timeout: true
                - action: ocpp.clear_profile
                  data:
                    devid: "{{ repeat.item.devid }}"
                  continue_on_error: true
                - action: script.ev_lb_profiel
                  data:
                    devid: "{{ repeat.item.devid }}"
                    ampere: 6
                    duur: 60
                - action: logbook.log
                  data:
                    name: "EV load balancing"
                    message: "Lader {{ repeat.item.naam }} gestart (laden toegestaan)."

  # Na een korte noodstop (0 A) pauzeert de auto soms zelf (SuspendedEV) en pakt
  # het laden niet vanzelf weer op. Dan het profiel opnieuw sturen (zonder de
  # sessie te stoppen). Alleen binnen 10 min na een overbelasting, zodat een
  # volle accu niet eindeloos wordt 'gewekt'.
  - id: ev_lb_herstel_na_noodstop
    alias: "EV – laden hervatten na noodstop (auto gepauzeerd)"
    mode: parallel
    triggers:
      - trigger: state
        entity_id:
          - sensor.ev_rob_status_connector
          - sensor.ev_sonia_status_connector
        to: "SuspendedEV"
        for: "00:00:20"
        id: pauze
      - trigger: time_pattern
        seconds: "/30"
        id: herhaal
    conditions:
      - condition: state
        entity_id: input_boolean.ev_lb_actief
        state: "on"
    actions:
      - repeat:
          for_each:
            - {naam: sonia, devid: ev_sonia}
            - {naam: rob, devid: ev_rob}
          sequence:
            - if:
                - condition: template
                  value_template: >
                    {% set n = repeat.item.naam %}
                    {# Binnen 10 min na een overbelasting OF nadat dit setpunt van 0 A omhoog ging; hervatpogingen alleen in de eerste 2 min van een pauze (daarna neemt de auto gewoon geen stroom af) #}
                    {% set nul_ts = state_attr('input_datetime.ev_' ~ n ~ '_nul_verlaten', 'timestamp') | float(0) %}
                    {% set recent = is_state('binary_sensor.ev_lb_overbelasting', 'on')
                         or (now() - states.binary_sensor.ev_lb_overbelasting.last_changed).total_seconds() < 600
                         or now().timestamp() - nul_ts < 600 %}
                    {{ recent and is_state('sensor.ev_' ~ n ~ '_status_connector', 'SuspendedEV')
                       and (now() - states['sensor.ev_' ~ n ~ '_status_connector'].last_changed).total_seconds() >= 20
                       and (now() - states['sensor.ev_' ~ n ~ '_status_connector'].last_changed).total_seconds() < 120
                       and (is_state('binary_sensor.ev_lb_' ~ n ~ '_laden_toegestaan', 'on')
                            or is_state('binary_sensor.ev_lb_' ~ n ~ '_pv_laden', 'on'))
                       and is_state('switch.ev_' ~ n ~ '_charge_control', 'on')
                       and states('input_number.ev_lb_setpunt_' ~ n) | int(0) >= 6
                       and states('sensor.ev_lb_ruimte') | float(0) >= 7 }}
              then:
                - action: ocpp.clear_profile
                  data:
                    devid: "{{ repeat.item.devid }}"
                  continue_on_error: true
                - action: script.ev_lb_profiel
                  data:
                    devid: "{{ repeat.item.devid }}"
                    ampere: 6
                    duur: 60
                - action: logbook.log
                  data:
                    name: "EV load balancing"
                    message: "Lader {{ repeat.item.naam }}: laden hervat na noodstop (auto was gepauzeerd)."

  # ---------------------------------------------------------------
  # Noodstop-acties naast de regeling (bijverwarming uit + melding)
  # ---------------------------------------------------------------
  - id: ev_lb_noodstop
    alias: "EV – noodstop overbelasting hoofdaansluiting"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.ev_lb_overbelasting
        to: "on"
    actions:
      # Lichte piek (25-29 A, bv. Quooker): de laders regelen zelf af, alleen loggen.
      # Zware overschrijding (> 29 A): noodstop-meldingen zoals voorheen.
      # 'Zwaar' = meer dan zekering + 4 A, dus ruimte < -(4 + marge)
      - if: "{{ states('sensor.ev_lb_ruimte') | float(0) >= -(4 + states('input_number.ev_lb_marge') | float(2)) }}"
        then:
          - action: logbook.log
            data:
              name: "EV load balancing"
              message: >
                Korte piek boven {{ states('input_number.ev_lb_zekering') }} A
                (L1 {{ states('sensor.ev_lb_stroom_l1') }}, L2 {{ states('sensor.ev_lb_stroom_l2') }},
                L3 {{ states('sensor.ev_lb_stroom_l3') }} A): laders regelen af.
        else:
          - action: persistent_notification.create
            data:
              notification_id: ev_lb_overbelasting
              title: "⚡ Overbelasting huisaansluiting"
              message: >
                Fase boven {{ states('input_number.ev_lb_zekering') }} A
                (L1 {{ states('sensor.ev_lb_stroom_l1') }} A,
                 L2 {{ states('sensor.ev_lb_stroom_l2') }} A,
                 L3 {{ states('sensor.ev_lb_stroom_l3') }} A).
                Laders gepauzeerd; huislasten worden afgeschakeld.
          - action: notify.mobile_app_sm_g781b
            data:
              title: "⚡ Overbelasting huisaansluiting"
              message: >
                Laders gepauzeerd en huislasten worden afgeschakeld.
                Zet zware apparaten (oven, inductie, Quooker) even uit.
            continue_on_error: true
          # Blijft het na 20 s nog steeds overbelast: dringende tweede melding.
          # Dan is alles wat HA kan uitzetten al uit; de rest moet met de hand.
          - wait_for_trigger:
              - trigger: state
                entity_id: binary_sensor.ev_lb_overbelasting
                to: "off"
            timeout: "00:00:20"
          - if: "{{ is_state('binary_sensor.ev_lb_overbelasting', 'on') }}"
            then:
              - action: notify.mobile_app_sm_g781b
                data:
                  title: "⚡⚡ Nog steeds overbelast"
                  message: >
                    Alle stuurbare lasten zijn uit, maar een fase blijft boven
                    {{ states('input_number.ev_lb_zekering') }} A. Zet nu handmatig
                    oven/inductie/Quooker uit, anders kan de hoofdzekering eruit.
                  data:
                    push:
                      interruption-level: critical
                continue_on_error: true

  # ---------------------------------------------------------------
  # Huislasten afschakelen — EERST (fietsaccu), daarna pas de laders terug
  # ---------------------------------------------------------------
  - id: ev_lb_afschakelen
    alias: "EV – huislasten afschakelen bij tekort"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.ev_lb_tekort_aanhoudend
          - binary_sensor.ev_lb_overbelasting
        to: "on"
      - trigger: time_pattern
        seconds: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.ev_lb_actief
        state: "on"
      - condition: template
        value_template: >
          {{ is_state('binary_sensor.ev_lb_tekort_aanhoudend', 'on')
             or is_state('binary_sensor.ev_lb_overbelasting', 'on') }}
      # Max één last per 5 s, zodat de meting kan bijkomen
      - condition: template
        value_template: >
          {{ (now() - states.input_number.ev_lb_afschakel_niveau.last_changed).total_seconds() >= 5 }}
    actions:
      # Gewoon tekort: één last per keer.
      # Echte overbelasting: in één keer genoeg lasten om terug onder
      # de regelgrens (zekering − marge) te komen, plus 1 A extra.
      - action: script.ev_lb_volgende_uit
        data:
          nodig: >
            {% if is_state('binary_sensor.ev_lb_overbelasting', 'on') %}
              {{ ([0 - states('sensor.ev_lb_ruimte') | float(0), 0] | max + 1) | round(1) }}
            {% else %}
              0
            {% endif %}

  # ---------------------------------------------------------------
  # Huislasten herstellen — één per keer, pas als er ruim plek is
  # ---------------------------------------------------------------
  - id: ev_lb_herstellen
    alias: "EV – afgeschakelde huislasten herstellen"
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/30"
    conditions:
      - condition: template
        value_template: >
          {% set n = states('input_number.ev_lb_afschakel_niveau') | int(0) %}
          {% set lasten = state_attr('sensor.ev_lb_afschakellijst', 'lasten') or [] %}
          {% set nodig = (lasten[n - 1].ampere if 0 < n <= lasten | count else 10) + 2 %}
          {{ n > 0
             and is_state('binary_sensor.ev_lb_tekort', 'off')
             and is_state('binary_sensor.ev_lb_overbelasting', 'off')
             and states('sensor.ev_lb_ruimte') | float(0) >= nodig
             and (now() - states.input_number.ev_lb_afschakel_niveau.last_changed).total_seconds() >= 120 }}
    actions:
      - action: script.ev_lb_volgende_aan

  # ---------------------------------------------------------------
  # Na herstart: snapshots zijn weg → melden en niveau resetten
  # ---------------------------------------------------------------
  - id: ev_lb_herstart
    alias: "EV – afschakelniveau na herstart"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) > 0 }}"
    actions:
      - variables:
          lasten: "{{ state_attr('sensor.ev_lb_afschakellijst', 'lasten') or [] }}"
          n: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) }}"
      - action: persistent_notification.create
        data:
          notification_id: ev_lb_herstart
          title: "EV load balancing – controleer huislasten"
          message: >
            HA is herstart terwijl er lasten afgeschakeld waren. Controleer of deze
            weer aan staan: {{ lasten[:n] | map(attribute='naam') | join(', ') }}.
      - action: input_number.set_value
        target:
          entity_id: input_number.ev_lb_afschakel_niveau
        data:
          value: 0

  # ---------------------------------------------------------------
  # Melding als P1-data verouderd is (regeling stuurt dan niets meer)
  # ---------------------------------------------------------------
  - id: ev_lb_p1_melding
    alias: "EV – melding P1-data verouderd"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: template
        value_template: >
          {% set e = states.sensor.p1_meter_power_phase_1 %}
          {{ e is none or e.state in ['unavailable', 'unknown']
             or (now() - e.last_reported).total_seconds() > 60 }}
    actions:
      - action: persistent_notification.create
        data:
          notification_id: ev_lb_p1
          title: "EV load balancing – P1-data ontbreekt"
          message: >
            Geen verse P1-data. Laders vallen terug op
            {{ states('input_number.ev_lb_terugval') }} A.

  # ---------------------------------------------------------------
  # Melding als een lader niet meer verbonden is (OCPP uit / offline)
  # ---------------------------------------------------------------
  - id: ev_lb_lader_verbinding
    alias: "EV – melding lader niet onder controle"
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.ev_lb_rob_onder_controle
          - binary_sensor.ev_lb_sonia_onder_controle
        to: "off"
        for: "00:00:30"
        id: weg
      - trigger: state
        entity_id:
          - binary_sensor.ev_lb_rob_onder_controle
          - binary_sensor.ev_lb_sonia_onder_controle
        to: "on"
        id: terug
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'weg' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: "ev_lb_verbinding_{{ trigger.entity_id }}"
                  title: "⚠️ {{ trigger.to_state.name | replace(' onder controle', '') | replace('EV LB ', 'EV-Lader ') }} niet verbonden"
                  message: >
                    HA kan deze lader niet meer sturen (OCPP uit in de Ratio-app,
                    wifi of lader offline). Hij laadt nu met de maximale stroom
                    uit de Ratio-app. De andere lader en de huislasten regelen
                    eromheen, maar zet OCPP zo snel mogelijk weer aan.
              - action: notify.mobile_app_sm_g781b
                data:
                  title: "⚠️ Laadpaal niet onder controle van HA"
                  message: >
                    {{ trigger.to_state.name | replace(' onder controle', '') | replace('EV LB ', 'EV-Lader ') }}
                    is niet verbonden. Load balancing werkt voor deze lader niet.
                continue_on_error: true
          - conditions: "{{ trigger.id == 'terug' }}"
            sequence:
              - action: persistent_notification.dismiss
                data:
                  notification_id: "ev_lb_verbinding_{{ trigger.entity_id }}"
