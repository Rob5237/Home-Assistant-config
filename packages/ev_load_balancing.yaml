            {%- if not ns.f and as_datetime(f.end_date) > now() and as_datetime(f.end_date) <= dl -%}{%- set ns.f = as_datetime(f.start_date).isoformat() -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.f }}
