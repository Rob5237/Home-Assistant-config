  - sensor:
      # PV-overschot voor de laders: wat er na het huisverbruik overblijft.
      # P1 (negatief = teruglevering) + wat de laders nu zelf afnemen.
      - name: "EV LB PV overschot"
        unique_id: ev_lb_pv_overschot
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.p1_meter_power') and has_value('sensor.envoy_122331077486_current_power_production') }}"
        # Overschot = teruglevering + wat de laders nu zelf afnemen, MAAR:
        # - het laadvermogen telt alleen mee als de lader echt laadt (het afgeleide
        #   vermogen blijft na een pauze nog tot 150 s op de oude waarde staan en
        #   gaf zo een nep-overschot, 20-10-2026 's avonds);
        # - nooit meer dan de echte PV-productie (Enphase).
        state: >
          {% set rob = states('sensor.ev_rob_vermogen') | float(0) if is_state('sensor.ev_rob_status_connector', 'Charging') else 0 %}
          {% set sonia = states('sensor.ev_sonia_vermogen') | float(0) if is_state('sensor.ev_sonia_status_connector', 'Charging') else 0 %}
          {% set pv = states('sensor.envoy_122331077486_current_power_production') | float(0) %}
          {{ [[0 - states('sensor.p1_meter_power') | float(0) + rob + sonia, pv] | min, 0] | max | round(0) }}

  - binary_sensor:
      # Zonlading: genoeg PV-overschot (start 1500 W, blijft aan tot 1300 W)
      - name: "EV LB Rob PV laden"
        unique_id: ev_lb_rob_pv_laden
        state: >
          {% set o = states('sensor.ev_lb_pv_overschot') | float(0) %}
          {{ o >= 1500 or (this.state == 'on' and o >= 1300) }}
      - name: "EV LB Sonia PV laden"
        unique_id: ev_lb_sonia_pv_laden
        state: >
          {% set o = states('sensor.ev_lb_pv_overschot') | float(0) %}
          {{ o >= 1500 or (this.state == 'on' and o >= 1300) }}

  - binary_sensor:
      # ---------------------------------------------------------------
      # PRIJSSTURING (20-10-2026): mag deze lader nu laden? Ja bij: boost
      # (direct laden), OF tarief <= ev_prijsdrempel, OF het huidige kwartier
      # hoort bij de goedkoopste N uren (input_number.ev_lb_<lader>_goedkoop_uren)
      # tot de vertrektijd (Zonneplan kwartier-forecast). Het aantal benodigde
      # kWh is dus NIET nodig: de auto laadt op die momenten tot hij vol is.
      # Niet toegestaan = 0 A (pauze), toegestaan = zo hoog als de ruimte toelaat.
      # ---------------------------------------------------------------
      - name: "EV LB Sonia goedkoop uur"
        unique_id: ev_lb_sonia_goedkoop_uur
        state: >
          {% set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] %}
          {# NOODSCHEMA: levert Zonneplan geen prijzen, dan 00:00-06:00 en 11:00-15:00 laden #}
          {% if fc | count == 0 %}
            {{ now().hour < 6 or 11 <= now().hour < 15 }}
          {% else %}
            {% set dl = today_at(states('input_datetime.ev_sonia_vertrek')) %}
            {% if dl <= now() %}{% set dl = dl + timedelta(days=1) %}{% endif %}
            {# Aaneengesloten goedkoopste blok; vastgelegd in input_datetime (zie ev_blok_vastleggen) #}
            {% set k = (states('input_number.ev_lb_sonia_goedkoop_uren') | float(0) * 4) | round(0, 'ceil') | int %}
            {% set s_ts = state_attr('input_datetime.ev_sonia_blok_start', 'timestamp') | float(0) %}
            {% set nu = now().timestamp() %}
            {{ s_ts > dl.timestamp() - 86400 and s_ts <= nu < s_ts + k * 900 }}
          {% endif %}
        attributes:
          doel_tijd: "{{ today_at(states('input_datetime.ev_sonia_vertrek')) if today_at(states('input_datetime.ev_sonia_vertrek')) > now() else today_at(states('input_datetime.ev_sonia_vertrek')) + timedelta(days=1) }}"
      - name: "EV LB Rob goedkoop uur"
        unique_id: ev_lb_rob_goedkoop_uur
        state: >
          {% set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') or [] %}
          {# NOODSCHEMA: levert Zonneplan geen prijzen, dan 00:00-06:00 en 11:00-15:00 laden #}
          {% if fc | count == 0 %}
            {{ now().hour < 6 or 11 <= now().hour < 15 }}
          {% else %}
            {% set dl = today_at(states('input_datetime.ev_rob_vertrek')) %}
            {% if dl <= now() %}{% set dl = dl + timedelta(days=1) %}{% endif %}
            {# Aaneengesloten goedkoopste blok; vastgelegd in input_datetime (zie ev_blok_vastleggen) #}
            {% set k = (states('input_number.ev_lb_rob_goedkoop_uren') | float(0) * 4) | round(0, 'ceil') | int %}
            {% set s_ts = state_attr('input_datetime.ev_rob_blok_start', 'timestamp') | float(0) %}
            {% set nu = now().timestamp() %}
            {{ s_ts > dl.timestamp() - 86400 and s_ts <= nu < s_ts + k * 900 }}
          {% endif %}
        attributes:
          doel_tijd: "{{ today_at(states('input_datetime.ev_rob_vertrek')) if today_at(states('input_datetime.ev_rob_vertrek')) > now() else today_at(states('input_datetime.ev_rob_vertrek')) + timedelta(days=1) }}"
      - name: "EV LB Sonia laden toegestaan"
        unique_id: ev_lb_sonia_laden_toegestaan
        state: >
          {{ is_state('input_boolean.ev_sonia_direct_laden', 'on')
             or (is_state('input_boolean.ev_sonia_nacht_overslaan', 'off')
                 and (states('sensor.zonneplan_current_electricity_tariff') | float(99)
                      <= states('input_number.ev_prijsdrempel') | float(-99)
                      or is_state('binary_sensor.ev_lb_sonia_goedkoop_uur', 'on'))) }}
      - name: "EV LB Rob laden toegestaan"
        unique_id: ev_lb_rob_laden_toegestaan
        state: >
          {{ is_state('input_boolean.ev_rob_direct_laden', 'on')
             or (is_state('input_boolean.ev_rob_nacht_overslaan', 'off')
                 and (states('sensor.zonneplan_current_electricity_tariff') | float(99)
                      <= states('input_number.ev_prijsdrempel') | float(-99)
                      or is_state('binary_sensor.ev_lb_rob_goedkoop_uur', 'on'))) }}

      # ---------------------------------------------------------------
      # Is de lader echt verbonden en onder controle van HA?
      # De OCPP-integratie houdt na een verbroken verbinding soms de
      # oude waarden vast. Daarom kijken we naar de latency-sensor die
      # bij elke websocket-ping wordt bijgewerkt: is die > 120 s oud,
      # dan is de verbinding weg (bijv. OCPP uitgezet in de Ratio-app).
      # ---------------------------------------------------------------
      - name: "EV LB Rob onder controle"
        unique_id: ev_lb_rob_onder_controle
        device_class: connectivity
        state: >
          {% set e = states.sensor.ev_rob_latency_ping %}
          {{ e is not none and e.state not in ['unavailable', 'unknown']
             and (now() - e.last_reported).total_seconds() < 120
             and has_value('sensor.ev_rob_status_connector') }}
      - name: "EV LB Sonia onder controle"
        unique_id: ev_lb_sonia_onder_controle
        device_class: connectivity
        state: >
          {% set e = states.sensor.ev_sonia_latency_ping %}
          {{ e is not none and e.state not in ['unavailable', 'unknown']
             and (now() - e.last_reported).total_seconds() < 120
             and has_value('sensor.ev_sonia_status_connector') }}

      # Tekort t.o.v. regelgrens, 3 s aanhoudend (korte inschakelpieken negeren)
      - name: "EV LB tekort"
        unique_id: ev_lb_tekort
        delay_on: "00:00:03"
        availability: "{{ has_value('sensor.ev_lb_ruimte') }}"
        state: "{{ states('sensor.ev_lb_ruimte') | float(0) < 0 }}"
      # Echte overschrijding van 25 A, 15 s aanhoudend (de Quooker geeft elke ~36 min
      # een puls van 5-10 s van ~9 A op L2; dat is voor de zekering geen gevaar).
      # Zware overschrijding (> zekering + 4 A) telt na 3 s, zoals voorheen.
      - name: "EV LB overbelasting"
        unique_id: ev_lb_overbelasting
        device_class: problem
        delay_on: >
          {% set z = states('input_number.ev_lb_zekering') | float(25) %}
          {% set m = [ states('sensor.ev_lb_stroom_l1') | float(0),
                       states('sensor.ev_lb_stroom_l2') | float(0),
                       states('sensor.ev_lb_stroom_l3') | float(0) ] | max %}
          {{ '00:00:03' if m > z + 4 else '00:00:15' }}
        state: >
          {% set z = states('input_number.ev_lb_zekering') | float(25) %}
          {{ [ states('sensor.ev_lb_stroom_l1') | float(0),
               states('sensor.ev_lb_stroom_l2') | float(0),
               states('sensor.ev_lb_stroom_l3') | float(0) ] | max > z }}

script:
  ev_sonia_opladen_uitzetten:
    alias: "EV-Sonia – opladen uitzetten (knop)"
    sequence:
      # Eerst de vlag (dashboard-kleur direct goed), dan pas de boost uit
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev_sonia_opladen_uitgezet
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_sonia_direct_laden
  ev_rob_opladen_uitzetten:
    alias: "EV-Rob – opladen uitzetten (knop)"
    sequence:
      # Eerst de vlag (dashboard-kleur direct goed), dan pas de boost uit
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ev_rob_opladen_uitgezet
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ev_rob_direct_laden
  # Schakelt huislasten uit (in lijstvolgorde, alleen wat aan staat)
  # tot er minstens 'nodig' ampère is afgeschakeld.
  # nodig = 0 → precies één last.
  ev_lb_volgende_uit:
    alias: "EV LB – huislasten afschakelen"
    mode: single
    fields:
      nodig:
        description: "Minimaal af te schakelen stroom in A (0 = één last)"
        default: 0
    sequence:
      - variables:
          lasten: "{{ state_attr('sensor.ev_lb_afschakellijst', 'lasten') or [] }}"
          doel: "{{ [nodig | float(0), 0.1] | max }}"
      - condition: template
        value_template: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) < lasten | count }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.ev_lb_afgeschakeld_a
        data:
          value: 0
      - repeat:
          sequence:
            - variables:
                idx: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) + 1 }}"
                l: "{{ lasten[idx - 1] }}"
                staat_aan: >
                  {{ states(l.entity) not in ['off', 'unavailable', 'unknown', l.uit | default('off')] }}
            - action: input_number.set_value
              target:
                entity_id: input_number.ev_lb_afschakel_niveau
              data:
                value: "{{ idx }}"
            - if: "{{ staat_aan }}"
              then:
                - action: scene.create
                  data:
                    scene_id: "ev_lb_last_{{ idx }}"
                    snapshot_entities:
                      - "{{ l.entity }}"
                - choose:
                    - conditions: "{{ l.type == 'select' }}"
                      sequence:
                        - action: select.select_option
                          target:
                            entity_id: "{{ l.entity }}"
                          data:
                            option: "{{ l.uit }}"
                  default:
                    - action: homeassistant.turn_off
                      target:
                        entity_id: "{{ l.entity }}"
                - action: input_number.set_value
                  target:
                    entity_id: input_number.ev_lb_afgeschakeld_a
                  data:
                    value: >
                      {{ [states('input_number.ev_lb_afgeschakeld_a') | float(0) + l.ampere | float(0), 200] | min }}
                - action: logbook.log
                  data:
                    name: "EV load balancing"
                    message: "Afgeschakeld: {{ l.naam }} (ruimte {{ states('sensor.ev_lb_ruimte') }} A)"
          until: >
            {{ states('input_number.ev_lb_afschakel_niveau') | int(0) >= lasten | count
               or states('input_number.ev_lb_afgeschakeld_a') | float(0) >= doel }}

  # Zet de laatst afgeschakelde last terug in zijn vorige stand
  ev_lb_volgende_aan:
    alias: "EV LB – volgende huislast herstellen"
    mode: single
    sequence:
      - variables:
          lasten: "{{ state_attr('sensor.ev_lb_afschakellijst', 'lasten') or [] }}"
      - condition: template
        value_template: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) > 0 }}"
      - repeat:
          sequence:
            - variables:
                idx: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) }}"
                sc: "scene.ev_lb_last_{{ idx }}"
                heeft_scene: "{{ sc in (states.scene | map(attribute='entity_id') | list) }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.ev_lb_afschakel_niveau
              data:
                value: "{{ idx - 1 }}"
            - if: "{{ heeft_scene }}"
              then:
                - action: scene.turn_on
                  target:
                    entity_id: "{{ sc }}"
                - action: scene.delete
                  target:
                    entity_id: "{{ sc }}"
                  continue_on_error: true
                - action: logbook.log
                  data:
                    name: "EV load balancing"
                    message: "Hersteld: {{ lasten[idx - 1].naam if idx <= lasten | count else sc }}"
                - stop: "Eén last hersteld"
          until: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) <= 0 }}"

  # Dynamisch profiel dat na 'duur' seconden vanzelf verloopt
  ev_lb_profiel:
    alias: "EV LB – verlopend laadprofiel sturen"
    mode: parallel
    fields:
      devid:
        description: "Charge point id"
      ampere:
        description: "Laadstroom in A"
      duur:
        description: "Geldigheid in seconden"
        default: 60
    sequence:
      - action: ocpp.set_charge_rate
        data:
          devid: "{{ devid }}"
          conn_id: 1
          custom_profile:
            chargingProfileId: 10
            stackLevel: 0
            chargingProfilePurpose: TxDefaultProfile
            chargingProfileKind: Absolute
            chargingSchedule:
              chargingRateUnit: A
              startSchedule: "{{ now() | as_timestamp | timestamp_custom('%Y-%m-%dT%H:%M:%SZ', false) }}"
              # Geen duration: de laatste periode blijft gelden. Na 'duur' s zonder
              # verversing valt de lader dus zelf terug op de terugvalstroom.
              chargingSchedulePeriod:
                - startPeriod: 0
                  limit: "{{ ampere | int }}"
                - startPeriod: "{{ duur | int(60) }}"
                  limit: "{{ states('input_number.ev_lb_terugval') | int(6) }}"
        continue_on_error: true

automation:
  - id: ev_opladen_uitgezet_vlag_wissen
    alias: "EV – knopvlag 'opladen uitgezet' wissen bij start laden of boost"
    mode: parallel
    triggers:
      - trigger: state
        entity_id: sensor.ev_sonia_status_connector
        to: "Charging"
        id: sonia
      - trigger: state
        entity_id: input_boolean.ev_sonia_direct_laden
        to: "on"
        id: sonia
      - trigger: state
        entity_id: sensor.ev_rob_status_connector
        to: "Charging"
        id: rob
      - trigger: state
        entity_id: input_boolean.ev_rob_direct_laden
        to: "on"
        id: rob
    # Een kortstondig 'Charging' (paar seconden) direct na het indrukken van
    # 'Opladen uitzetten' is de lader die nog niet op 0 A staat: de vlag dan
    # NIET wissen (gaf een gele flits op de knop, 21-10-2026). Boost wist altijd.
    conditions:
      - condition: template
        value_template: >
          {% set eid = 'input_boolean.ev_' ~ trigger.id ~ '_opladen_uitgezet' %}
          {% set v = states.input_boolean | selectattr('entity_id', 'eq', eid) | first %}
          {{ trigger.entity_id.endswith('direct_laden')
             or v is not defined
             or (now() - v.last_changed).total_seconds() > 60 }}
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: "input_boolean.ev_{{ trigger.id }}_opladen_uitgezet"
  - id: ev_id_tag_vastleggen
    alias: "EV – id_tag per laadsessie vastleggen"
    mode: parallel
    triggers:
      - trigger: state
        entity_id:
          - sensor.ev_sonia_id_tag
          - sensor.ev_rob_id_tag
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['', 'unknown', 'unavailable'] }}"
    actions:
      - variables:
          lader: "{{ 'sonia' if 'sonia' in trigger.entity_id else 'rob' }}"
          vorige: "{{ states('input_text.ev_' ~ lader ~ '_laatste_id_tag') | replace('unknown', '') | replace('unavailable', '') }}"
      - action: input_text.set_value
        target:
          entity_id: "input_text.ev_{{ lader }}_laatste_id_tag"
        data:
          value: "{{ trigger.to_state.state }}"
      - action: logbook.log
        data:
          name: "EV id_tag"
          message: >
            Lader {{ lader }}: sessie met id_tag {{ trigger.to_state.state }}
            ({{ 'zelfde als vorige sessie' if vorige == trigger.to_state.state else 'ANDERS dan vorige sessie (' ~ (vorige or 'geen') ~ ')' }}).
  - id: ev_blok_vastleggen
    alias: "EV – goedkoopste laadblok vastleggen"
    mode: queued
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - sensor.ev_sonia_blokplanning
          - sensor.ev_rob_blokplanning
    actions:
      - repeat:
          for_each: ["sonia", "rob"]
          sequence:
            - variables:
                p: "sensor.ev_{{ repeat.item }}_blokplanning"
                h: "input_datetime.ev_{{ repeat.item }}_blok_start"
                s_ts: "{{ state_attr(h, 'timestamp') | float(0) }}"
                nu: "{{ now().timestamp() }}"
                dl_iso: "{{ state_attr(p, 'dl') or '' }}"
                kand: "{{ state_attr(p, 'kandidaat_start') or '' }}"
                eerst: "{{ state_attr(p, 'eerste_start') or '' }}"
                # Blok hoort bij de lopende cyclus (na de vorige vertrektijd)
                cyclus: "{{ dl_iso != '' and s_ts > (dl_iso | as_datetime).timestamp() - 86400 }}"
                # Gestart (loopt of is klaar): niet meer verschuiven
                vast: "{{ cyclus and nu >= s_ts }}"
                nieuw: "{{ kand or eerst }}"
            - if: >
                {{ not vast and nieuw != ''
                   and ((nieuw | as_datetime).timestamp() | round(0)) != (s_ts | round(0)) }}
              then:
                - action: input_datetime.set_datetime
                  target:
                    entity_id: "{{ h }}"
                  data:
                    timestamp: "{{ (nieuw | as_datetime).timestamp() }}"
  - id: ev_nacht_overslaan_wissen
    alias: "EV – knop 'nacht overslaan' wissen op vertrektijd of bij boost"
    mode: parallel
    triggers:
      - trigger: time
        at: input_datetime.ev_sonia_vertrek
        id: sonia
      - trigger: time
        at: input_datetime.ev_rob_vertrek
        id: rob
      - trigger: state
        entity_id: input_boolean.ev_sonia_direct_laden
        to: "on"
        id: sonia
      - trigger: state
        entity_id: input_boolean.ev_rob_direct_laden
        to: "on"
        id: rob
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: "input_boolean.ev_{{ trigger.id }}_nacht_overslaan"
  # ---------------------------------------------------------------
  # Na een herstart van HA: setpunten op 6 A, daarna rustig opbouwen.
  # (Hier worden bewust GEEN profielen naar de laders geschreven: een apart
  # basisprofiel begrenst de dynamische stroom, de lader neemt het laagste.
  # Het oude script ev_lb_basisprofiel werd ook bij 'weer verbonden' aangeroepen
  # en zette zo na elke template-/automation-reload een 6 A-limiet. Verwijderd.)
  # ---------------------------------------------------------------
  - id: ev_lb_herstart_setpunten
    alias: "EV – setpunten na herstart op 6 A"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.ev_lb_setpunt_rob
            - input_number.ev_lb_setpunt_sonia
        data:
          value: 6

  # ---------------------------------------------------------------
  # Dynamische regeling: snel omlaag, langzaam omhoog, elke 20 s verversen
  # ---------------------------------------------------------------
  - id: ev_lb_dynamisch
    alias: "EV – dynamische load balancing (P1, voorrang Sonia)"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.ev_lb_ruimte
        id: meting
      - trigger: state
        entity_id: binary_sensor.ev_lb_overbelasting
        to: "on"
        id: meting
      - trigger: time_pattern
        seconds: "/10"
        id: ramp
      - trigger: state
        entity_id:
          - binary_sensor.ev_lb_rob_laden_toegestaan
          - binary_sensor.ev_lb_sonia_laden_toegestaan
        id: ramp
      - trigger: state
        entity_id:
          - sensor.ev_rob_status_connector
          - sensor.ev_sonia_status_connector
        to: "Charging"
        id: start
    conditions:
      - condition: state
        entity_id: input_boolean.ev_lb_actief
        state: "on"
      # P1-data moet vers zijn; anders niets sturen → lader valt terug op basis
      - condition: template
        value_template: >
          {% set ns = namespace(ok=true) %}
          {% for f in [1, 2, 3] %}
            {% set e = states['sensor.p1_meter_power_phase_' ~ f] %}
            {% if e is none or e.state in ['unavailable', 'unknown']
                  or (now() - e.last_reported).total_seconds() > 30 %}
              {% set ns.ok = false %}
            {% endif %}
          {% endfor %}
          {{ ns.ok and has_value('sensor.ev_lb_ruimte') }}
      # Beschermt tegen een tijdelijk 'unavailable' van de eigen template-sensoren
      # (template.reload, herstart): anders ziet de regeling de laders ten onrechte
      # als 'niet bezig' en zet hij ze op 0/6 A (gebeurde op 20-10-2026 om 19:26).
      - condition: template
        value_template: >
          {{ has_value('binary_sensor.ev_lb_sonia_onder_controle')
             and has_value('binary_sensor.ev_lb_rob_onder_controle')
             and has_value('binary_sensor.ev_lb_sonia_laden_toegestaan')
             and has_value('binary_sensor.ev_lb_rob_laden_toegestaan')
             and has_value('binary_sensor.ev_lb_sonia_pv_laden')
             and has_value('binary_sensor.ev_lb_rob_pv_laden')
             and has_value('sensor.ev_lb_pv_overschot') }}
    variables:
      # VOLGORDE = VOORRANG. De eerste krijgt als eerste ruimte bij opregelen;
      # bij terugregelen gaat de laatste (Rob) als eerste omlaag.
      laders:
        - naam: sonia
          devid: "ev_sonia"
          status: sensor.ev_sonia_status_connector
          setpunt: input_number.ev_lb_setpunt_sonia
          max: input_number.ev_lb_max_sonia
          stap: 4          # sneller omhoog: +4 A per 10 s
          controle: binary_sensor.ev_lb_sonia_onder_controle
          toegestaan: binary_sensor.ev_lb_sonia_laden_toegestaan
          pv: binary_sensor.ev_lb_sonia_pv_laden
          vermogen: sensor.ev_sonia_vermogen
          fase: input_select.ev_lb_sonia_fase
        - naam: rob
          devid: "ev_rob"
          status: sensor.ev_rob_status_connector
          setpunt: input_number.ev_lb_setpunt_rob
          max: input_number.ev_lb_max_rob
          stap: 2
          controle: binary_sensor.ev_lb_rob_onder_controle
          toegestaan: binary_sensor.ev_lb_rob_laden_toegestaan
          pv: binary_sensor.ev_lb_rob_pv_laden
          vermogen: sensor.ev_rob_vermogen
          fase: input_select.ev_lb_rob_fase
      # Werkelijke laadstroom van Sonia's lader (OCPP), om te zien of haar auto
      # het aangeboden vermogen ook echt afneemt.
      sonia_stroom: sensor.ev_sonia_stroom   # afgeleid uit de energieteller (A per fase)
      bezig_statussen: ["Charging", "SuspendedEVSE"]
    actions:
      - variables:
          ruimte: "{{ states('sensor.ev_lb_ruimte') | float(0) }}"
          overbelast: "{{ is_state('binary_sensor.ev_lb_overbelasting', 'on') }}"
          niveau: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) }}"
          verversen: "{{ trigger.id == 'ramp' and now().second % 20 < 10 }}"
      - condition: template
        value_template: "{{ trigger.id != 'meting' or ruimte < 0 or overbelast }}"
      - variables:
          plan: >
            {% set ns = namespace(rest=ruimte, out={}) %}
            {# Zwaarst belaste fase: alleen laders die op die fase laden helpen daar #}
            {% set fi = {'L1': states('sensor.ev_lb_stroom_l1') | float(0),
                         'L2': states('sensor.ev_lb_stroom_l2') | float(0),
                         'L3': states('sensor.ev_lb_stroom_l3') | float(0)} %}
            {% set slechtste = fi | dictsort(false, 'value') | last | first %}
            {% for l in laders %}
              {# Niet verbonden = niet stuurbaar: telt niet mee als 'bezig'.
                 Zijn stroom zit wel in de P1-meting, dus de rest regelt eromheen. #}
              {% set b = states(l.status) in bezig_statussen and is_state(l.controle, 'on') %}
              {% set h = states(l.setpunt) | int(0) %}
              {% set ns.out = dict(ns.out, **{l.naam: {'bezig': b, 'huidig': h, 'nieuw': (h if b else 6), 'tg': is_state(l.toegestaan, 'on'), 'pv': is_state(l.pv, 'on')}}) %}
            {% endfor %}

            {% if overbelast and ruimte < -6 %}
              {# Noodstop: zware overschrijding (> 29 A): alles wat laadt eerst naar
                 6 A (de auto blijft dan doorladen); staat hij al op <= 6 A en blijft
                 het overbelast, dan naar 0 A #}
              {% for l in laders %}
                {% set o = ns.out[l.naam] %}
                {% if o.bezig %}{% set ns.out = dict(ns.out, **{l.naam: dict(o, nieuw=(6 if o.huidig > 6 else 0))}) %}{% endif %}
              {% endfor %}

            {% elif overbelast %}
              {# Lichte overschrijding (25-29 A, bv. een korte piek van de Quooker):
                 niet stoppen maar zo ver omlaag als nodig, met 3 A extra marge.
                 Eerst Rob, dan Sonia; pas bij < 6 A gaat een lader naar 0 A.
                 Daarna loopt de ramp-regeling hem vanzelf weer omhoog. #}
              {% set ns.rest = ruimte - 3 %}
              {% for l in laders | reverse %}
                {% set o = ns.out[l.naam] %}
                {% if o.bezig and ns.rest < 0 and o.huidig > 0 and (is_state(l.fase, '3-fase') or states(l.fase) == slechtste) %}
                  {% set x = (o.huidig + ns.rest) | round(0, 'floor') | int %}
                  {% set x = x if x >= 6 else 0 %}
                  {% set ns.rest = ns.rest + (o.huidig - x) %}
                  {% set ns.out = dict(ns.out, **{l.naam: dict(o, nieuw=x)}) %}
                {% endif %}
              {% endfor %}

            {% elif ruimte < 0 %}
              {# OMLAAG, direct: eerst Rob, dan pas Sonia #}
              {% for l in laders | reverse %}
                {% set o = ns.out[l.naam] %}
                {% if o.bezig and ns.rest < 0 and o.huidig > 0 and (is_state(l.fase, '3-fase') or states(l.fase) == slechtste) %}
                  {% set x = (o.huidig + ns.rest) | round(0, 'floor') | int %}
                  {% set x = x if x >= 6 else 0 %}
                  {% set ns.rest = ns.rest + (o.huidig - x) %}
                  {% set ns.out = dict(ns.out, **{l.naam: dict(o, nieuw=x)}) %}
                {% endif %}
              {% endfor %}

            {% elif trigger.id == 'start' %}
              {# Nieuwe sessie op de lader die de trigger gaf: laag beginnen #}
              {% for l in laders %}
                {% set o = ns.out[l.naam] %}
                {% set sw = l.naam != 'sonia' and ns.out['sonia'].bezig and (ns.out['sonia'].tg or ns.out['sonia'].pv)
                            and ns.out['sonia'].huidig < states('input_number.ev_lb_max_sonia') | int(16) %}
                {% if o.bezig and trigger.entity_id == l.status %}
                  {% set ns.out = dict(ns.out, **{l.naam: dict(o, nieuw=(6 if (ruimte >= 0 and not sw) else 0))}) %}
                {% endif %}
              {% endfor %}

            {% elif trigger.id == 'ramp' and niveau == 0 %}
              {# OMHOOG: Sonia eerst, Rob krijgt wat overblijft; 1 A buffer #}
              {% set ns.rest = ns.rest - 1 %}
              {% for l in laders %}
                {% set o = ns.out[l.naam] %}
                {% set mx = states(l.max) | int(10) %}
                {# STRIKTE VOORRANG: Rob mag pas omhoog als Sonia op haar max zit (of niet laadt/mag laden) #}
                {% set wacht = l.naam != 'sonia' and ns.out['sonia'].bezig and (ns.out['sonia'].tg or ns.out['sonia'].pv)
                               and ns.out['sonia'].nieuw < states('input_number.ev_lb_max_sonia') | int(16) %}
                {% if o.bezig and (o.tg or o.pv) and not wacht %}
                  {% if o.huidig > mx %}
                    {% set x = mx %}
                  {% elif o.huidig == 0 %}
                    {% set x = 6 if ns.rest >= 7 else 0 %}
                  {% else %}
                    {% set st = [[l.stap, ns.rest | round(0, 'floor') | int] | min, 0] | max %}
                    {% set x = [o.huidig + st, mx] | min %}
                  {% endif %}
                  {% set ns.rest = ns.rest - (x - o.huidig) %}
                  {% set ns.out = dict(ns.out, **{l.naam: dict(o, nieuw=x)}) %}
                {% endif %}
              {% endfor %}

              {# VOORRANG: Sonia zit niet op max, krijgt geen ruimte erbij en haar
                 auto neemt het aanbod echt af → Rob 2 A omlaag. De vrijgekomen
                 ruimte gaat bij de volgende ronde (10 s) naar Sonia. #}
              {% set s = ns.out['sonia'] %}
              {% set r = ns.out['rob'] %}
              {% set smax = states('input_number.ev_lb_max_sonia') | int(16) %}
              {% set rmin = states('input_number.ev_lb_min_rob') | int(6) %}
              {% set s_neemt_af = states(sonia_stroom) | float(99) >= s.huidig - 2 %}
              {% if s.bezig and r.bezig and s.huidig > 0 and s.nieuw == s.huidig
                    and s.nieuw < smax and s_neemt_af and r.nieuw > rmin and r.nieuw > 0 %}
                {% set x = [r.nieuw - 2, rmin] | max %}
                {% set x = x if x >= 6 else 0 %}
                {% set ns.out = dict(ns.out, **{'rob': dict(r, nieuw=x)}) %}
              {% endif %}
            {% endif %}
            {# PRIJSSTURING: lader die om prijsredenen mag laden krijgt de volle
               ruimte. Een lader die dat niet mag maar wel zon heeft (pv), wordt
               begrensd op het PV-overschot (A = W / (230 x fasen)), na aftrek van
               wat de prijs-laders al afnemen. Geen van beide: 0 A (pauze). #}
            {% set pvs = namespace(w=states('sensor.ev_lb_pv_overschot') | float(0)) %}
            {% for l in laders %}
              {% if ns.out[l.naam].tg %}{% set pvs.w = pvs.w - states(l.vermogen) | float(0) %}{% endif %}
            {% endfor %}
            {% for l in laders %}
              {% set o = ns.out[l.naam] %}
              {% if o.bezig and not o.tg %}
                {% set f = 3 if is_state(l.fase, '3-fase') else 1 %}
                {% set cap = ([pvs.w, 0] | max / (230 * f)) | int if o.pv else 0 %}
                {% set cap = cap if cap >= 6 else 0 %}
                {% set pvs.w = pvs.w - cap * 230 * f %}
                {% set x = [o.nieuw, cap] | min %}
                {% set x = x if x >= 6 else 0 %}
                {% set ns.out = dict(ns.out, **{l.naam: dict(o, nieuw=x)}) %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ laders }}"
          sequence:
            - variables:
                o: "{{ plan[repeat.item.naam] }}"
            - if: >
                {{ o.bezig and ((o.nieuw | int) != (o.huidig | int) or trigger.id == 'start' or verversen) }}
              then:
                - action: script.ev_lb_profiel
                  data:
                    devid: "{{ repeat.item.devid }}"
                    ampere: "{{ o.nieuw | int }}"
                    duur: 60
            - if: "{{ (o.nieuw | int) != (o.huidig | int) }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item.setpunt }}"
                  data:
                    value: "{{ o.nieuw | int }}"

  # ---------------------------------------------------------------
  # PRIJSSTURING: lader automatisch starten (charge_control) zodra de auto
  # is aangesloten (status Preparing) en laden is toegestaan. Pauzeren gebeurt
  # via 0 A in ev_lb_dynamisch, niet via charge_control (een gestopte sessie
  # kan alleen na opnieuw insteken weer starten). Eerst 6 A als profiel,
  # zodat de lader niet even op vol vermogen start.
  # ---------------------------------------------------------------
  - id: ev_lb_laden_starten
    alias: "EV – lader automatisch starten (prijssturing)"
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - sensor.ev_rob_status_connector
          - sensor.ev_sonia_status_connector
        to: "Preparing"
        for: "00:00:05"
      - trigger: state
        entity_id:
          - binary_sensor.ev_lb_rob_laden_toegestaan
          - binary_sensor.ev_lb_sonia_laden_toegestaan
          - binary_sensor.ev_lb_rob_pv_laden
          - binary_sensor.ev_lb_sonia_pv_laden
        to: "on"
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.ev_lb_actief
        state: "on"
    actions:
      - repeat:
          for_each:
            - {naam: sonia, devid: ev_sonia}
            - {naam: rob, devid: ev_rob}
          sequence:
            - variables:
                status: "sensor.ev_{{ repeat.item.naam }}_status_connector"
                toegestaan: "binary_sensor.ev_lb_{{ repeat.item.naam }}_laden_toegestaan"
                pv: "binary_sensor.ev_lb_{{ repeat.item.naam }}_pv_laden"
                controle: "binary_sensor.ev_lb_{{ repeat.item.naam }}_onder_controle"
                schakelaar: "switch.ev_{{ repeat.item.naam }}_charge_control"
            - if:
                - condition: template
                  value_template: >
                    {# Rob start pas als Sonia op haar max zit (of niet laadt/mag laden)
                       EN er minstens 7 A ruimte is (6 A minimum + 1 A buffer); zonder ruimte
                       gaf de start een piek van > 23 A op de zwaarst belaste fase. #}
                    {% set sonia_wacht = repeat.item.naam == 'rob'
                         and states('sensor.ev_sonia_status_connector') in ['Preparing', 'Charging', 'SuspendedEVSE']
                         and (is_state('binary_sensor.ev_lb_sonia_laden_toegestaan', 'on')
                              or is_state('binary_sensor.ev_lb_sonia_pv_laden', 'on'))
                         and states('input_number.ev_lb_setpunt_sonia') | int(0)
                             < states('input_number.ev_lb_max_sonia') | int(16) %}
                    {{ is_state(status, 'Preparing') and (is_state(toegestaan, 'on') or is_state(pv, 'on'))
                       and is_state(controle, 'on') and is_state(schakelaar, 'off')
                       and not sonia_wacht
                       and (repeat.item.naam != 'rob' or states('sensor.ev_lb_ruimte') | float(0) >= 7) }}
              then:
                - action: script.ev_lb_profiel
                  data:
                    devid: "{{ repeat.item.devid }}"
                    ampere: 6
                    duur: 60
                - delay: "00:00:02"
                - action: switch.turn_on
                  target:
                    entity_id: "{{ schakelaar }}"
                # De lader legt bij de start een profiel vast dat ons dynamische
                # profiel niet meer overschrijft (auto bleef op 6 A). Daarom na
                # de start eenmalig wissen en direct een nieuw profiel sturen.
                - wait_template: "{{ is_state(status, 'Charging') }}"
                  timeout: "00:00:30"
                  continue_on_timeout: true
                - action: ocpp.clear_profile
                  data:
                    devid: "{{ repeat.item.devid }}"
                  continue_on_error: true
                - action: script.ev_lb_profiel
                  data:
                    devid: "{{ repeat.item.devid }}"
                    ampere: 6
                    duur: 60
                - action: logbook.log
                  data:
                    name: "EV load balancing"
                    message: "Lader {{ repeat.item.naam }} gestart (laden toegestaan)."

  # Na een korte noodstop (0 A) pauzeert de auto soms zelf (SuspendedEV) en pakt
  # het laden niet vanzelf weer op. Dan het profiel opnieuw sturen (zonder de
  # sessie te stoppen). Alleen binnen 10 min na een overbelasting, zodat een
  # volle accu niet eindeloos wordt 'gewekt'.
  - id: ev_lb_herstel_na_noodstop
    alias: "EV – laden hervatten na noodstop (auto gepauzeerd)"
    mode: parallel
    triggers:
      - trigger: state
        entity_id:
          - sensor.ev_rob_status_connector
          - sensor.ev_sonia_status_connector
        to: "SuspendedEV"
        for: "00:00:20"
        id: pauze
      - trigger: time_pattern
        seconds: "/30"
        id: herhaal
    conditions:
      - condition: state
        entity_id: input_boolean.ev_lb_actief
        state: "on"
      - condition: template
        value_template: >
          {{ is_state('binary_sensor.ev_lb_overbelasting', 'on')
             or (now() - states.binary_sensor.ev_lb_overbelasting.last_changed).total_seconds() < 600 }}
    actions:
      - repeat:
          for_each:
            - {naam: sonia, devid: ev_sonia}
            - {naam: rob, devid: ev_rob}
          sequence:
            - if:
                - condition: template
                  value_template: >
                    {% set n = repeat.item.naam %}
                    {{ is_state('sensor.ev_' ~ n ~ '_status_connector', 'SuspendedEV')
                       and (now() - states['sensor.ev_' ~ n ~ '_status_connector'].last_changed).total_seconds() >= 20
                       and (now() - states['sensor.ev_' ~ n ~ '_status_connector'].last_changed).total_seconds() < 600
                       and (is_state('binary_sensor.ev_lb_' ~ n ~ '_laden_toegestaan', 'on')
                            or is_state('binary_sensor.ev_lb_' ~ n ~ '_pv_laden', 'on'))
                       and is_state('switch.ev_' ~ n ~ '_charge_control', 'on')
                       and states('input_number.ev_lb_setpunt_' ~ n) | int(0) >= 6
                       and states('sensor.ev_lb_ruimte') | float(0) >= 7 }}
              then:
                - action: ocpp.clear_profile
                  data:
                    devid: "{{ repeat.item.devid }}"
                  continue_on_error: true
                - action: script.ev_lb_profiel
                  data:
                    devid: "{{ repeat.item.devid }}"
                    ampere: 6
                    duur: 60
                - action: logbook.log
                  data:
                    name: "EV load balancing"
                    message: "Lader {{ repeat.item.naam }}: laden hervat na noodstop (auto was gepauzeerd)."

  # ---------------------------------------------------------------
  # Noodstop-acties naast de regeling (bijverwarming uit + melding)
  # ---------------------------------------------------------------
  - id: ev_lb_noodstop
    alias: "EV – noodstop overbelasting hoofdaansluiting"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.ev_lb_overbelasting
        to: "on"
    actions:
      # Lichte piek (25-29 A, bv. Quooker): de laders regelen zelf af, alleen loggen.
      # Zware overschrijding (> 29 A): noodstop-meldingen zoals voorheen.
      - if: "{{ states('sensor.ev_lb_ruimte') | float(0) >= -6 }}"
        then:
          - action: logbook.log
            data:
              name: "EV load balancing"
              message: >
                Korte piek boven {{ states('input_number.ev_lb_zekering') }} A
                (L1 {{ states('sensor.ev_lb_stroom_l1') }}, L2 {{ states('sensor.ev_lb_stroom_l2') }},
                L3 {{ states('sensor.ev_lb_stroom_l3') }} A): laders regelen af.
        else:
          - action: persistent_notification.create
            data:
              notification_id: ev_lb_overbelasting
              title: "⚡ Overbelasting huisaansluiting"
              message: >
                Fase boven {{ states('input_number.ev_lb_zekering') }} A
                (L1 {{ states('sensor.ev_lb_stroom_l1') }} A,
                 L2 {{ states('sensor.ev_lb_stroom_l2') }} A,
                 L3 {{ states('sensor.ev_lb_stroom_l3') }} A).
                Laders gepauzeerd; huislasten worden afgeschakeld.
          - action: notify.mobile_app_sm_g781b
            data:
              title: "⚡ Overbelasting huisaansluiting"
              message: >
                Laders gepauzeerd en huislasten worden afgeschakeld.
                Zet zware apparaten (oven, inductie, Quooker) even uit.
            continue_on_error: true
          # Blijft het na 20 s nog steeds overbelast: dringende tweede melding.
          # Dan is alles wat HA kan uitzetten al uit; de rest moet met de hand.
          - wait_for_trigger:
              - trigger: state
                entity_id: binary_sensor.ev_lb_overbelasting
                to: "off"
            timeout: "00:00:20"
          - if: "{{ is_state('binary_sensor.ev_lb_overbelasting', 'on') }}"
            then:
              - action: notify.mobile_app_sm_g781b
                data:
                  title: "⚡⚡ Nog steeds overbelast"
                  message: >
                    Alle stuurbare lasten zijn uit, maar een fase blijft boven
                    {{ states('input_number.ev_lb_zekering') }} A. Zet nu handmatig
                    oven/inductie/Quooker uit, anders kan de hoofdzekering eruit.
                  data:
                    push:
                      interruption-level: critical
                continue_on_error: true

  # ---------------------------------------------------------------
  # Huislasten afschakelen — pas NADAT de laders al op 0 A staan
  # ---------------------------------------------------------------
  - id: ev_lb_afschakelen
    alias: "EV – huislasten afschakelen bij tekort"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.ev_lb_tekort
          - binary_sensor.ev_lb_overbelasting
        to: "on"
      - trigger: time_pattern
        seconds: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.ev_lb_actief
        state: "on"
      - condition: template
        value_template: >
          {{ is_state('binary_sensor.ev_lb_tekort', 'on')
             or is_state('binary_sensor.ev_lb_overbelasting', 'on') }}
      # Auto's eerst: zolang een lader nog stroom krijgt, regelt die eerst af.
      # Bij echte overbelasting (>25 A) niet wachten.
      - condition: template
        value_template: >
          {# Een niet-verbonden lader kan HA niet terugregelen: dan meteen huislasten #}
          {% set rob_laadt = is_state('binary_sensor.ev_lb_rob_onder_controle', 'on')
               and is_state('sensor.ev_rob_status_connector', 'Charging')
               and states('input_number.ev_lb_setpunt_rob') | int(0) > 0 %}
          {% set sonia_laadt = is_state('binary_sensor.ev_lb_sonia_onder_controle', 'on')
               and is_state('sensor.ev_sonia_status_connector', 'Charging')
               and states('input_number.ev_lb_setpunt_sonia') | int(0) > 0 %}
          {# Alleen bij zware overschrijding (> 29 A) niet wachten; bij een lichte
             piek regelen de laders zelf af (zie ev_lb_dynamisch) #}
          {{ (is_state('binary_sensor.ev_lb_overbelasting', 'on')
              and states('sensor.ev_lb_ruimte') | float(0) < -6)
             or not (rob_laadt or sonia_laadt) }}
      # Max één last per 5 s, zodat de meting kan bijkomen
      - condition: template
        value_template: >
          {{ (now() - states.input_number.ev_lb_afschakel_niveau.last_changed).total_seconds() >= 5 }}
    actions:
      # Gewoon tekort: één last per keer.
      # Echte overbelasting: in één keer genoeg lasten om terug onder
      # de regelgrens (zekering − marge) te komen, plus 1 A extra.
      - action: script.ev_lb_volgende_uit
        data:
          nodig: >
            {% if is_state('binary_sensor.ev_lb_overbelasting', 'on') %}
              {{ ([0 - states('sensor.ev_lb_ruimte') | float(0), 0] | max + 1) | round(1) }}
            {% else %}
              0
            {% endif %}

  # ---------------------------------------------------------------
  # Huislasten herstellen — één per keer, pas als er ruim plek is
  # ---------------------------------------------------------------
  - id: ev_lb_herstellen
    alias: "EV – afgeschakelde huislasten herstellen"
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/30"
    conditions:
      - condition: template
        value_template: >
          {% set n = states('input_number.ev_lb_afschakel_niveau') | int(0) %}
          {% set lasten = state_attr('sensor.ev_lb_afschakellijst', 'lasten') or [] %}
          {% set nodig = (lasten[n - 1].ampere if 0 < n <= lasten | count else 10) + 2 %}
          {{ n > 0
             and is_state('binary_sensor.ev_lb_tekort', 'off')
             and is_state('binary_sensor.ev_lb_overbelasting', 'off')
             and states('sensor.ev_lb_ruimte') | float(0) >= nodig
             and (now() - states.input_number.ev_lb_afschakel_niveau.last_changed).total_seconds() >= 120 }}
    actions:
      - action: script.ev_lb_volgende_aan

  # ---------------------------------------------------------------
  # Na herstart: snapshots zijn weg → melden en niveau resetten
  # ---------------------------------------------------------------
  - id: ev_lb_herstart
    alias: "EV – afschakelniveau na herstart"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) > 0 }}"
    actions:
      - variables:
          lasten: "{{ state_attr('sensor.ev_lb_afschakellijst', 'lasten') or [] }}"
          n: "{{ states('input_number.ev_lb_afschakel_niveau') | int(0) }}"
      - action: persistent_notification.create
        data:
          notification_id: ev_lb_herstart
          title: "EV load balancing – controleer huislasten"
          message: >
            HA is herstart terwijl er lasten afgeschakeld waren. Controleer of deze
            weer aan staan: {{ lasten[:n] | map(attribute='naam') | join(', ') }}.
      - action: input_number.set_value
        target:
          entity_id: input_number.ev_lb_afschakel_niveau
        data:
          value: 0

  # ---------------------------------------------------------------
  # Melding als P1-data verouderd is (regeling stuurt dan niets meer)
  # ---------------------------------------------------------------
  - id: ev_lb_p1_melding
    alias: "EV – melding P1-data verouderd"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: template
        value_template: >
          {% set e = states.sensor.p1_meter_power_phase_1 %}
          {{ e is none or e.state in ['unavailable', 'unknown']
             or (now() - e.last_reported).total_seconds() > 60 }}
    actions:
      - action: persistent_notification.create
        data:
          notification_id: ev_lb_p1
          title: "EV load balancing – P1-data ontbreekt"
          message: >
            Geen verse P1-data. Laders vallen terug op
            {{ states('input_number.ev_lb_terugval') }} A.

  # ---------------------------------------------------------------
  # Melding als een lader niet meer verbonden is (OCPP uit / offline)
  # ---------------------------------------------------------------
  - id: ev_lb_lader_verbinding
    alias: "EV – melding lader niet onder controle"
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.ev_lb_rob_onder_controle
          - binary_sensor.ev_lb_sonia_onder_controle
        to: "off"
        for: "00:00:30"
        id: weg
      - trigger: state
        entity_id:
          - binary_sensor.ev_lb_rob_onder_controle
          - binary_sensor.ev_lb_sonia_onder_controle
        to: "on"
        id: terug
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'weg' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: "ev_lb_verbinding_{{ trigger.entity_id }}"
                  title: "⚠️ {{ trigger.to_state.name | replace(' onder controle', '') | replace('EV LB ', 'EV-Lader ') }} niet verbonden"
                  message: >
                    HA kan deze lader niet meer sturen (OCPP uit in de Ratio-app,
                    wifi of lader offline). Hij laadt nu met de maximale stroom
                    uit de Ratio-app. De andere lader en de huislasten regelen
                    eromheen, maar zet OCPP zo snel mogelijk weer aan.
              - action: notify.mobile_app_sm_g781b
                data:
                  title: "⚠️ Laadpaal niet onder controle van HA"
                  message: >
                    {{ trigger.to_state.name | replace(' onder controle', '') | replace('EV LB ', 'EV-Lader ') }}
                    is niet verbonden. Load balancing werkt voor deze lader niet.
                continue_on_error: true
          - conditions: "{{ trigger.id == 'terug' }}"
            sequence:
              - action: persistent_notification.dismiss
                data:
                  notification_id: "ev_lb_verbinding_{{ trigger.entity_id }}"
