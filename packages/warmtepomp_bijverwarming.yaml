# Melding van de elektrische bijverwarming (extra warmteopwekker 2) van de warmtepomp
automation:
  - id: warmtepomp_bijverwarming_gestart
    alias: "Warmtepomp: melding als elektrisch element gaat bijverwarmen"
    description: >
      Trigger: de teller 'second heat generator amount counter' stijgt. (De bedrijfsuren van
      extra warmteopwekker 2 staan sinds 7 april vast op 33,78 u en zijn niet bruikbaar; de
      amount counter steeg op 24-10-2026 21:42 van 386,3 naar 386,9, ruim 14 minuten na een
      test met het element, en daarna niet meer.) De teller loopt dus ongeveer 15 minuten
      achter op het element: het bericht noemt de geschatte starttijd. Het element draait op
      2 fasen (L1 + L3, zie .claude/rules/elektrischestoppen.md). Het bericht zegt ook of
      het element door onze eigen negatieve-prijs-automatisering is gestart of door de
      warmtepomp zelf (stand Automatic).
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.luxtronik_280807_0450_second_heat_generator_amount_counter
    conditions:
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.from_state.state | float(none) is not none
             and trigger.to_state.state | float(none) is not none
             and trigger.to_state.state | float > trigger.from_state.state | float }}
    actions:
      - variables:
          start: "{{ (now() - timedelta(minutes=15)).strftime('%H:%M') }}"
          nu: "{{ now().strftime('%H:%M') }}"
          eigen: >
            {% set la = state_attr('automation.tapwater_negatieve_prijs_opwarmen', 'last_triggered') %}
            {{ is_state('select.luxtronik_280807_0450_dhw_mode', 'Second heatsource')
               or (la is not none and (now() - la).total_seconds() < 5400) }}
          bericht: >
            Teller element: {{ trigger.from_state.state }} → {{ trigger.to_state.state }}
            (+{{ (trigger.to_state.state | float - trigger.from_state.state | float) | round(2) }}).
            Het element draaide ongeveer rond {{ start }} (de teller loopt ~15 min achter, nu {{ nu }}).
            Oorzaak: {{ 'onze negatieve-prijs-automatisering (stand Second heatsource)' if eigen | bool else 'automatisch bijgeschakeld door de warmtepomp (stand Automatic)' }}.
            Compressor {{ states('binary_sensor.luxtronik_280807_0450_compressor') }},
            dhw_mode {{ states('select.luxtronik_280807_0450_dhw_mode') }},
            heating_mode {{ states('select.luxtronik_280807_0450_heating_mode') }}.
            Buiten {{ states('sensor.luxtronik_280807_0450_outdoor_temperature') }} °C,
            boiler {{ states('sensor.luxtronik_280807_0450_dhw_temperature') }} °C,
            aanvoer {{ states('sensor.luxtronik_280807_0450_flow_in_temperature') }} °C,
            kamer {{ states('sensor.luxtronik_280807_0450_room_thermostat_temperature') }} °C.
            Kijk in de history van de P1-fasen L1 en L3 rond {{ start }} om het vermogen te zien.
      - action: notify.mobile_app_sm_g781b
        data:
          title: "🔥 Elektrisch element warmtepomp actief"
          message: "{{ bericht }}"
        continue_on_error: true
      - action: persistent_notification.create
        data:
          notification_id: warmtepomp_bijverwarming
          title: "Elektrisch element warmtepomp actief"
          message: "{{ bericht }}"
