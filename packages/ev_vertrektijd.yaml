# Vertrektijd per werkdag en per weekend/feestdag voor EV-Sonia en EV-Rob.
# input_datetime.ev_*_vertrek is de GELDENDE vertrektijd (die de planning in
# ev_load_balancing.yaml gebruikt) en wordt hier door de automatisering gezet
# vanuit de twee instelbare tijden (werkdag / weekend en feestdag).
# Per auto zijn de weekdagen af te vinken die als werkdag gelden
# (input_boolean.ev_<auto>_werkdag_<ma..zo>, standaard ma-vr). Een afgevinkte dag
# krijgt de werkdagtijd, tenzij het een feestdag is.
# Feestdagen komen uit de HA-integratie Werkdag, entry 2 (binary_sensor.workday_sensor_nl_2:
# land NL, alle 7 dagen werkdag, alleen feestdagen uitgesloten). Let op: Goede Vrijdag
# telt daar als gewone dag. binary_sensor.workday_sensor_nl (ma-vr, zonder weekend en
# feestdagen) blijft bestaan maar wordt hier niet gebruikt.
#
# Wisselmoment: elke dag om 12:00. Daarna geldt de tijd van de VOLGENDE ochtend
# (zo plant de nachtelijke planning al vanaf de middag/avond op de juiste
# vertrektijd). Vóór 12:00 geldt de tijd van vandaag. De weekendtijd moet dus
# vóór 12:00 liggen, anders rekent de planning tot de wisseling een dag te ver.
input_datetime:
  ev_sonia_vertrek_werkdag:
    name: "EV-Sonia – vertrektijd werkdag"
    has_date: false
    has_time: true
  ev_sonia_vertrek_weekend:
    name: "EV-Sonia – vertrektijd weekend en feestdag"
    has_date: false
    has_time: true
  ev_rob_vertrek_werkdag:
    name: "EV-Rob – vertrektijd werkdag"
    has_date: false
    has_time: true
  ev_rob_vertrek_weekend:
    name: "EV-Rob – vertrektijd weekend en feestdag"
    has_date: false
    has_time: true

input_boolean:
  ev_sonia_werkdag_ma:
    name: "EV-Sonia – werkdag maandag"
  ev_sonia_werkdag_di:
    name: "EV-Sonia – werkdag dinsdag"
  ev_sonia_werkdag_wo:
    name: "EV-Sonia – werkdag woensdag"
  ev_sonia_werkdag_do:
    name: "EV-Sonia – werkdag donderdag"
  ev_sonia_werkdag_vr:
    name: "EV-Sonia – werkdag vrijdag"
  ev_sonia_werkdag_za:
    name: "EV-Sonia – werkdag zaterdag"
  ev_sonia_werkdag_zo:
    name: "EV-Sonia – werkdag zondag"
  ev_rob_werkdag_ma:
    name: "EV-Rob – werkdag maandag"
  ev_rob_werkdag_di:
    name: "EV-Rob – werkdag dinsdag"
  ev_rob_werkdag_wo:
    name: "EV-Rob – werkdag woensdag"
  ev_rob_werkdag_do:
    name: "EV-Rob – werkdag donderdag"
  ev_rob_werkdag_vr:
    name: "EV-Rob – werkdag vrijdag"
  ev_rob_werkdag_za:
    name: "EV-Rob – werkdag zaterdag"
  ev_rob_werkdag_zo:
    name: "EV-Rob – werkdag zondag"

automation:
  - id: ev_vertrektijd_werkdag_weekend
    alias: "EV – vertrektijd volgens werkdag of weekend/feestdag"
    description: >
      Zet input_datetime.ev_sonia_vertrek en ev_rob_vertrek op de werkdag- of
      weekend/feestdag-tijd: een dag is werkdag als die per auto is afgevinkt
      en geen feestdag is. Vóór 12:00 telt de dag van vandaag, vanaf 12:00 de
      dag van morgen (de eerstvolgende ochtend waarop de auto vertrekt).
    mode: queued
    triggers:
      - trigger: time
        at: "12:00:00"
      - trigger: time
        at: "00:05:00"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_datetime.ev_sonia_vertrek_werkdag
          - input_datetime.ev_sonia_vertrek_weekend
          - input_datetime.ev_rob_vertrek_werkdag
          - input_datetime.ev_rob_vertrek_weekend
          - input_boolean.ev_sonia_werkdag_ma
          - input_boolean.ev_sonia_werkdag_di
          - input_boolean.ev_sonia_werkdag_wo
          - input_boolean.ev_sonia_werkdag_do
          - input_boolean.ev_sonia_werkdag_vr
          - input_boolean.ev_sonia_werkdag_za
          - input_boolean.ev_sonia_werkdag_zo
          - input_boolean.ev_rob_werkdag_ma
          - input_boolean.ev_rob_werkdag_di
          - input_boolean.ev_rob_werkdag_wo
          - input_boolean.ev_rob_werkdag_do
          - input_boolean.ev_rob_werkdag_vr
          - input_boolean.ev_rob_werkdag_za
          - input_boolean.ev_rob_werkdag_zo
    actions:
      - delay: "00:00:05"
      - action: workday.check_date
        target:
          entity_id: binary_sensor.workday_sensor_nl_2
        data:
          check_date: >
            {{ (now() if now().hour < 12 else now() + timedelta(days=1)).date().isoformat() }}
        response_variable: dag
      - variables:
          geen_feestdag: "{{ dag['binary_sensor.workday_sensor_nl_2'].workday }}"
          dagkort: >
            {{ ['ma','di','wo','do','vr','za','zo'][(now() if now().hour < 12 else now() + timedelta(days=1)).weekday()] }}
      - repeat:
          for_each: ["sonia", "rob"]
          sequence:
            - variables:
                is_werkdag: >
                  {{ geen_feestdag and is_state('input_boolean.ev_' ~ repeat.item ~ '_werkdag_' ~ dagkort, 'on') }}
                nieuw: >
                  {{ states('input_datetime.ev_' ~ repeat.item ~ '_vertrek_' ~ ('werkdag' if is_werkdag else 'weekend')) }}
            - if:
                - condition: template
                  value_template: >
                    {{ nieuw not in ('unknown', 'unavailable', '')
                       and nieuw != states('input_datetime.ev_' ~ repeat.item ~ '_vertrek') }}
              then:
                - action: input_datetime.set_datetime
                  target:
                    entity_id: "input_datetime.ev_{{ repeat.item }}_vertrek"
                  data:
                    time: "{{ nieuw }}"

# Tekstversie (HH:MM met voorloopnul) van de tijden, zodat de dubbele punten in het
# dashboard onder elkaar staan (anders toont HA '7:00' en '10:00' verschillend breed).
template:
  - sensor:
      - name: "EV-Sonia – vertrektijd werkdag (tekst)"
        unique_id: ev_sonia_vertrek_werkdag_tijd
        state: "{{ (states('input_datetime.ev_sonia_vertrek_werkdag') | string)[:5] if has_value('input_datetime.ev_sonia_vertrek_werkdag') else 'onbekend' }}"
      - name: "EV-Sonia – vertrektijd weekend en feestdag (tekst)"
        unique_id: ev_sonia_vertrek_weekend_tijd
        state: "{{ (states('input_datetime.ev_sonia_vertrek_weekend') | string)[:5] if has_value('input_datetime.ev_sonia_vertrek_weekend') else 'onbekend' }}"
      - name: "EV-Sonia – vertrektijd geldend (tekst)"
        unique_id: ev_sonia_vertrek_geldend_tijd
        state: "{{ (states('input_datetime.ev_sonia_vertrek') | string)[:5] if has_value('input_datetime.ev_sonia_vertrek') else 'onbekend' }}"
      - name: "EV-Rob – vertrektijd werkdag (tekst)"
        unique_id: ev_rob_vertrek_werkdag_tijd
        state: "{{ (states('input_datetime.ev_rob_vertrek_werkdag') | string)[:5] if has_value('input_datetime.ev_rob_vertrek_werkdag') else 'onbekend' }}"
      - name: "EV-Rob – vertrektijd weekend en feestdag (tekst)"
        unique_id: ev_rob_vertrek_weekend_tijd
        state: "{{ (states('input_datetime.ev_rob_vertrek_weekend') | string)[:5] if has_value('input_datetime.ev_rob_vertrek_weekend') else 'onbekend' }}"
      - name: "EV-Rob – vertrektijd geldend (tekst)"
        unique_id: ev_rob_vertrek_geldend_tijd
        state: "{{ (states('input_datetime.ev_rob_vertrek') | string)[:5] if has_value('input_datetime.ev_rob_vertrek') else 'onbekend' }}"
