# =====================================================================
# packages/ev_laden.yaml  (v3 – vervangt eerdere ev_*.yaml; verwijder die!)
#
# Per lader (A en B), ongeacht welke auto eraan hangt:
#  - Autoherkenning na insteken: 1-2 min 3x10 A aanbieden en meten.
#      vermogen / (230 V x aangeboden A) ≈ 3 -> "3-fase", ≈ 1 -> "1-fase"
#      (Ioniq en een andere 3-fase EV zien er hetzelfde uit; handmatig
#       overschrijven kan via de select "Lader X – auto")
#  - EPEX-planning op benodigde kWh + vertrektijd (per lader)
#  - PV-overschot, bij 3-fase auto's met 1/3-fase wissel (max 1x per 10 min)
#  - Load balancing per fase over beide laders (prioriteit of gelijk verdelen)
#
# KOPPELING (ingevuld):
#   chargersonia = EV-Lader 1 Sonia = HA entity chargersonia_* (OCPP chargePointId chargersonia, van leverancier)
#   chargerrob = EV-Lader 2 Rob   = HA entity chargerrob_* (OCPP chargePointId chargerrob, van leverancier)
#   P1 = HomeWizard, sensor.p1_meter_power_phase_1..3 (W, negatief = teruglevering)
#   Prijs = sensor.zonneplan_current_electricity_tariff
#   Aanname: 1-fase laden op L1 (per lader aan te passen via select).
#
# 1/3-FASE WISSEL STAAT UIT tot je hem getest hebt:
#   action: script.ev_zet_laadprofiel
#   data: {devid: chargersonia, amps: 10, fasen: 1}   # devid = OCPP-id, blijft chargersonia
#   (met input_boolean.ev_1fase_ondersteund tijdelijk aan)
# Regelaar optimaliseert per 30 s; noodrem grijpt binnen ~3-5 s in bij overbelasting.
# =====================================================================

input_boolean:
  ev_slimme_sturing:
    name: "EV – slimme sturing actief"
    icon: mdi:ev-station
  ev_1fase_ondersteund:
    name: "EV – 1/3-fase wissel via OCPP (na test aanzetten)"
    icon: mdi:sine-wave
  chargersonia_direct_laden:
    name: "chargersonia – direct laden (boost)"
    icon: mdi:lightning-bolt
  chargerrob_direct_laden:
    name: "chargerrob – direct laden (boost)"
    icon: mdi:lightning-bolt

input_select:
  ev_prioriteit:
    name: "EV – prioriteit bij krapte"
    options: ["chargersonia", "chargerrob", "Gelijk verdelen"]
  chargersonia_auto:
    name: "chargersonia – auto"
    options: ["Onbekend", "3-fase", "1-fase"]
  chargerrob_auto:
    name: "chargerrob – auto"
    options: ["Onbekend", "3-fase", "1-fase"]
  chargersonia_eenfase_op:
    name: "chargersonia – 1-fase laden op"
    options: ["L1", "L2", "L3"]
  chargerrob_eenfase_op:
    name: "chargerrob – 1-fase laden op"
    options: ["L1", "L2", "L3"]

input_number:
  ev_hoofdzekering:
    name: "EV – hoofdzekering per fase"
    min: 16
    max: 40
    step: 1
    unit_of_measurement: A
    mode: box
  ev_marge:
    name: "EV – veiligheidsmarge per fase"
    min: 0
    max: 6
    step: 1
    unit_of_measurement: A
  ev_prijsdrempel:
    name: "EV – altijd laden bij prijs onder"
    min: -0.50
    max: 0.50
    step: 0.01
    unit_of_measurement: "€/kWh"
    mode: box
  chargersonia_benodigde_kwh:
    name: "chargersonia – benodigde kWh deze sessie"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: kWh
    mode: box
  chargerrob_benodigde_kwh:
    name: "chargerrob – benodigde kWh deze sessie"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: kWh
    mode: box
  chargersonia_max_stroom:
    name: "chargersonia – max laadstroom"
    min: 6
    max: 16
    step: 1
    unit_of_measurement: A
  chargerrob_max_stroom:
    name: "chargerrob – max laadstroom"
    min: 6
    max: 16
    step: 1
    unit_of_measurement: A
  # interne toestand
  chargersonia_laatst_gezet:
    name: "chargersonia – laatst gezette stroom (intern)"
    min: -1
    max: 32
    step: 1
    mode: box
  chargerrob_laatst_gezet:
    name: "chargerrob – laatst gezette stroom (intern)"
    min: -1
    max: 32
    step: 1
    mode: box
  chargersonia_fasen:
    name: "chargersonia – actieve fasen (intern)"
    min: 1
    max: 3
    step: 2
    mode: box
  chargerrob_fasen:
    name: "chargerrob – actieve fasen (intern)"
    min: 1
    max: 3
    step: 2
    mode: box

input_datetime:
  chargersonia_vertrek:
    name: "chargersonia – vertrektijd"
    has_date: false
    has_time: true
  chargerrob_vertrek:
    name: "chargerrob – vertrektijd"
    has_date: false
    has_time: true
  chargersonia_ingeplugd:
    name: "chargersonia – ingeplugd (intern)"
    has_date: true
    has_time: true
  chargerrob_ingeplugd:
    name: "chargerrob – ingeplugd (intern)"
    has_date: true
    has_time: true
  chargersonia_fasewissel:
    name: "chargersonia – laatste fasewissel (intern)"
    has_date: true
    has_time: true
  chargerrob_fasewissel:
    name: "chargerrob – laatste fasewissel (intern)"
    has_date: true
    has_time: true

template:
  - sensor:
      # Read-only weergave van input_number.ev_hoofdzekering voor het Laden-
      # dashboard: een input_number-rij in een entities-kaart toont altijd een
      # schuifregelaar/invoerveld (vast HA-gedrag, niet uit te zetten zonder
      # custom card). Deze sensor spiegelt de waarde als platte tekst, niet
      # aanpasbaar vanaf het dashboard. De echte instelbare input_number blijft
      # ongewijzigd beschikbaar via Instellingen > Apparaten & services > Helpers.
      - name: "EV hoofdzekering weergave"
        unique_id: ev_hoofdzekering_weergave
        unit_of_measurement: A
        availability: "{{ has_value('input_number.ev_hoofdzekering') }}"
        state: "{{ states('input_number.ev_hoofdzekering') | float | round(0) }}"

      # ---------- P1 netto per fase (W, + afname / - teruglevering) ----------
      - name: "EV P1 net L1"
        unique_id: ev_p1_net_l1
        unit_of_measurement: W
        device_class: power
        availability: "{{ has_value('sensor.p1_meter_power_phase_1') }}"
        state: "{{ states('sensor.p1_meter_power_phase_1') | float | round(0) }}"
      - name: "EV P1 net L2"
        unique_id: ev_p1_net_l2
        unit_of_measurement: W
        device_class: power
        availability: "{{ has_value('sensor.p1_meter_power_phase_2') }}"
        state: "{{ states('sensor.p1_meter_power_phase_2') | float | round(0) }}"
      - name: "EV P1 net L3"
        unique_id: ev_p1_net_l3
        unit_of_measurement: W
        device_class: power
        availability: "{{ has_value('sensor.p1_meter_power_phase_3') }}"
        state: "{{ states('sensor.p1_meter_power_phase_3') | float | round(0) }}"

      # ---------- PV-overschot = PV - huisverbruik (laders eruit gerekend) ----------
      - name: "EV PV-overschot"
        unique_id: ev_pv_overschot
        unit_of_measurement: W
        device_class: power
        availability: "{{ has_value('sensor.ev_p1_net_l1') and has_value('sensor.ev_p1_net_l2') and has_value('sensor.ev_p1_net_l3') }}"
        state: >
          {% set net = states('sensor.ev_p1_net_l1')|float + states('sensor.ev_p1_net_l2')|float + states('sensor.ev_p1_net_l3')|float %}
          {% set laders = (states('sensor.chargersonia_power_active_import')|float(0)
                         + states('sensor.chargerrob_power_active_import')|float(0)) * 1000 %}
          {{ [laders - net, 0] | max | round(0) }}

      # ---------- Huisstroom per fase zonder laders (A) ----------
      - name: "EV huis stroom L1"
        unique_id: ev_huis_stroom_l1
        unit_of_measurement: A
        availability: "{{ has_value('sensor.ev_p1_net_l1') }}"
        state: >
          {% set ns = namespace(w=0) %}
          {% for x in ['a', 'b'] %}
            {% set p = states('sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_power_active_import')|float(0) * 1000 %}
            {% set een = is_state('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_auto', '1-fase') or states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_fasen')|int(3) == 1 %}
            {% if not een %}{% set ns.w = ns.w + p / 3 %}
            {% elif is_state('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_eenfase_op', 'L1') %}{% set ns.w = ns.w + p %}{% endif %}
          {% endfor %}
          {{ ((states('sensor.ev_p1_net_l1')|float - ns.w) / 230) | round(1) }}
      - name: "EV huis stroom L2"
        unique_id: ev_huis_stroom_l2
        unit_of_measurement: A
        availability: "{{ has_value('sensor.ev_p1_net_l2') }}"
        state: >
          {% set ns = namespace(w=0) %}
          {% for x in ['a', 'b'] %}
            {% set p = states('sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_power_active_import')|float(0) * 1000 %}
            {% set een = is_state('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_auto', '1-fase') or states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_fasen')|int(3) == 1 %}
            {% if not een %}{% set ns.w = ns.w + p / 3 %}
            {% elif is_state('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_eenfase_op', 'L2') %}{% set ns.w = ns.w + p %}{% endif %}
          {% endfor %}
          {{ ((states('sensor.ev_p1_net_l2')|float - ns.w) / 230) | round(1) }}
      - name: "EV huis stroom L3"
        unique_id: ev_huis_stroom_l3
        unit_of_measurement: A
        availability: "{{ has_value('sensor.ev_p1_net_l3') }}"
        state: >
          {% set ns = namespace(w=0) %}
          {% for x in ['a', 'b'] %}
            {% set p = states('sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_power_active_import')|float(0) * 1000 %}
            {% set een = is_state('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_auto', '1-fase') or states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_fasen')|int(3) == 1 %}
            {% if not een %}{% set ns.w = ns.w + p / 3 %}
            {% elif is_state('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_eenfase_op', 'L3') %}{% set ns.w = ns.w + p %}{% endif %}
          {% endfor %}
          {{ ((states('sensor.ev_p1_net_l3')|float - ns.w) / 230) | round(1) }}

      # ---------- Beschikbare laadruimte per fase (A) ----------
      - name: "EV ruimte L1"
        unique_id: ev_ruimte_l1
        unit_of_measurement: A
        availability: "{{ has_value('sensor.ev_huis_stroom_l1') }}"
        state: >
          {{ (states('input_number.ev_hoofdzekering')|float(25) - states('input_number.ev_marge')|float(2)
              - states('sensor.ev_huis_stroom_l1')|float) | round(0, 'floor') | int }}
      - name: "EV ruimte L2"
        unique_id: ev_ruimte_l2
        unit_of_measurement: A
        availability: "{{ has_value('sensor.ev_huis_stroom_l2') }}"
        state: >
          {{ (states('input_number.ev_hoofdzekering')|float(25) - states('input_number.ev_marge')|float(2)
              - states('sensor.ev_huis_stroom_l2')|float) | round(0, 'floor') | int }}
      - name: "EV ruimte L3"
        unique_id: ev_ruimte_l3
        unit_of_measurement: A
        availability: "{{ has_value('sensor.ev_huis_stroom_l3') }}"
        state: >
          {{ (states('input_number.ev_hoofdzekering')|float(25) - states('input_number.ev_marge')|float(2)
              - states('sensor.ev_huis_stroom_l3')|float) | round(0, 'floor') | int }}

      # ---------- Optimale 1-fase keuze per lader (minst belaste fase) ----------
      # Advies-sensor: welke fase heeft nu de meeste ruimte voor 1-fase laden.
      # Hysterese 3 A: wisselt alleen als een andere fase >=3 A méér ruimte heeft
      # dan de huidig ingestelde fase; voorkomt gefladder bij kleine schommelingen.
      # LET OP: dit stuurt niets fysiek. De Ratio laadt 1-fase op de fase die
      # fysiek bedraad is als primary. Pas input_select.ev_X_eenfase_op (en zo
      # nodig de bedrading) aan op basis van deze sensor.
      - name: "chargersonia optimale fase"
        unique_id: chargersonia_optimale_fase
        availability: "{{ has_value('sensor.ev_ruimte_l1') and has_value('sensor.ev_ruimte_l2') and has_value('sensor.ev_ruimte_l3') }}"
        state: >
          {% set r = {'L1': states('sensor.ev_ruimte_l1')|int(0),
                      'L2': states('sensor.ev_ruimte_l2')|int(0),
                      'L3': states('sensor.ev_ruimte_l3')|int(0)} %}
          {% set huidig = states('input_select.chargersonia_eenfase_op') %}
          {% set beste = (r.items() | sort(attribute=1, reverse=true) | list)[0] %}
          {% if beste[1] >= r.get(huidig, 0) + 3 %}{{ beste[0] }}{% else %}{{ huidig }}{% endif %}
        attributes:
          ruimte_l1: "{{ states('sensor.ev_ruimte_l1') }}"
          ruimte_l2: "{{ states('sensor.ev_ruimte_l2') }}"
          ruimte_l3: "{{ states('sensor.ev_ruimte_l3') }}"
          ingesteld: "{{ states('input_select.chargersonia_eenfase_op') }}"
          advies_vermogen_w: >
            {% set r = {'L1': states('sensor.ev_ruimte_l1')|int(0),
                        'L2': states('sensor.ev_ruimte_l2')|int(0),
                        'L3': states('sensor.ev_ruimte_l3')|int(0)} %}
            {% set max_a = [states('input_number.chargersonia_max_stroom')|int(16),
                            (r.values() | list | max)] | min %}
            {{ (max_a * 230) | int }}

      - name: "chargerrob optimale fase"
        unique_id: chargerrob_optimale_fase
        availability: "{{ has_value('sensor.ev_ruimte_l1') and has_value('sensor.ev_ruimte_l2') and has_value('sensor.ev_ruimte_l3') }}"
        state: >
          {% set r = {'L1': states('sensor.ev_ruimte_l1')|int(0),
                      'L2': states('sensor.ev_ruimte_l2')|int(0),
                      'L3': states('sensor.ev_ruimte_l3')|int(0)} %}
          {% set huidig = states('input_select.chargerrob_eenfase_op') %}
          {% set beste = (r.items() | sort(attribute=1, reverse=true) | list)[0] %}
          {% if beste[1] >= r.get(huidig, 0) + 3 %}{{ beste[0] }}{% else %}{{ huidig }}{% endif %}
        attributes:
          ruimte_l1: "{{ states('sensor.ev_ruimte_l1') }}"
          ruimte_l2: "{{ states('sensor.ev_ruimte_l2') }}"
          ruimte_l3: "{{ states('sensor.ev_ruimte_l3') }}"
          ingesteld: "{{ states('input_select.chargerrob_eenfase_op') }}"
          advies_vermogen_w: >
            {% set r = {'L1': states('sensor.ev_ruimte_l1')|int(0),
                        'L2': states('sensor.ev_ruimte_l2')|int(0),
                        'L3': states('sensor.ev_ruimte_l3')|int(0)} %}
            {% set max_a = [states('input_number.chargerrob_max_stroom')|int(16),
                            (r.values() | list | max)] | min %}
            {{ (max_a * 230) | int }}

      # ---------- Laadplan per lader: state = nog te laden kWh ----------
      - name: "chargersonia laadplan"
        unique_id: chargersonia_laadplan
        unit_of_measurement: kWh
        state: >
          {% set x = 'a' %}
          {% set need = states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_benodigde_kwh') | float(0) %}
          {% set done = states('sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_energy_session') | float(0) %}
          {{ [need - done, 0] | max | round(1) }}
        attributes:
          forecast_ok: &forecast_ok >
            {{ (state_attr('sensor.zonneplan_current_electricity_tariff','forecast') or []) | count > 0 }}
          slot_s: &slot_s >
            {% set fc = state_attr('sensor.zonneplan_current_electricity_tariff','forecast') or [] %}
            {% if fc | count > 1 %}
              {{ (as_datetime(fc[1].datetime) - as_datetime(fc[0].datetime)).total_seconds() | int }}
            {% else %}3600{% endif %}
          plan: >
            {% set x = 'a' %}
            {% set fc = state_attr('sensor.zonneplan_current_electricity_tariff','forecast') or [] %}
            {% set slot = 3600 %}
            {% if fc | count > 1 %}
              {% set slot = (as_datetime(fc[1].datetime) - as_datetime(fc[0].datetime)).total_seconds() | int %}
            {% endif %}
            {% set need = states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_benodigde_kwh') | float(0) %}
            {% set done = states('sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_energy_session') | float(0) %}
            {% set rest = [need - done, 0] | max %}
            {# kW per A: 3-fase 0,65 / 1-fase 0,215 (incl. marge voor verliezen) #}
            {% set kwa = 0.215 if is_state('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_auto', '1-fase') else 0.65 %}
            {% set kw = states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_max_stroom') | float(16) * kwa %}
            {% set n = ((rest / kw) * 3600 / slot) | round(0, 'ceil') | int %}
            {% set dl = today_at(states('input_datetime.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_vertrek')) %}
            {% if dl <= now() %}{% set dl = dl + timedelta(days=1) %}{% endif %}
            {% set ns = namespace(s=[]) %}
            {% for f in fc %}
              {% set st = as_datetime(f.datetime) %}
              {% if st is not none and st + timedelta(seconds=slot) > now() and st < dl %}
                {% set ns.s = ns.s + [{'t': st.timestamp() | int, 'p': f.electricity_price | float(0)}] %}
              {% endif %}
            {% endfor %}
            {{ ((ns.s | sort(attribute='p'))[:n] | map(attribute='t') | sort | list) if n > 0 else [] }}
          plan_leesbaar: &plan_leesbaar >
            {{ (this.attributes.plan | default([])) | map('timestamp_custom', '%a %H:%M') | list }}

      - name: "chargerrob laadplan"
        unique_id: chargerrob_laadplan
        unit_of_measurement: kWh
        state: >
          {% set x = 'b' %}
          {% set need = states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_benodigde_kwh') | float(0) %}
          {% set done = states('sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_energy_session') | float(0) %}
          {{ [need - done, 0] | max | round(1) }}
        attributes:
          forecast_ok: *forecast_ok
          slot_s: *slot_s
          plan: >
            {% set x = 'b' %}
            {% set fc = state_attr('sensor.zonneplan_current_electricity_tariff','forecast') or [] %}
            {% set slot = 3600 %}
            {% if fc | count > 1 %}
              {% set slot = (as_datetime(fc[1].datetime) - as_datetime(fc[0].datetime)).total_seconds() | int %}
            {% endif %}
            {% set need = states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_benodigde_kwh') | float(0) %}
            {% set done = states('sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_energy_session') | float(0) %}
            {% set rest = [need - done, 0] | max %}
            {% set kwa = 0.215 if is_state('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_auto', '1-fase') else 0.65 %}
            {% set kw = states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_max_stroom') | float(16) * kwa %}
            {% set n = ((rest / kw) * 3600 / slot) | round(0, 'ceil') | int %}
            {% set dl = today_at(states('input_datetime.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_vertrek')) %}
            {% if dl <= now() %}{% set dl = dl + timedelta(days=1) %}{% endif %}
            {% set ns = namespace(s=[]) %}
            {% for f in fc %}
              {% set st = as_datetime(f.datetime) %}
              {% if st is not none and st + timedelta(seconds=slot) > now() and st < dl %}
                {% set ns.s = ns.s + [{'t': st.timestamp() | int, 'p': f.electricity_price | float(0)}] %}
              {% endif %}
            {% endfor %}
            {{ ((ns.s | sort(attribute='p'))[:n] | map(attribute='t') | sort | list) if n > 0 else [] }}
          plan_leesbaar: *plan_leesbaar

  - binary_sensor:
      - name: "chargersonia goedkoop slot"
        unique_id: chargersonia_goedkoop_slot
        state: >
          {% set p = state_attr('sensor.chargersonia_laadplan','plan') or [] %}
          {% set slot = state_attr('sensor.chargersonia_laadplan','slot_s') | int(3600) %}
          {% set t = now().timestamp() %}
          {{ p | select('le', t) | select('gt', t - slot) | list | count > 0 }}
      - name: "chargerrob goedkoop slot"
        unique_id: chargerrob_goedkoop_slot
        state: >
          {% set p = state_attr('sensor.chargerrob_laadplan','plan') or [] %}
          {% set slot = state_attr('sensor.chargerrob_laadplan','slot_s') | int(3600) %}
          {% set t = now().timestamp() %}
          {{ p | select('le', t) | select('gt', t - slot) | list | count > 0 }}

script:
  ev_zet_laadprofiel:
    alias: "EV – zet laadprofiel"
    mode: queued
    fields:
      devid:
        description: "OCPP charge point id"
      amps:
        description: "Laadstroom per fase (0 = pauze)"
      fasen:
        description: "1 of 3"
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.ev_1fase_ondersteund
            state: "on"
        then:
          - action: ocpp.set_charge_rate
            data:
              devid: "{{ devid }}"
              custom_profile:
                chargingProfileId: 8
                stackLevel: 2
                chargingProfilePurpose: TxProfile
                chargingProfileKind: Relative
                chargingSchedule:
                  chargingRateUnit: A
                  chargingSchedulePeriod:
                    - startPeriod: 0
                      limit: "{{ amps | int }}"
                      numberPhases: "{{ fasen | int }}"
        else:
          - action: ocpp.set_charge_rate
            data:
              devid: "{{ devid }}"
              limit_amps: "{{ amps | int }}"

automation:
  # -------------------------------------------------------------------
  # Hoofdregelaar: bepaalt per lader stroom en fasen, met load balancing
  # -------------------------------------------------------------------
  - id: ev_regelaar
    alias: "EV – regelaar (EPEX, PV, fase, load balancing)"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/30"
        id: periodiek
      - trigger: state
        entity_id:
          - sensor.chargersonia_status_connector
          - sensor.chargerrob_status_connector
        id: plug
      - trigger: state
        entity_id:
          - input_boolean.chargersonia_direct_laden
          - input_boolean.chargerrob_direct_laden
          - binary_sensor.chargersonia_goedkoop_slot
          - binary_sensor.chargerrob_goedkoop_slot
          - input_select.chargersonia_auto
          - input_select.chargerrob_auto
        id: beslissing
      - trigger: homeassistant
        event: start
        id: start
    conditions:
      - condition: state
        entity_id: input_boolean.ev_slimme_sturing
        state: "on"
    actions:
      - variables:
          niet_aan: ["Available", "Unavailable", "Faulted", "unavailable", "unknown"]
          fase_ok: "{{ is_state('input_boolean.ev_1fase_ondersteund', 'on') }}"
          besluit: >
            {% set niet_aan = ['Available', 'Unavailable', 'Faulted', 'unavailable', 'unknown'] %}
            {% set fase_ok = is_state('input_boolean.ev_1fase_ondersteund', 'on') %}
            {% set prijs_laag = states('sensor.zonneplan_current_electricity_tariff') | float(99)
                                <= states('input_number.ev_prijsdrempel') | float(-99) %}
            {% set prio = states('input_select.ev_prioriteit') %}
            {% set volgorde = ['b', 'a'] if prio == 'chargerrob' else ['a', 'b'] %}
            {% set beide = states('sensor.chargersonia_status_connector') not in niet_aan
                           and states('sensor.chargerrob_status_connector') not in niet_aan %}
            {% set gelijk = prio == 'Gelijk verdelen' and beide %}
            {% set t = now().timestamp() %}
            {# Geen P1? Dan 6 A per fase aannemen; Ratio Sense P1 beveiligt #}
            {% set ns = namespace(r1=states('sensor.ev_ruimte_l1') | int(6),
                                  r2=states('sensor.ev_ruimte_l2') | int(6),
                                  r3=states('sensor.ev_ruimte_l3') | int(6),
                                  s=states('sensor.ev_pv_overschot') | float(0),
                                  a_amps=0, a_fasen=3, b_amps=0, b_fasen=3) %}
            {% for x in volgorde %}
              {% set actief = states('sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_status_connector') not in niet_aan %}
              {% set auto = states('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_auto') %}
              {% set drie = auto != '1-fase' %}
              {% set max_a = states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_max_stroom') | int(16) %}
              {% set huidig_f = states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_fasen') | int(3) %}
              {% set laatst = states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_laatst_gezet') | int(-1) %}
              {% set eenfase = states('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_eenfase_op') | lower %}
              {% set rest = states('sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_laadplan') | float(0) %}
              {% set vol = is_state('input_boolean.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_direct_laden', 'on') or prijs_laag
                           or (rest > 0 and (is_state('binary_sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_goedkoop_slot', 'on')
                                             or not state_attr('sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_laadplan', 'forecast_ok'))) %}
              {% set sinds_plug = t - state_attr('input_datetime.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_ingeplugd', 'timestamp') | float(0) %}
              {% set sinds_wissel = t - state_attr('input_datetime.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_fasewissel', 'timestamp') | float(0) %}
              {% set detectie = auto == 'Onbekend' and sinds_plug < 300 %}
              {% set deel = 0.5 if (gelijk and loop.first) else 1 %}
              {% set rf = {'l1': ns.r1, 'l2': ns.r2, 'l3': ns.r3} %}
              {% set r_all = ([ns.r1, ns.r2, ns.r3] | min * deel) | round(0, 'floor') | int %}
              {% set r_een = (rf.get(eenfase, ns.r1) * deel) | round(0, 'floor') | int %}
              {% set a = 0 %}
              {% set f = (huidig_f if (drie and fase_ok) else 3) if drie else 1 %}
              {% if actief %}
                {% if detectie %}
                  {# herkenning: kort 3 x 10 A aanbieden #}
                  {% set f = 3 %}
                  {% set a = [10, r_all] | min %}
                {% elif vol %}
                  {# 3-fase: krapste fase bepaalt A per fase (r_all = min(r1,r2,r3)),
                     die A wordt over 3 fasen geladen. Streven = max_a (16 A = 11 kW)
                     maar bij minder ruimte proportioneel lager. #}
                  {% if drie %}
                    {% set f = 3 %}
                    {% set a = [max_a, r_all] | min %}
                  {% else %}
                    {% set a = [max_a, r_een] | min %}
                  {% endif %}
                {% else %}
                  {# PV-overschot, met hysterese #}
                  {% set s = ns.s %}
                  {% set start = 1300 if laatst > 0 else 1500 %}
                  {% set kan3 = drie and (s >= 4500 or (huidig_f == 3 and laatst > 0 and s >= 4000)) %}
                  {% set kan1 = s >= start and (not drie or fase_ok) %}
                  {% if kan3 %}{% set f = 3 %}{% elif kan1 %}{% set f = 1 %}{% endif %}
                  {# fasewissel hooguit 1x per 10 minuten #}
                  {% if drie and fase_ok and (kan3 or kan1) and f != huidig_f and laatst > 0 and sinds_wissel < 600 %}
                    {% set f = huidig_f %}
                  {% endif %}
                  {% if kan3 or kan1 %}
                    {% if drie and f == 3 %}
                      {% set a = [max_a, (s / 690) | int, r_all] | min %}
                    {% else %}
                      {% set a = [max_a, (s / 230) | int, r_een] | min %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endif %}
              {% if a < 6 %}{% set a = 0 %}{% endif %}
              {# ruimte en PV-overschot verminderen voor de volgende lader #}
              {% set drie_fasen = drie and f == 3 %}
              {% set ns.s = ns.s - a * 230 * (3 if drie_fasen else 1) %}
              {% if drie_fasen %}
                {% set ns.r1 = ns.r1 - a %}
                {% set ns.r2 = ns.r2 - a %}
                {% set ns.r3 = ns.r3 - a %}
              {% elif eenfase == 'l2' %}
                {% set ns.r2 = ns.r2 - a %}
              {% elif eenfase == 'l3' %}
                {% set ns.r3 = ns.r3 - a %}
              {% else %}
                {% set ns.r1 = ns.r1 - a %}
              {% endif %}
              {% if x == 'a' %}
                {% set ns.a_amps = a %}
                {% set ns.a_fasen = f %}
              {% else %}
                {% set ns.b_amps = a %}
                {% set ns.b_fasen = f %}
              {% endif %}
            {% endfor %}
            {{ {'a_amps': ns.a_amps, 'a_fasen': ns.a_fasen, 'b_amps': ns.b_amps, 'b_fasen': ns.b_fasen} }}
      - repeat:
          for_each: ["a", "b"]
          sequence:
            - variables:
                x: "{{ repeat.item }}"
                amps: "{{ besluit[repeat.item ~ '_amps'] | int }}"
                fasen: "{{ besluit[repeat.item ~ '_fasen'] | int }}"
                huidig_f: "{{ states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[repeat.item] ~ '_fasen') | int(3) }}"
                laatst: "{{ states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[repeat.item] ~ '_laatst_gezet') | int(-1) }}"
                actief: "{{ states('sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[repeat.item] ~ '_status_connector') not in niet_aan }}"
            - if:
                - condition: template
                  value_template: >
                    {{ actief and (trigger.id in ['plug', 'start'] or amps != laatst or fasen != huidig_f) }}
              then:
                - if:
                    - condition: template
                      value_template: "{{ fase_ok and fasen != huidig_f and laatst > 0 }}"
                  then:
                    # eerst pauzeren, dan van fase wisselen
                    - action: script.ev_zet_laadprofiel
                      data:
                        devid: "{{ {'a': 'chargersonia', 'b': 'chargerrob'}[x] }}"
                        amps: 0
                        fasen: "{{ huidig_f }}"
                    - delay: "00:00:30"
                - if:
                    - condition: template
                      value_template: "{{ fasen != huidig_f }}"
                  then:
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: "input_datetime.{{ {'a': 'chargersonia', 'b': 'chargerrob'}[x] }}_fasewissel"
                      data:
                        timestamp: "{{ now().timestamp() }}"
                - action: script.ev_zet_laadprofiel
                  data:
                    devid: "{{ {'a': 'chargersonia', 'b': 'chargerrob'}[x] }}"
                    amps: "{{ amps }}"
                    fasen: "{{ fasen }}"
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.{{ {'a': 'chargersonia', 'b': 'chargerrob'}[x] }}_laatst_gezet"
                  data:
                    value: "{{ amps }}"
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.{{ {'a': 'chargersonia', 'b': 'chargerrob'}[x] }}_fasen"
                  data:
                    value: "{{ fasen }}"

  # -------------------------------------------------------------------
  # Noodrem: dreigende overbelasting -> binnen enkele seconden terugregelen
  # (niet wachten op de 30-secondencyclus van de regelaar).
  # Ruimte < 0 betekent: stroom op die fase boven hoofdzekering - marge.
  # Lader met laagste prioriteit wordt eerst verlaagd; onder 6 A -> pauze.
  # -------------------------------------------------------------------
  - id: ev_noodrem
    alias: "EV – noodrem bij overbelasting"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: numeric_state
        entity_id:
          - sensor.ev_ruimte_l1
          - sensor.ev_ruimte_l2
          - sensor.ev_ruimte_l3
        below: 0
        for: "00:00:03"
      # vangnet: blijft het tekort bestaan, dan elke 5 s opnieuw
      - trigger: time_pattern
        seconds: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.ev_slimme_sturing
        state: "on"
      - condition: template
        value_template: >
          {{ [states('sensor.ev_ruimte_l1') | int(0),
              states('sensor.ev_ruimte_l2') | int(0),
              states('sensor.ev_ruimte_l3') | int(0)] | min < 0 }}
    actions:
      - variables:
          nood: >
            {% set prio = states('input_select.ev_prioriteit') %}
            {# laagste prioriteit eerst verlagen #}
            {% set volgorde = ['a', 'b'] if prio == 'chargerrob' else ['b', 'a'] %}
            {% set ns = namespace(t1=[0 - states('sensor.ev_ruimte_l1') | int(0), 0] | max,
                                  t2=[0 - states('sensor.ev_ruimte_l2') | int(0), 0] | max,
                                  t3=[0 - states('sensor.ev_ruimte_l3') | int(0), 0] | max,
                                  a=-1, b=-1) %}
            {% for x in volgorde %}
              {% set laatst = states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_laatst_gezet') | int(-1) %}
              {% set drie = not is_state('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_auto', '1-fase')
                            and states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_fasen') | int(3) == 3 %}
              {% set een = states('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_eenfase_op') | lower %}
              {% if laatst > 0 %}
                {% if drie %}{% set tekort = [ns.t1, ns.t2, ns.t3] | max %}
                {% elif een == 'l2' %}{% set tekort = ns.t2 %}
                {% elif een == 'l3' %}{% set tekort = ns.t3 %}
                {% else %}{% set tekort = ns.t1 %}{% endif %}
                {% if tekort > 0 %}
                  {% set nieuw = laatst - tekort %}
                  {% if nieuw < 6 %}{% set nieuw = 0 %}{% endif %}
                  {% set minder = laatst - nieuw %}
                  {% if drie %}
                    {% set ns.t1 = [ns.t1 - minder, 0] | max %}
                    {% set ns.t2 = [ns.t2 - minder, 0] | max %}
                    {% set ns.t3 = [ns.t3 - minder, 0] | max %}
                  {% elif een == 'l2' %}{% set ns.t2 = [ns.t2 - minder, 0] | max %}
                  {% elif een == 'l3' %}{% set ns.t3 = [ns.t3 - minder, 0] | max %}
                  {% else %}{% set ns.t1 = [ns.t1 - minder, 0] | max %}{% endif %}
                  {% if x == 'a' %}{% set ns.a = nieuw %}{% else %}{% set ns.b = nieuw %}{% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ {'a': ns.a, 'b': ns.b} }}
      - repeat:
          for_each: ["a", "b"]
          sequence:
            - if:
                - condition: template
                  value_template: "{{ nood[repeat.item] | int(-1) >= 0 }}"
              then:
                - action: script.ev_zet_laadprofiel
                  data:
                    devid: "{{ {'a': 'chargersonia', 'b': 'chargerrob'}[repeat.item] }}"
                    amps: "{{ nood[repeat.item] | int }}"
                    fasen: "{{ states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[repeat.item] ~ '_fasen') | int(3) }}"
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.{{ {'a': 'chargersonia', 'b': 'chargerrob'}[repeat.item] }}_laatst_gezet"
                  data:
                    value: "{{ nood[repeat.item] | int }}"
                - action: logbook.log
                  data:
                    name: "EV noodrem"
                    message: >
                      Lader {{ repeat.item | upper }} teruggezet naar {{ nood[repeat.item] }} A
                      (ruimte L1/L2/L3: {{ states('sensor.ev_ruimte_l1') }}/{{ states('sensor.ev_ruimte_l2') }}/{{ states('sensor.ev_ruimte_l3') }} A)

  # -------------------------------------------------------------------
  # Autoherkenning: tijdens de detectie (3 x 10 A) vermogen meten
  # -------------------------------------------------------------------
  - id: ev_herken_auto
    alias: "EV – auto herkennen (1- of 3-fase)"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/15"
    conditions:
      - condition: state
        entity_id: input_boolean.ev_slimme_sturing
        state: "on"
    actions:
      - repeat:
          for_each: ["a", "b"]
          sequence:
            - variables:
                x: "{{ repeat.item }}"
                p: "{{ states('sensor.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[repeat.item] ~ '_power_active_import') | float(0) * 1000 }}"
                i: "{{ states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[repeat.item] ~ '_laatst_gezet') | int(0) }}"
            - if:
                - condition: template
                  value_template: >
                    {% set st = states.sensor[{'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_status_connector'] %}
                    {{ is_state('input_select.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_auto', 'Onbekend')
                       and st is not none and st.state == 'Charging'
                       and (now() - st.last_changed).total_seconds() > 60
                       and states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[x] ~ '_fasen') | int(3) == 3
                       and i >= 8 and p > 1000 }}
              then:
                - variables:
                    ratio: "{{ p / (230 * i) }}"
                - choose:
                    - conditions: "{{ ratio >= 2.0 }}"
                      sequence:
                        - action: input_select.select_option
                          target:
                            entity_id: "input_select.{{ {'a': 'chargersonia', 'b': 'chargerrob'}[x] }}_auto"
                          data:
                            option: "3-fase"
                    - conditions: "{{ ratio <= 1.3 }}"
                      sequence:
                        - action: input_select.select_option
                          target:
                            entity_id: "input_select.{{ {'a': 'chargersonia', 'b': 'chargerrob'}[x] }}_auto"
                          data:
                            option: "1-fase"

  # -------------------------------------------------------------------
  # In- en uitpluggen: herkenning resetten, boost uit
  # -------------------------------------------------------------------
  - id: ev_in_uitpluggen
    alias: "EV – in- en uitpluggen"
    mode: queued
    triggers:
      - trigger: state
        entity_id: sensor.chargersonia_status_connector
        from: "Available"
        not_to: ["Unavailable", "unavailable", "unknown", "Faulted"]
        id: a_in
      - trigger: state
        entity_id: sensor.chargerrob_status_connector
        from: "Available"
        not_to: ["Unavailable", "unavailable", "unknown", "Faulted"]
        id: b_in
      - trigger: state
        entity_id: sensor.chargersonia_status_connector
        to: "Available"
        id: a_uit
      - trigger: state
        entity_id: sensor.chargerrob_status_connector
        to: "Available"
        id: b_uit
    actions:
      - variables:
          x: "{{ trigger.id[0] }}"
          ingestoken: "{{ trigger.id.endswith('_in') }}"
      - action: input_select.select_option
        target:
          entity_id: "input_select.{{ {'a': 'chargersonia', 'b': 'chargerrob'}[x] }}_auto"
        data:
          option: "Onbekend"
      - action: input_number.set_value
        target:
          entity_id: "input_number.{{ {'a': 'chargersonia', 'b': 'chargerrob'}[x] }}_laatst_gezet"
        data:
          value: -1
      - if:
          - condition: template
            value_template: "{{ ingestoken }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: "input_datetime.{{ {'a': 'chargersonia', 'b': 'chargerrob'}[x] }}_ingeplugd"
            data:
              timestamp: "{{ now().timestamp() }}"
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: "input_boolean.{{ {'a': 'chargersonia', 'b': 'chargerrob'}[x] }}_direct_laden"
          - action: input_number.set_value
            target:
              entity_id: "input_number.{{ {'a': 'chargersonia', 'b': 'chargerrob'}[x] }}_fasen"
            data:
              value: 3

  # -------------------------------------------------------------------
  # Sturing uit: laders vrijgeven
  # -------------------------------------------------------------------
  - id: ev_sturing_uit_vrijgeven
    alias: "EV – sturing uit: laders vrijgeven"
    triggers:
      - trigger: state
        entity_id: input_boolean.ev_slimme_sturing
        to: "off"
    actions:
      - repeat:
          for_each: ["a", "b"]
          sequence:
            - action: script.ev_zet_laadprofiel
              data:
                devid: "{{ {'a': 'chargersonia', 'b': 'chargerrob'}[repeat.item] }}"
                amps: "{{ states('input_number.' ~ {'a': 'chargersonia', 'b': 'chargerrob'}[repeat.item] ~ '_max_stroom') | int(16) }}"
                fasen: 3
            - action: input_number.set_value
              target:
                entity_id: "input_number.{{ {'a': 'chargersonia', 'b': 'chargerrob'}[repeat.item] }}_laatst_gezet"
              data:
                value: -1