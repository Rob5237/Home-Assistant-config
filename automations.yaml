- id: warmtepomp_goedkoop_uur_opwarmen
  alias: "Warmtepomp: extra opwarmen bij goedkoopste uur"
  description: >
    Zet heating_target_correction tijdelijk op +0.5°C op het optimale
    stookkwartier. Het tijdswindow is groter bij koud weer (meer thermische
    opslag nodig) en kleiner bij mild weer. Formule: clamp(60min…180min,
    raw×2×30) waarbij raw = 1 + 2×(14−t)/24. Alleen actief als
    kamertemperatuur onder het Luxtronik setpoint ligt.
    Kwartierprecisie (14-10-2026, was uur-gebaseerd): Zonneplan varieert per
    15 min, niet per uur — de oude uur-matching liet de sensor zichzelf
    exact op het kritieke moment een uur laten doorschuiven (zie
    custom_templates/warmtepomp_macros.jinja), waardoor dit nooit afging.
    Trigger nu elke minuut, conditie matcht het volledige HH:MM.
    Zet input_boolean.warmtepomp_goedkoop_uur_boost_actief aan bij start en
    uit bij einde — mutex zodat warmtepomp_kamertemp_correctie niet
    tegelijkertijd aan dezelfde heating_target_correction zit te draaien.
  triggers:
    - trigger: time_pattern
      seconds: '0'
  conditions:
    - condition: template
      value_template: >
        {% set opt = states('sensor.warmtepomp_optimaal_startuur') %}
        {{ opt not in ('unknown', 'unavailable', 'onbekend')
           and opt | length >= 4
           and now().strftime('%H:%M') == opt }}
    - condition: not
      conditions:
        - condition: state
          entity_id: select.luxtronik_280807_0450_heating_mode
          state: "Off"
    - condition: state
      entity_id: input_boolean.vakantie_actief
      state: "off"
    - condition: template
      value_template: >
        {% set t_kamer = states('sensor.luxtronik_280807_0450_room_thermostat_temperature') | float(none) %}
        {% set t_setpoint = states('sensor.luxtronik_280807_0450_room_thermostat_temperature_target') | float(none) %}
        {{ t_kamer is not none and t_setpoint is not none and t_kamer < t_setpoint }}
  actions:
    - variables:
        t_buiten: >
          {{ states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(10) }}
        window_min: >
          {% set t = states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(10) %}
          {% set raw = 1 + 2 * (14 - t) / 24 %}
          {{ [[60, (raw * 2) | round | int * 30] | max, 180] | min }}
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.warmtepomp_goedkoop_uur_boost_actief
    - action: number.set_value
      target:
        entity_id: number.luxtronik_280807_0450_heating_target_correction
      data:
        value: 0.5
    - delay:
        minutes: "{{ window_min }}"
    - action: number.set_value
      target:
        entity_id: number.luxtronik_280807_0450_heating_target_correction
      data:
        value: 0
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.warmtepomp_goedkoop_uur_boost_actief
  mode: single

- id: warmtepomp_kamertemp_correctie
  alias: "Warmtepomp: zachte kamertemp-correctie"
  description: >
    Software-matige kamertemp-regelaar bovenop de open-loop stooklijn: de
    Luxtronik heeft geen "kamerinvloed"-parameter, dus zonder dit blijft de
    kamertemp structureel een beetje afwijken van het setpoint. Elke 15 min
    wordt heating_target_correction bijgesteld richting het setpoint, in
    stappen van 0.5°C (de kleinste stap die de entiteit toelaat) —
    correctie = round((setpoint − kamertemp) / 0.5) × 0.5, geclamped op
    ±2°C zodat een incidentele uitschieter niet tot een extreme correctie
    leidt. Schrijft alleen als de berekende waarde afwijkt van de huidige
    (voorkomt onnodige writes/logruis).
    Mutex met warmtepomp_goedkoop_uur_opwarmen via
    input_boolean.warmtepomp_goedkoop_uur_boost_actief — beide automaties
    sturen dezelfde heating_target_correction aan, dus deze slaat over
    zolang de goedkoop-uur-boost loopt (anders overschrijven ze elkaar).
  triggers:
    - trigger: time_pattern
      minutes: "/15"
  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: select.luxtronik_280807_0450_heating_mode
          state: "Off"
    - condition: state
      entity_id: input_boolean.vakantie_actief
      state: "off"
    - condition: state
      entity_id: input_boolean.warmtepomp_goedkoop_uur_boost_actief
      state: "off"
    - condition: template
      value_template: >
        {{ states('sensor.luxtronik_280807_0450_room_thermostat_temperature') | float(none) is not none
           and states('sensor.luxtronik_280807_0450_room_thermostat_temperature_target') | float(none) is not none }}
  actions:
    - variables:
        kamer: "{{ states('sensor.luxtronik_280807_0450_room_thermostat_temperature') | float }}"
        setpoint: "{{ states('sensor.luxtronik_280807_0450_room_thermostat_temperature_target') | float }}"
        huidig: "{{ states('number.luxtronik_280807_0450_heating_target_correction') | float(0) }}"
        nieuw: >
          {% set fout = setpoint - kamer %}
          {% set stappen = (fout / 0.5) | round(0, 'common') %}
          {{ [[-2.0, stappen * 0.5] | max, 2.0] | min }}
    - condition: template
      value_template: "{{ nieuw != huidig }}"
    - action: number.set_value
      target:
        entity_id: number.luxtronik_280807_0450_heating_target_correction
      data:
        value: "{{ nieuw }}"
  mode: single

- id: warmtepomp_correction_reset_op_start
  alias: "Warmtepomp: reset correction bij HA-start"
  description: >
    Bij HA-start: als heating_target_correction nog op een waarde ≠ 0 staat,
    reset naar 0. Voorkomt dat correctie blijft hangen wanneer HA herstart
    tijdens de delay-fase van warmtepomp_goedkoop_uur_opwarmen (mode: single).
  triggers:
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: >
        {{ states('number.luxtronik_280807_0450_heating_target_correction') | float(0) != 0 }}
  actions:
    # Wacht op Luxtronik-entiteiten die na HA-start nog niet altijd direct beschikbaar zijn.
    - delay:
        seconds: 30
    - action: number.set_value
      target:
        entity_id: number.luxtronik_280807_0450_heating_target_correction
      data:
        value: 0
  mode: single

- id: warmtepomp_pre17_buffer_start
  alias: "Warmtepomp: pre-17:00 vloerbuffer start"
  description: >
    Zet de kamerthermostaat-setpoint op het goedkoopste kwartier binnen het
    pre-17:00-venster (sensor.warmtepomp_optimaal_startuur_middag — venster
    schuift van 12:00-16:00 bij mild weer tot 09:00-16:00 bij kou) tijdelijk
    naar 21°C, zodat de
    vloer vóór de dure uren vanaf 17:00 thermisch wordt opgeladen. De
    oorspronkelijke setpoint gaat naar input_number.warmtepomp_kamertemp_backup
    (0 = geen backup actief) en wordt om 17:00 teruggezet door
    warmtepomp_pre17_buffer_einde. Losstaand van warmtepomp_goedkoop_uur_opwarmen
    (dagbrede +0.5°C correctie) — dit zet de setpoint zelf, niet de correctie.
    Kwartierprecisie (14-10-2026, was uur-gebaseerd): Zonneplan varieert per
    15 min. Trigger nu elke minuut i.p.v. alleen xx:01, conditie matcht het
    volledige HH:MM i.p.v. alleen het uur.
    Vooruitkijk-fix (14-10-2026): de sensor kijkt sinds kort ook naar morgen
    zodra het vandaag-venster al gesloten is (attribuut venster_dag: vandaag/
    morgen) — zonder onderstaande dag-check zou een "morgen"-tijdstip dat
    toevallig overeenkomt met de huidige kloktijd vandaag al verkeerd triggeren.
  triggers:
    - trigger: time_pattern
      seconds: '0'
  conditions:
    - condition: template
      value_template: >
        {% set opt = states('sensor.warmtepomp_optimaal_startuur_middag') %}
        {{ opt not in ('unknown', 'unavailable', 'onbekend')
           and opt | length >= 4
           and now().strftime('%H:%M') == opt
           and state_attr('sensor.warmtepomp_optimaal_startuur_middag', 'venster_dag') == 'vandaag' }}
    - condition: numeric_state
      entity_id: input_number.warmtepomp_kamertemp_backup
      below: 0.01
    - condition: not
      conditions:
        - condition: state
          entity_id: select.luxtronik_280807_0450_heating_mode
          state: "Off"
    - condition: state
      entity_id: input_boolean.vakantie_actief
      state: "off"
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.warmtepomp_kamertemp_backup
      data:
        value: "{{ state_attr('climate.luxtronik_280807_0450_heating', 'temperature') }}"
    - action: climate.set_temperature
      target:
        entity_id: climate.luxtronik_280807_0450_heating
      data:
        temperature: 21
  mode: single

- id: warmtepomp_pre17_buffer_einde
  alias: "Warmtepomp: pre-17:00 vloerbuffer einde"
  description: >
    Zet om 17:00 de kamerthermostaat-setpoint terug naar de waarde van vóór de
    boost (input_number.warmtepomp_kamertemp_backup), en reset de backup naar 0.
  triggers:
    - trigger: time
      at: "17:00:00"
  conditions:
    - condition: numeric_state
      entity_id: input_number.warmtepomp_kamertemp_backup
      above: 0.01
  actions:
    - action: climate.set_temperature
      target:
        entity_id: climate.luxtronik_280807_0450_heating
      data:
        temperature: "{{ states('input_number.warmtepomp_kamertemp_backup') | float }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.warmtepomp_kamertemp_backup
      data:
        value: 0
  mode: single

- id: warmtepomp_pre17_buffer_reset_bij_gemiste_trigger
  alias: "Warmtepomp: vloerbuffer reset bij gemiste 17:00-trigger"
  description: >
    Vangnet voor als HA rond 17:00 niet actief was (bv. herstart) waardoor
    warmtepomp_pre17_buffer_einde niet afging: bij HA-start buiten het
    12:00-17:00 venster, met een nog actieve backup, direct terugzetten i.p.v.
    tot de volgende dag op 21°C laten staan.
  triggers:
    - trigger: homeassistant
      event: start
  conditions:
    - condition: numeric_state
      entity_id: input_number.warmtepomp_kamertemp_backup
      above: 0.01
    - condition: template
      value_template: "{{ not (12 <= now().hour < 17) }}"
  actions:
    - delay:
        seconds: 30
    - action: climate.set_temperature
      target:
        entity_id: climate.luxtronik_280807_0450_heating
      data:
        temperature: "{{ states('input_number.warmtepomp_kamertemp_backup') | float }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.warmtepomp_kamertemp_backup
      data:
        value: 0
  mode: single

- id: warmtepomp_data_analyse_zinvol_signaal
  alias: "Warmtepomp: data-analyse vloerbuffer zinvol"
  description: >
    Notificatie als er genoeg koude-weer-geschiedenis gelogd is
    (binary_sensor.warmtepomp_data_analyse_zinvol) om de heuristische
    pre-17:00 buffer-formule (middag_start_uur in sensor.warmtepomp_optimaal_startuur_middag)
    te vervangen door een empirisch gefit model op basis van
    sensor.luxtronik_280807_0450_room_thermostat_temperature +
    sensor.luxtronik_280807_0450_outdoor_temperature historie. Vuurt eenmalig
    (lock warmtepomp_data_analyse_signaal_actief) — de onderliggende
    conditie is monotoon (koude_samples en laagste_buitentemp kunnen niet
    weer "verslechteren"), dus geen reset-automatie nodig.
  triggers:
    - trigger: state
      entity_id: binary_sensor.warmtepomp_data_analyse_zinvol
      from: "off"
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.warmtepomp_data_analyse_signaal_actief
      state: "off"
  actions:
    - action: persistent_notification.create
      data:
        title: "Warmtepomp: data-analyse vloerbuffer zinvol"
        message: >
          Er is nu genoeg koude-weer-geschiedenis gelogd
          ({{ state_attr('binary_sensor.warmtepomp_data_analyse_zinvol', 'koude_samples') }}
          samples <5°C, laagste gemeten buitentemp
          {{ state_attr('binary_sensor.warmtepomp_data_analyse_zinvol', 'laagste_buitentemp') }}°C)
          om de pre-17:00 vloerbuffer-formule te vervangen door een echt
          gekalibreerd model i.p.v. de huidige heuristiek. Vraag Claude Code
          om de analyse te doen op sensor.luxtronik_280807_0450_room_thermostat_temperature
          vs. sensor.luxtronik_280807_0450_outdoor_temperature historie.
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.warmtepomp_data_analyse_signaal_actief
  mode: single

- id: warmtepomp_pre17_buffer_verificatie
  alias: "Warmtepomp: eenmalige verificatie pre-17:00 vloerbuffer (13-10-2026)"
  description: >
    Eenmalige sanity-check voor de nieuwe pre-17:00 vloerbuffer-feature:
    stuurt een persistent notification + app-pushmelding op het moment dat
    de boost start (backup-helper 0→>0) en op het moment dat hij eindigt
    (backup-helper >0→0), met het verwachte uur
    (sensor.warmtepomp_optimaal_startuur_middag) vs. het werkelijke
    kloktijdstip en de echte climate-setpoint. Alleen actief op 2026-10-13
    (condition op datum) — na die dag kan deze automatie verwijderd worden,
    was puur een eenmalige verificatie.
  triggers:
    - id: start
      trigger: numeric_state
      entity_id: input_number.warmtepomp_kamertemp_backup
      above: 0.01
    - id: einde
      trigger: numeric_state
      entity_id: input_number.warmtepomp_kamertemp_backup
      below: 0.01
  conditions:
    - condition: template
      value_template: "{{ now().strftime('%Y-%m-%d') == '2026-10-13' }}"
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: start
          sequence:
            - action: persistent_notification.create
              data:
                title: "Vloerbuffer-check: start"
                message: >
                  Tijd: {{ now().strftime('%H:%M') }}.
                  Sensor voorspelde uur: {{ states('sensor.warmtepomp_optimaal_startuur_middag') }}.
                  Komt overeen met nu: {{ 'JA' if states('sensor.warmtepomp_optimaal_startuur_middag')[:2] | int(-1) == now().hour else 'NEE' }}.
                  Backup-setpoint weggeschreven: {{ states('input_number.warmtepomp_kamertemp_backup') }}°C.
                  Climate-setpoint nu: {{ state_attr('climate.luxtronik_280807_0450_heating', 'temperature') }}°C (verwacht 21°C).
            - action: notify.mobile_app_sm_g781b
              data:
                title: "Vloerbuffer-check: start"
                message: >-
                  {{ now().strftime('%H:%M') }} — voorspeld
                  {{ states('sensor.warmtepomp_optimaal_startuur_middag') }}
                  ({{ 'klopt' if states('sensor.warmtepomp_optimaal_startuur_middag')[:2] | int(-1) == now().hour else 'KLOPT NIET' }}).
                  Setpoint nu {{ state_attr('climate.luxtronik_280807_0450_heating', 'temperature') }}°C (verwacht 21°C).
                data:
                  tag: vloerbuffer_check_start
                  channel: "Warmtepomp verificatie"
        - conditions:
            - condition: trigger
              id: einde
          sequence:
            - action: persistent_notification.create
              data:
                title: "Vloerbuffer-check: einde"
                message: >
                  Tijd: {{ now().strftime('%H:%M') }}.
                  Backup-waarde die teruggezet is: {{ trigger.from_state.state }}°C.
                  Climate-setpoint nu: {{ state_attr('climate.luxtronik_280807_0450_heating', 'temperature') }}°C
                  (verwacht gelijk aan de teruggezette backup-waarde).
            - action: notify.mobile_app_sm_g781b
              data:
                title: "Vloerbuffer-check: einde"
                message: >-
                  {{ now().strftime('%H:%M') }} — teruggezet naar
                  {{ trigger.from_state.state }}°C, setpoint nu
                  {{ state_attr('climate.luxtronik_280807_0450_heating', 'temperature') }}°C.
                data:
                  tag: vloerbuffer_check_einde
                  channel: "Warmtepomp verificatie"
  mode: queued

- id: warmtepomp_kamertemp_check_ochtend_14okt
  alias: "Warmtepomp: eenmalige check kamertemp ochtend (14-10-2026)"
  description: >
    Eenmalige check na de structurele drempelverhoging
    (heating_threshold_temperature 14→18°C) en de geforceerde stookcyclus
    van 13-10-2026: stuurt om 08:00 een persistent notification + app-
    pushmelding met kamertemp, setpoint en buitentemp, zodat er een
    referentiepunt is voor hoe de nacht is verlopen met de nieuwe drempel.
    Alleen actief op 2026-10-14 (condition op datum) — kan daarna verwijderd
    worden, was puur een eenmalige check.
  triggers:
    - trigger: time
      at: "08:00:00"
  conditions:
    - condition: template
      value_template: "{{ now().strftime('%Y-%m-%d') == '2026-10-14' }}"
  actions:
    - action: persistent_notification.create
      data:
        title: "Kamertemp-check ochtend"
        message: >
          Kamertemp: {{ states('sensor.luxtronik_280807_0450_room_thermostat_temperature') }}°C.
          Setpoint: {{ states('sensor.luxtronik_280807_0450_room_thermostat_temperature_target') }}°C.
          Buitentemp: {{ states('sensor.luxtronik_280807_0450_outdoor_temperature') }}°C.
          Drempel (heating_threshold_temperature): {{ states('number.luxtronik_280807_0450_heating_threshold_temperature') }}°C.
    - action: notify.mobile_app_sm_g781b
      data:
        title: "Kamertemp-check ochtend"
        message: >-
          Kamer {{ states('sensor.luxtronik_280807_0450_room_thermostat_temperature') }}°C
          (setpoint {{ states('sensor.luxtronik_280807_0450_room_thermostat_temperature_target') }}°C),
          buiten {{ states('sensor.luxtronik_280807_0450_outdoor_temperature') }}°C.
        data:
          tag: kamertemp_check_ochtend
          channel: "Warmtepomp verificatie"
  mode: single

- id: waarschuwing_bij_herinstallatie
  alias: "Systeem: waarschuwing bij herinstallatie"
  triggers:
  - trigger: event
    event_type: home_assistant_start
  actions:
  - action: persistent_notification.create
    data:
      title: Let op!
      message: 'Je staat op het punt Home Assistant te herstarten of te herinstalleren.
        De map /share kan worden overschreven, met submappen /Documenten, /Afbeeldingen
        en /Downloads. Maak eerst een back-up!

        '
  mode: single
- id: tapwater_zonne_overschot_klein
  alias: "Tapwater: opwarmen bij klein zonne-overschot"
  description: >
    Verwarm boiler met WP bij teruglevering >= 2000W EN voldoende zon-forecast
    voor het komende uur (>= 2.0 kWh, som van alle 3 dakgedeeltes via
    forecast_solar) EN actuele Enphase-productie >= 1500W. De forecast is
    een uurgemiddelde dat een wolkenfront aan het begin van het uur niet
    direct registreert; de realtime Enphase-check is een tweede guard die
    voorkomt dat een cyclus start vlak nadat de zon plots wegvalt en daarna
    uit het net gaat trekken tot DHW > 57.
    Setpoint 57°C + dhw_mode Automatic: Luxtronik 10K-hysterese voorkomt korte
    pendel-cycli vanzelf. Lagere aanvoer (richting 57 i.p.v. 62) levert
    ~10-15% betere COP over de cyclus dan een Party-cyclus naar 62.
    DHW-drempel 52°C (was 47): analyse 2 weken toonde ~41 kWh/dag netto
    teruglevering en slechts 4-5 kWh DHW-verbruik. Cyclusstarts bij DHW 43-46
    (bijverwarm-noodgeval) betekenden 14K delta-T = lange cyclus in koude
    tank = COP 2.3-2.7. Met drempel 52 vangt de klein-overschot cyclus
    warmteverlies eerder op (delta-T 5-10K), betere gem. COP en groter
    noodbuffer. Verwacht ~1 extra cyclus/dag; blijft ruim onder pendel-drempel
    (hysterese 10K = min. delta 10K tussen starts).
    Reset loopt via tapwater_reset_na_bijverwarmen (DHW>57 voor 1 min, alleen
    bij solar>-1500 — bij blijvend overschot blijft setpoint 57 staan).
    Escalatie naar 62°C verloopt via tapwater_extra_opslag_groot_overschot
    (P1<-4000W voor 10 min, conditie setpoint 55-60 — past nu).
  triggers:
  - entity_id:
    - sensor.p1_meter_power
    below: -2000
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: numeric_state
  conditions:
  - condition: numeric_state
    entity_id: sensor.luxtronik_280807_0450_dhw_temperature
    below: 52
  - condition: state
    entity_id: binary_sensor.zon_forecast_volgend_uur_voldoende
    state: "on"
  - condition: numeric_state
    entity_id: sensor.envoy_122331077486_current_power_production
    above: 1500
  # Niet klein-overschot draaien als groot-overschot net Party heeft gezet:
  # anders zou setpoint 62→57 en mode Party→Automatic worden overschreven,
  # wat de zonne_overschot_extra_opslag_reset (DHW>58 + mode=Party) breekt.
  - condition: not
    conditions:
    - condition: state
      entity_id: select.luxtronik_280807_0450_dhw_mode
      state: Party
  actions:
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_target_temperature
    data:
      value: 57
    action: number.set_value
  - target:
      entity_id: select.luxtronik_280807_0450_dhw_mode
    data:
      option: Automatic
    action: select.select_option
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.tapwater_overschot_lock
  mode: single
- id: tapwater_extra_opslag_groot_overschot
  alias: "Tapwater: extra opslag bij groot zonne-overschot"
  description: >
    Bij groot teruglevering (P1 < -4000W voor 10 min) en boiler al in
    zonne-overschot boost-modus (setpoint 55-60°C), verhoog setpoint naar
    62°C voor extra opslag. Dhw_hysteresis tijdelijk 10K → 3K zodat de
    compressor daadwerkelijk start (bevestigd 23-09-2026: Party alléén
    negeert de hysterese NIET op deze firmware — bij DHW ≥ 52 bleef de WP
    9u stil ondanks Party+62). Setpoint 62 - 3K = 59 dekt DHW-niveaus die
    klein-overschot achterlaat (~55-58). DHW-mode Party overrulet het
    tijdschema en interne Sperrzeit; hysterese-verlaging overrulet de
    start-drempel. Reset volgt via zonne_overschot_extra_opslag_reset bij
    DHW > 58°C (zet setpoint→50, mode→Automatic/Holidays, hysterese→10K).
    Veiligheidsreset (interne delay 45 min): als de reguliere reset niet is
    geactiveerd binnen 45 min (bv. omdat user via display dhw_mode handmatig
    heeft gewijzigd zodat de Party-conditie in de reset-automation faalt),
    forceer dan alsnog setpoint→50 + mode→Automatic. Voorkomt achtergebleven
    setpoint 62°C waardoor bij volgend waterverbruik een ongewenste 62°C-
    oplaadcyclus zou starten. 45 min (was 90) volstaat voor een normale
    boost-cyclus naar 62°C (typisch 30-40 min vanaf DHW ~52); een kortere
    safety verkleint het pendel-venster waarin een onverwacht waterverbruik
    de WP opnieuw naar 62 zou laten lopen. Mode: single blokkeert in deze 45
    min nieuwe boost-starts, wat acceptabel is (geen dubbele boost gewenst).
  triggers:
  - entity_id: sensor.p1_meter_power
    below: -4000
    for:
      minutes: 10
    trigger: numeric_state
  conditions:
  - condition: numeric_state
    entity_id: number.luxtronik_280807_0450_dhw_target_temperature
    above: 55
    below: 60
  - condition: numeric_state
    entity_id: sensor.luxtronik_280807_0450_dhw_temperature
    below: 61
  - condition: state
    entity_id: binary_sensor.zon_forecast_volgend_uur_voldoende
    state: "on"
  actions:
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_hysteresis
    data:
      value: 3
    action: number.set_value
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_target_temperature
    data:
      value: 62
    action: number.set_value
  - target:
      entity_id: select.luxtronik_280807_0450_dhw_mode
    data:
      option: Party
    action: select.select_option
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.tapwater_overschot_lock
  - delay:
      minutes: 45
  # Veiligheidsreset: setpoint nog steeds > 55 betekent reguliere reset
  # is niet geactiveerd (bv. user heeft Party-mode handmatig gewijzigd).
  - if:
    - condition: numeric_state
      entity_id: number.luxtronik_280807_0450_dhw_target_temperature
      above: 55
    then:
    - target:
        entity_id: number.luxtronik_280807_0450_dhw_target_temperature
      data:
        value: 50
      action: number.set_value
    - target:
        entity_id: number.luxtronik_280807_0450_dhw_hysteresis
      data:
        value: 10
      action: number.set_value
    - if:
      - condition: state
        entity_id: select.luxtronik_280807_0450_dhw_mode
        state: Party
      then:
      - target:
          entity_id: select.luxtronik_280807_0450_dhw_mode
        data:
          option: >-
            {% if is_state('input_boolean.vakantie_actief', 'on')
                  and is_state('input_boolean.tapwater_overschot_lock', 'on') %}Holidays{% else %}Automatic{% endif %}
        action: select.select_option
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.tapwater_overschot_lock
    - action: persistent_notification.create
      data:
        title: "Zonne-overschot boost: veiligheidsreset"
        notification_id: extra_opslag_safety_reset
        message: >-
          Reguliere reset op DHW>58°C is niet geactiveerd binnen 45 min na
          start van groot-overschot boost. Setpoint geforceerd naar 50°C.
          DHW {{ states('sensor.luxtronik_280807_0450_dhw_temperature') }}°C |
          Mode {{ states('select.luxtronik_280807_0450_dhw_mode') }}.
  mode: single
- id: tdi_legionella_solar_overschot
  alias: "TDI: legionella-cyclus bij laagste daguur"
  description: >
    Elk kwartier overdag (09:00-16:00) wordt gecheckt of dit het goedkoopste
    resterende kwartier is op basis van Zonneplan kwartier-tarieven.
    Klokprogramma 09:30-16:00 (buiten >= 15°C) of 12:00-16:00 (buiten < 15°C).
    Kwartierprecisie (14-10-2026, was elk heel uur): trigger nu elk kwartier
    i.p.v. alleen xx:00.

    dhw_mode wordt op Party gezet én dhw_hysteresis tijdelijk 10K → 3K:
    Party overrulet het tijdschema, hysterese-verlaging overrulet de
    start-drempel. Bevestigd 23-09-2026: Party respecteert wél 10K-hysterese
    op deze firmware — TDI met setpoint 62 en DHW=56 startte niet omdat
    62-10=52 nooit werd geraakt, compressor bleef 9u stil. Met hysterese 3K
    start de cyclus zodra DHW < 62 (65-3), wat het volledige klein-overschot-
    bereik (~55-58) dekt. Reset via tdi_einde_reset (setpoint→50, hysterese→10K).

    Setpoint 65 i.p.v. 62 (compressor-maximum): 25-09-2026 test toonde dat
    de WP stopt zodra zijn interne top-sensor het setpoint raakt — bij
    setpoint 62 stopte de compressor met mid-sensor op 59.0°C (top vermoedelijk
    62). Met setpoint 65 loopt de compressor door tot top ≈ 65, wat door
    stratificatie mid richting 60+ trekt. tdi_einde_reset wacht op mid ≥ 60
    voor 15 min als Legionella-borging voor de midden-tanklaag. Discriminator
    tegen extra-opslag (setpoint 62): zonne_overschot_extra_opslag_reset
    negeert nu setpoint > 63.

    Startguard DHW ≥ 60: bij DHW al ≥ 60 is Legionella-drempel voor mid
    vermoedelijk gehaald; sla de cyclus over. tdi_laatste_start-update slaan
    we óók over zodat de check volgende dag opnieuw activeert wanneer nodig.
  triggers:
  - trigger: time_pattern
    minutes: '/15'
  conditions:
  - condition: time
    after: '09:00:00'
    before: '16:00:00'
  - condition: template
    value_template: >
      {% set last = states('input_datetime.tdi_laatste_start') %}
      {{ last in ('unknown', 'unavailable') or (now().date() - as_datetime(last).date()).days >= 7 }}
  - condition: state
    entity_id: binary_sensor.goedkoopste_tdi_uur_nu
    state: "on"
  - condition: numeric_state
    entity_id: sensor.luxtronik_280807_0450_dhw_temperature
    below: 60
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.tdi_laatste_start
    data:
      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  # Schakel Luxtronik's interne wekelijkse TDI-scheduler uit. HA stuurt de
  # TDI-cyclus zelf aan via dhw_target=62°C; we willen voorkomen dat de pomp
  # autonoom om 00:00 op de geconfigureerde dag óók nog een TDI start.
  - target:
      entity_id: select.luxtronik_280807_0450_thermal_desinfection_day
    data:
      option: 'None'
    action: select.select_option
  - target:
      entity_id: select.luxtronik_280807_0450_dhw_mode
    data:
      option: Party
    action: select.select_option
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_hysteresis
    data:
      value: 3
    action: number.set_value
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_target_temperature
    data:
      value: 65
    action: number.set_value
  - if:
    - condition: state
      entity_id: input_boolean.vakantie_actief
      state: "off"
    then:
    - target:
        entity_id: switch.luxtronik_280807_0450_heating
      action: switch.turn_on
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.tapwater_overschot_lock
  mode: single

- id: tapwater_negatieve_prijs_opwarmen
  alias: "Tapwater: opwarmen bij negatieve stroomprijs"
  description: >
    Elk kwartier wordt gecheckt of het huidige Zonneplan-kwartiertarief onder
    -2 ct/kWh ligt (je krijgt dan betaald om stroom te verbruiken). Zo ja en
    DHW < 60°C → setpoint 65°C + hysterese 10K→3K + Party, zelfde combinatie
    als TDI. Setpoint bewust 65°C (niet een eigen waarde): hergebruikt
    daardoor automatisch de bestaande tdi_einde_reset (die op setpoint > 63
    reageert, ongeacht welke automatie 'm zette) — geen aparte reset-automatie
    nodig. Blijft actief tijdens vakantie, net als de andere opportunistische-
    energie-automaties (zonne-overschot, extra opslag) — negatieve prijs is
    net zo goed "gratis energie" als PV-overschot.
    Startguard DHW < 60 (i.p.v. 58 zoals extra-opslag): voorkomt onnodig
    herstarten vlak voordat tdi_einde_reset toch al zou resetten.
  triggers:
    - trigger: time_pattern
      minutes: "/15"
  conditions:
    - condition: numeric_state
      entity_id: sensor.zonneplan_current_quarter_hourly_electricity_tariff
      below: -0.02
    - condition: numeric_state
      entity_id: sensor.luxtronik_280807_0450_dhw_temperature
      below: 60
  actions:
    - target:
        entity_id: number.luxtronik_280807_0450_dhw_hysteresis
      data:
        value: 3
      action: number.set_value
    - target:
        entity_id: number.luxtronik_280807_0450_dhw_target_temperature
      data:
        value: 65
      action: number.set_value
    - target:
        entity_id: select.luxtronik_280807_0450_dhw_mode
      data:
        option: Party
      action: select.select_option
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.tapwater_overschot_lock
  mode: single

- id: tdi_einde_reset
  alias: "TDI: reset na cyclus"
  description: >
    Reset na TDI-cyclus: setpoint terug naar 50°C zodra DHW ≥ 60°C voor 15 min.
    De "voor 15 min" eis borgt Legionella-protocol óók voor de mid-tank sensor:
    de WP-interne top-sensor stopt bij setpoint (top hits 65°C snel), maar de
    HA-exposed mid-sensor loopt achter door stratificatie. Wachten tot mid ≥ 60
    voor 15 min zorgt dat óók mid en (via warmtegeleiding) een groot deel van
    onder de Legionella-drempel halen. Vervangt de vorige "> 61 voor 10 min"-
    aanpak die bij setpoint 62 nooit haalbaar was (mid piekte op 59).
    Discriminator setpoint > 63: onderscheidt TDI (setpoint 65) van extra-
    opslag (setpoint 62); die laatste heeft zijn eigen reset op DHW>58.
    Setpoint 62 vs 65 is bewust: TDI mikt op de compressor-max (65°C) om óók
    mid/onder te bereiken; extra-opslag blijft 62°C omdat het slechts een
    energiebuffer is (top mag hoog, mid/onder hoeft niet legionella-safe).
    Verwarmingsswitch alleen uit als buitentemp ≥ stookdrempel — anders zou
    ruimteverwarming bij koud weer ten onrechte uitgaan na TDI.
    Actie zet dhw_mode altijd terug naar Automatic (idempotent als al
    Automatic).
  triggers:
  - id: tdi_klaar
    entity_id: sensor.luxtronik_280807_0450_dhw_temperature
    above: 60
    for:
      minutes: 15
    trigger: numeric_state
  conditions:
  - condition: numeric_state
    entity_id: number.luxtronik_280807_0450_dhw_target_temperature
    above: 63
  actions:
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_target_temperature
    data:
      value: 50
    action: number.set_value
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_hysteresis
    data:
      value: 10
    action: number.set_value
  # Dhw_mode terug: Holidays als vakantie + lock=on, anders Automatic. Single
  # write i.p.v. eerst Automatic dan eventueel Holidays.
  - target:
      entity_id: select.luxtronik_280807_0450_dhw_mode
    data:
      option: >-
        {% if is_state('input_boolean.vakantie_actief', 'on')
              and is_state('input_boolean.tapwater_overschot_lock', 'on') %}Holidays{% else %}Automatic{% endif %}
    action: select.select_option
  - if:
    - condition: state
      entity_id: input_boolean.vakantie_actief
      state: "off"
    - condition: template
      value_template: >
        {% set t_buiten = states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(none) %}
        {% set t_drempel = states('number.luxtronik_280807_0450_heating_threshold_temperature') | float(14) %}
        {{ t_buiten is not none and t_buiten >= t_drempel }}
    then:
    - target:
        entity_id: switch.luxtronik_280807_0450_heating
      action: switch.turn_off
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.tapwater_overschot_lock
  mode: single
- id: zonne_overschot_extra_opslag_reset
  alias: "Tapwater: reset na extra opslag groot overschot"
  description: >
    Reset zonne-overschot extra opslag (setpoint 62°C, Party-mode): DHW-mode
    terug naar Automatic en setpoint naar 50°C zodra DHW > 58°C. Drempel lager
    dan TDI-reset (60°C) omdat WP bij hoge DHW-temperaturen kan stagneren
    voordat 60°C bereikt wordt; setpoint 62 was alleen bedoeld om hysterese
    te overrulen, niet als hard streefgetal.
    Avond-watchdog (21:55): de DHW>58-trigger is een transitie-trigger en
    vereist een stijgende flank. Als DHW bij start van Party+62 al ≥58 is
    (bv. door eerdere zonne-boost, of een TDI-cyclus die niet doorstookt
    omdat de tank al warm was), activeert de trigger nooit en blijft Party+62
    hangen tot de tank ver genoeg is afgekoeld — soms >12u later, buiten
    het bedoelde venster. De watchdog vangt dit op vlak vóór het nachtuur-
    venster (22:00) zodat de nacht met schone setpoint 50/Automatic begint.
    Tijd 21:55 i.p.v. 22:00 om race met `tapwater_goedkoopste_nachtuur`
    (time_pattern minutes:'0') te vermijden — analoog aan
    `tapwater_reset_na_bijverwarmen`. Lock=on borgt dat we alleen een echte
    hangende cyclus resetten en niet een user-gezette Party (dan is de lock
    door `tapwater_overschot_user_intervention` al uit).
  triggers:
  - id: dhw_boven_58
    entity_id: sensor.luxtronik_280807_0450_dhw_temperature
    above: 58
    trigger: numeric_state
  - id: avond_watchdog
    trigger: time
    at: "21:55:00"
  conditions:
  - condition: state
    entity_id: select.luxtronik_280807_0450_dhw_mode
    state: Party
  # DHW>58-tak: alleen voor extra-opslag range (setpoint 56-63). TDI-setpoint
  # 65 mag NIET via deze route resetten — die moet doorstoken tot mid ≥ 60
  # voor 15 min (tdi_einde_reset).
  # 21:55 watchdog: catch-all voor ELKE hangende Party (setpoint > 55) —
  # dus ook een TDI die de mid-drempel niet haalde. In dat geval fire
  # tdi_einde_reset niet (voorwaarde niet vervuld) en deze watchdog vangt op.
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id: dhw_boven_58
      - condition: numeric_state
        entity_id: number.luxtronik_280807_0450_dhw_target_temperature
        above: 55
        below: 64
    - condition: and
      conditions:
      - condition: trigger
        id: avond_watchdog
      - condition: state
        entity_id: input_boolean.tapwater_overschot_lock
        state: "on"
      - condition: numeric_state
        entity_id: number.luxtronik_280807_0450_dhw_target_temperature
        above: 55
  actions:
  - target:
      entity_id: select.luxtronik_280807_0450_dhw_mode
    data:
      option: >-
        {% if is_state('input_boolean.vakantie_actief', 'on')
              and is_state('input_boolean.tapwater_overschot_lock', 'on') %}Holidays{% else %}Automatic{% endif %}
    action: select.select_option
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_target_temperature
    data:
      value: 50
    action: number.set_value
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_hysteresis
    data:
      value: 10
    action: number.set_value
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.tapwater_overschot_lock
  mode: single
- id: tapwater_bijverwarmen
  alias: "Tapwater: bijverwarmen bij lage temperatuur"
  description: >
    Verwarm tapwater naar 57°C als het onder 46°C zakt. Blokkeert bij hoog tarief
    (> drempel in input_number.tapwater_tarief_drempel), tenzij noodgeval (< 41°C).
    Drempel 46°C (was 43): 3°C hogere drempel geeft grotere douche-buffer
    (~50L trekking = ~5-6°C drop; van 46 kom je op 40, van 43 op 37 = koud).
    Impact op solar-benutting minimaal — bijverwarmen activeert alleen als het
    tarief laag is (bij overschot ligt tarief typisch laag), en klein-overschot
    (nu drempel 52) vangt de meeste warmteverlies al eerder op. Emergency
    <41°C ongewijzigd.
  triggers:
  - entity_id: sensor.luxtronik_280807_0450_dhw_temperature
    below: 46
    for:
      minutes: 5
    trigger: numeric_state
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.luxtronik_280807_0450_dhw_temperature
      below: 41
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.vakantie_actief
        state: "off"
      - condition: template
        value_template: >
          {% set tarief = states('sensor.zonneplan_current_electricity_tariff') | float(0.30) %}
          {% set drempel = states('input_number.tapwater_tarief_drempel') | float(0.25) %}
          {{ tarief <= drempel }}
  actions:
  - target:
      entity_id: select.luxtronik_280807_0450_dhw_mode
    data:
      option: Automatic
    action: select.select_option
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_target_temperature
    data:
      value: 57
    action: number.set_value
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.tapwater_overschot_lock
  mode: single

- id: tapwater_reset_na_bijverwarmen
  alias: "Tapwater: reset na bijverwarmen"
  description: >
    Zet setpoint terug naar 50°C zodra tapwater 57°C bereikt (setpoint bereikt).
    Niet tijdens TDI (setpoint 62°C) en niet bij actief zonne-overschot (dan
    blijven doorladen). 50°C als rust-setpoint voorkomt dat de Luxtronik autonoom
    cycli draait onder 40°C (50 - 10K hysterese).
    Sneller-detectie via for: 1 min (was 2 min) verlaagt de kans dat een korte
    overshoot-piek gemist wordt; drempel 57 blijft bewust staan zodat de trigger
    alleen na bereiken setpoint activeert (lager zou cyclus halverwege afbreken).
    Avond-watchdog (21:55): de DHW>57-trigger is een transitie-trigger en kan
    gemist worden als P1<-1500 op moment van stijging (conditie faalt, daarna
    activeert de trigger niet meer). Een tweede kans vlak vóór het nachtvenster
    reset alsnog wanneer lock=on en setpoint nog 50-60.
    Dag-watchdog (13:55) doet hetzelfde vlak vóór het TDI-venster (start typisch
    14:00 of later op het goedkoopste uur). Extra guard `DHW > 56`: de
    dag-watchdog mag een actief lopende ochtend-cyclus niet afbreken
    (avond is dat geen risico — om 21:55 zijn alle cycli normaal lang
    afgerond).
    Tijd is bewust 21:55 i.p.v. 22:00 om race-condition met
    `tapwater_goedkoopste_nachtuur` te vermijden: die triggert op
    `time_pattern minutes:'0'` en zou óók om 22:00:00 geactiveerd kunnen worden als 22 het
    goedkoopste uur in het 22-06 venster is. HA garandeert geen volgorde
    tussen twee time-triggers op exact hetzelfde tijdstip — bij watchdog-na-
    nachtuur uitvoering zou setpoint 57 (net gezet door nachtuur) direct
    teruggezet worden naar 50 en de geplande nachtopwarming volledig missen.
    21:55 garandeert een schone uitgangstoestand (setpoint 50, lock off) als
    het nachtvenster om 22:00:00 opengaat. 13:55 ligt analoog vóór het TDI-uur.
  triggers:
  - id: dhw_boven_57
    entity_id: sensor.luxtronik_280807_0450_dhw_temperature
    above: 57
    for:
      minutes: 1
    trigger: numeric_state
  - id: avond_watchdog
    trigger: time
    at: "21:55:00"
  - id: dag_watchdog
    trigger: time
    at: "13:55:00"
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: dhw_boven_57
    - condition: and
      conditions:
      - condition: trigger
        id: avond_watchdog
      - condition: state
        entity_id: input_boolean.tapwater_overschot_lock
        state: "on"
    - condition: and
      conditions:
      - condition: trigger
        id: dag_watchdog
      - condition: state
        entity_id: input_boolean.tapwater_overschot_lock
        state: "on"
      - condition: numeric_state
        entity_id: sensor.luxtronik_280807_0450_dhw_temperature
        above: 56
  - condition: template
    value_template: >
      {% set setpoint = state_attr('water_heater.luxtronik_280807_0450_domestic_water',
        'temperature') | float(0) %}
      {% set solar = states('sensor.p1_meter_power') | float(0) %}
      {{ 50 < setpoint < 60 and solar > -1500 }}
  actions:
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_target_temperature
    data:
      value: 50
    action: number.set_value
  - if:
    - condition: state
      entity_id: input_boolean.vakantie_actief
      state: "on"
    - condition: state
      entity_id: input_boolean.tapwater_overschot_lock
      state: "on"
    then:
    - target:
        entity_id: select.luxtronik_280807_0450_dhw_mode
      data:
        option: Holidays
      action: select.select_option
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.tapwater_overschot_lock
  mode: single

- id: tapwater_goedkoopste_nachtuur
  alias: "Tapwater: opwarmen in goedkoopste nachtuur"
  description: >
    Elk kwartier tussen 22:00 en 06:00 wordt gecheckt of dit het goedkoopste
    kwartier in het nachtvenster is (Zonneplan kwartier-forecast). Als ja en
    tapwater < 54°C → opwarmen naar 57°C. Reset volgt via
    tapwater_reset_na_bijverwarmen.
    Kwartierprecisie (14-10-2026, was elk heel uur): trigger nu elk kwartier
    i.p.v. alleen xx:00, zodat het goedkoopste kwartier (niet per se op het
    hele uur) ook daadwerkelijk gecheckt wordt.
  triggers:
  - trigger: time_pattern
    minutes: '/15'
  conditions:
  - condition: state
    entity_id: input_boolean.vakantie_actief
    state: "off"
  - condition: numeric_state
    entity_id: sensor.luxtronik_280807_0450_dhw_temperature
    below: 54
  - condition: state
    entity_id: binary_sensor.goedkoopste_nachtuur_nu
    state: "on"
  actions:
  - target:
      entity_id: select.luxtronik_280807_0450_dhw_mode
    data:
      option: Automatic
    action: select.select_option
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_target_temperature
    data:
      value: 57
    action: number.set_value
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.tapwater_overschot_lock
  mode: single

- id: tapwater_overschot_user_intervention
  alias: "Tapwater: lock uitzetten bij handmatige dhw_mode wijziging"
  description: >
    Detecteert handmatige dhw_mode-wijzigingen tijdens een actieve
    opwarm-cyclus (HA UI of Luxtronik-display/RBE). Wanneer de user
    overneemt, wordt de lock uitgezet zodat de bijbehorende reset-
    automation dhw_mode NIET terugzet naar Holidays — de user-intent
    wint.

    Context-detectie:
    • UI-actie → context.user_id is gevuld
    • Luxtronik RBE/integration push → context.parent_id is None
    • Onze eigen automation-actie → context.parent_id is gevuld én
      user_id is None → condition matched niet → lock blijft staan
  triggers:
    - trigger: state
      entity_id: select.luxtronik_280807_0450_dhw_mode
  conditions:
    - condition: state
      entity_id: input_boolean.tapwater_overschot_lock
      state: "on"
    - condition: template
      value_template: >
        {{ trigger.to_state.context.user_id is not none
           or trigger.to_state.context.parent_id is none }}
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.tapwater_overschot_lock
  mode: single

- id: vakantie_sync_aan
  alias: "Vakantie: synchroniseer aan"
  description: >
    Activeert input_boolean.vakantie_actief zodra dhw_mode of heating_mode op
    Holidays wordt gezet (Luxtronik-display), of zodra de boolean handmatig
    in HA wordt aangezet.

    Heating gaat NIET op Holidays — die mode hanteert intern een zeer lage
    curve waardoor kamertemp bij koud weer onder 10°C kan zakken. In plaats
    daarvan blijft heating_mode op Automatic en wordt
    heating_curve_parallel_shift_temperature tijdelijk verlaagd naar 15.0°C
    (vakantie-stooklijn). De oorspronkelijke waarde staat in
    input_number.vakantie_parallel_shift_backup (0 = geen backup actief; de
    Luxtronik-range is 5-35°C dus 0 is een veilige sentinel-waarde).

    Circuit-keuze: alleen heating_curve_parallel_shift_temperature wordt
    aangepast (= hoofd-verwarmingscircuit). De circuit1/2/3-shifts blijven
    onaangeroerd omdat de gemengde circuits niet actief gebruikt worden in
    deze installatie (flow_in_circuit1/2/3_target_temperature = 0.0 — de
    Luxtronik regelt enkel het hoofdcircuit). Mocht in de toekomst een
    mixed-circuit aangezet worden, dan ook
    heating_curve_circuit1_parallel_shift_temperature meeschalen.

    Heating_mode wordt teruggezet naar Automatic als die op Holidays stond
    (Luxtronik-display gebruiker). Dhw_mode gaat wel naar Holidays (respecteert
    "Off"). Idempotent: backup wordt alleen gemaakt als die nog 0 is, dus
    herhaalde sync_aan-runs overschrijven de backup niet.
  triggers:
    - trigger: state
      entity_id: select.luxtronik_280807_0450_dhw_mode
      to: Holidays
    - trigger: state
      entity_id: select.luxtronik_280807_0450_heating_mode
      to: Holidays
    - trigger: state
      entity_id: input_boolean.vakantie_actief
      to: "on"
  actions:
    - if:
      - condition: not
        conditions:
        - condition: state
          entity_id: select.luxtronik_280807_0450_dhw_mode
          state: "Off"
      then:
      - action: select.select_option
        target:
          entity_id: select.luxtronik_280807_0450_dhw_mode
        data:
          option: Holidays
    - if:
      - condition: state
        entity_id: select.luxtronik_280807_0450_heating_mode
        state: Holidays
      then:
      - action: select.select_option
        target:
          entity_id: select.luxtronik_280807_0450_heating_mode
        data:
          option: Automatic
    - if:
      - condition: numeric_state
        entity_id: input_number.vakantie_parallel_shift_backup
        below: 0.1
      then:
      - action: input_number.set_value
        target:
          entity_id: input_number.vakantie_parallel_shift_backup
        data:
          value: "{{ states('number.luxtronik_280807_0450_heating_curve_parallel_shift_temperature') | float(17) }}"
      - action: number.set_value
        target:
          entity_id: number.luxtronik_280807_0450_heating_curve_parallel_shift_temperature
        data:
          value: 15.0
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.vakantie_actief
  mode: single

- id: vakantie_sync_uit
  alias: "Vakantie: synchroniseer uit"
  description: >
    Deactiveert vakantie zodra input_boolean wordt uitgezet (HA UI).

    NB1: dhw_mode-overgangen worden NIET als trigger gebruikt — die wijzigt
    kortstondig naar Automatic tijdens zonne-overschot cycli en zou anders
    foutief vakantie uitschakelen.
    NB2: heating_mode-overgang `from: Holidays` is OOK GEEN trigger meer —
    sync_aan zet heating_mode zelf terug van Holidays naar Automatic (omdat
    Holidays kamertemp te laag laat zakken), en dat zou anders sync_uit
    direct na sync_aan triggeren (race-condition).

    Acties: dhw_mode terug naar Automatic (als nog op Holidays), heating_mode
    safety-check naar Automatic (zou na sync_aan nooit op Holidays moeten
    staan, maar voor de zekerheid), parallel_shift_temperature herstellen uit
    input_number.vakantie_parallel_shift_backup en backup → 0.

    TDI catch-up: als laatste TDI ≥7 dgn geleden was, wordt direct een
    thermische desinfectie-cyclus gestart (setpoint 65°C, dhw_mode Automatic,
    heating-switch aan, lock on) ongeacht zon, tijd of goedkoopste-uur. Setpoint
    65°C (niet 62°C) is bewust gelijk aan de reguliere tdi_legionella_solar_overschot
    — zodat tdi_einde_reset (die target_temperature > 63 als conditie heeft)
    deze cyclus ook daadwerkelijk herkent en reset. Met 62°C bleef de reset
    nooit afgaan (geen enkele reset-automation herkende setpoint 62 +
    mode Automatic) en bleef de boiler voor onbepaalde tijd op 62°C/Automatic
    staan (gefixt 12-10-2026). Reset via tdi_einde_reset (DHW > 60°C voor
    15 min). Vermijdt dat boiler na vakantie nog dagen op niet-legionellaveilige
    57°C draait voordat reguliere TDI-automation aan de beurt komt.

    Notificatie toont DHW/kamer/buiten-temp, laatste TDI, heating-switch en
    de herstelde parallel_shift.
  triggers:
    - trigger: state
      entity_id: input_boolean.vakantie_actief
      to: "off"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.vakantie_actief
    - if:
      - condition: state
        entity_id: select.luxtronik_280807_0450_dhw_mode
        state: Holidays
      then:
      - action: select.select_option
        target:
          entity_id: select.luxtronik_280807_0450_dhw_mode
        data:
          option: Automatic
    - if:
      - condition: state
        entity_id: select.luxtronik_280807_0450_heating_mode
        state: Holidays
      then:
      - action: select.select_option
        target:
          entity_id: select.luxtronik_280807_0450_heating_mode
        data:
          option: Automatic
    - if:
      - condition: numeric_state
        entity_id: input_number.vakantie_parallel_shift_backup
        above: 0.1
      then:
      - action: number.set_value
        target:
          entity_id: number.luxtronik_280807_0450_heating_curve_parallel_shift_temperature
        data:
          value: "{{ states('input_number.vakantie_parallel_shift_backup') | float(17) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.vakantie_parallel_shift_backup
        data:
          value: 0
    # TDI catch-up: forceer thermische desinfectie als die ≥7 dgn geleden was.
    # Ongeacht zon, tijd-van-de-dag of goedkoopste-uur — legionellaveiligheid
    # gaat voor energiekost na een vakantieperiode. Reset volgt via
    # tdi_einde_reset (DHW > 60 + setpoint > 60 + dhw_mode Automatic).
    - if:
      - condition: template
        value_template: >
          {% set last = states('input_datetime.tdi_laatste_start') %}
          {{ last in ('unknown', 'unavailable')
             or (now().date() - as_datetime(last).date()).days >= 7 }}
      then:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.tdi_laatste_start
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      # Idem als reguliere TDI-automation: Luxtronik weekly scheduler uit.
      - action: select.select_option
        target:
          entity_id: select.luxtronik_280807_0450_thermal_desinfection_day
        data:
          option: 'None'
      - action: select.select_option
        target:
          entity_id: select.luxtronik_280807_0450_dhw_mode
        data:
          option: Automatic
      - action: number.set_value
        target:
          entity_id: number.luxtronik_280807_0450_dhw_target_temperature
        data:
          value: 65
      - action: switch.turn_on
        target:
          entity_id: switch.luxtronik_280807_0450_heating
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.tapwater_overschot_lock
      - action: persistent_notification.create
        data:
          title: "TDI catch-up na vakantie"
          notification_id: tdi_catchup_vakantie
          message: >-
            Laatste TDI was ≥7 dgn geleden — TDI nu gestart (setpoint 65°C,
            mode Automatic, heating-switch aan). Reset volgt via tdi_einde_reset
            zodra DHW > 60°C voor 15 min.
    - action: persistent_notification.create
      data:
        title: "Vakantie uitgeschakeld"
        message: >-
          DHW {{ states('sensor.luxtronik_280807_0450_dhw_temperature') }}°C |
          Kamer {{ states('sensor.luxtronik_280807_0450_room_thermostat_temperature') }}°C |
          Buiten {{ states('sensor.luxtronik_280807_0450_outdoor_temperature') }}°C |
          Laatste TDI {{ states('input_datetime.tdi_laatste_start') }} |
          Heating-switch {{ states('switch.luxtronik_280807_0450_heating') }} |
          Parallel_shift {{ states('number.luxtronik_280807_0450_heating_curve_parallel_shift_temperature') }}°C
  mode: single

- id: vorstbescherming_waarschuwing
  alias: "Vorstbescherming: waarschuwing bij heating Off in koud weer"
  description: >
    Notificatie wanneer buitentemperatuur ≤ 5°C voor ten minste 10 minuten
    EN heating_mode = Off (geen vorstbescherming actief in Luxtronik). Voorkomt
    dat een zomerse Off-stand vergeten wordt vóór de winter, met bevriezings-
    risico in vakanties of bij langdurige afwezigheid. Eénmalige notificatie
    per dalingscyclus (trigger wordt alleen bij overgang geactiveerd); mode: single.
  triggers:
    - trigger: numeric_state
      entity_id: sensor.luxtronik_280807_0450_outdoor_temperature
      below: 5
      for:
        minutes: 10
  conditions:
    - condition: state
      entity_id: select.luxtronik_280807_0450_heating_mode
      state: "Off"
  actions:
    - action: persistent_notification.create
      data:
        title: "⚠ Vorstbescherming inactief"
        notification_id: vorstbescherming_warning
        message: >-
          Buitentemperatuur {{ states('sensor.luxtronik_280807_0450_outdoor_temperature') }}°C
          en heating_mode staat op **Off** — Luxtronik geeft geen
          vorstbescherming. Overweeg om heating_mode naar Automatic of
          Holidays te zetten (vooral bij vakantie of langdurige afwezigheid).
          DHW {{ states('sensor.luxtronik_280807_0450_dhw_temperature') }}°C |
          Kamer {{ states('sensor.luxtronik_280807_0450_room_thermostat_temperature') }}°C |
          Vakantie {{ states('input_boolean.vakantie_actief') }}.
  mode: single

- id: luxtronik_tdi_dag_check
  alias: "Luxtronik: waarschuwing als TDI-dag intern geactiveerd is"
  description: >
    Bewaakt dat geen van de 8 TDI-dag-vlaggen (parameters 20-27:
    BwTDI_akt_MO/DI/MI/DO/FR/SA/SO/AL) in de Luxtronik op 1 staat. HA
    voert TDI zelf via tdi_legionella_solar_overschot uit; een interne
    Luxtronik-TDI overruled dat en kost ~5 kWh tegen ongunstig nachttarief.
    Triggert (a) bij elke wijziging van de select naar iets anders dan
    "None", en (b) dagelijks om 09:00 voor het geval HA offline was tijdens
    de wijziging. Een tweede trigger op de TDI-doeltemp signaleert ook
    als die per ongeluk weer omhoog gezet wordt.
  triggers:
    - trigger: state
      entity_id: select.luxtronik_280807_0450_thermal_desinfection_day
      id: dag_aan
    - trigger: time
      at: "09:00:00"
      id: dagelijkse_check
    - trigger: numeric_state
      entity_id: number.luxtronik_280807_0450_dhw_thermal_desinfection_target
      above: 62.5
      id: target_omhoog
  conditions:
    - condition: template
      value_template: >-
        {{ states('select.luxtronik_280807_0450_thermal_desinfection_day') not in ['None', 'unknown', 'unavailable']
           or (states('number.luxtronik_280807_0450_dhw_thermal_desinfection_target') | float(0)) > 62.5 }}
  actions:
    - action: persistent_notification.create
      data:
        title: "⚠ Luxtronik TDI intern geactiveerd"
        notification_id: luxtronik_tdi_intern
        message: >-
          Luxtronik staat ingesteld om zelf een TDI te draaien — HA moet de
          enige TDI-aansturing zijn.

          - TDI-dag: **{{ states('select.luxtronik_280807_0450_thermal_desinfection_day') }}**
          - TDI-doel: **{{ states('number.luxtronik_280807_0450_dhw_thermal_desinfection_target') }}°C**
          - Trigger: {{ trigger.id }}

          **Aanpassen kan op twee plekken (schrijven naar hetzelfde register):**

          - **In HA** (aanbevolen — snelst): open de Luxtronik-card of
            Instellingen → Apparaten → Novelan @192.168.1.39:8889.
            Zet `select.luxtronik_280807_0450_thermal_desinfection_day`
            op **None** en
            `number.luxtronik_280807_0450_dhw_thermal_desinfection_target`
            op **62°C**.
          - **Op het Luxtronik-display**: Service → Instellingen → Warmwater →
            Thermische desinfectie → Weekdag op **Uit** en Temperatuur op
            **62°C**.
  mode: single

- id: github_nachtelijke_backup
  alias: "GitHub: nachtelijke config backup"
  description: >
    Pusht gewijzigde configuratiebestanden naar GitHub. Triggert om 03:00
    EN bij HA-start om gemiste runs op te vangen (HA offline op 03:00,
    crash tijdens push, etc.). Conditie: marker input_datetime.last_github_backup
    is van een eerdere dag of leeg → één poging per kalenderdag.
    Marker wordt gezet na elke poging (niet alleen na een commit) — anders
    zou een dag zonder wijzigingen tot herhaalde retries leiden.
  triggers:
    - trigger: time
      at: "03:00:00"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: >
        {% set last = states('input_datetime.last_github_backup') %}
        {% if last in ('unknown', 'unavailable') %}
          true
        {% else %}
          {{ (as_datetime(last) | as_local).date() < now().date() }}
        {% endif %}
  actions:
    - delay:
        seconds: 30
    - action: shell_command.git_backup
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.last_github_backup
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  mode: single

- id: tapwater_lock_watchdog
  alias: "Tapwater: lock watchdog (timeout)"
  description: >
    Vangnet: zet tapwater_overschot_lock uit als die >6 u aan staat zonder
    actieve hoge-setpoint cyclus (setpoint < 55 EN dhw_mode ≠ Party). Voorkomt
    dat een lock blijft hangen na een gemiste reset (HA-crash, storing, of
    edge-case waarin een reset-trigger niet activeert) — bij volgende vakantie
    zou de Holidays-fallback in reset-automations dan ten onrechte activeren.
    Orthogonaal aan tapwater_reset_na_bijverwarmen (die reset óók de setpoint);
    deze watchdog raakt setpoint/dhw_mode NIET aan en doet alleen lock-cleanup.
  triggers:
    - trigger: time_pattern
      minutes: '0'
  conditions:
    - condition: state
      entity_id: input_boolean.tapwater_overschot_lock
      state: "on"
      for:
        hours: 6
    - condition: numeric_state
      entity_id: number.luxtronik_280807_0450_dhw_target_temperature
      below: 55
    - condition: not
      conditions:
        - condition: state
          entity_id: select.luxtronik_280807_0450_dhw_mode
          state: Party
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.tapwater_overschot_lock
    - action: persistent_notification.create
      data:
        title: "Tapwater: lock watchdog"
        notification_id: tapwater_lock_watchdog
        message: >-
          tapwater_overschot_lock stond >6 u aan zonder actieve hoge-setpoint
          cyclus (setpoint {{ states('number.luxtronik_280807_0450_dhw_target_temperature') }}°C,
          mode {{ states('select.luxtronik_280807_0450_dhw_mode') }}). Lock
          uitgezet.
  mode: single

- id: compressor_starts_week_check_2026_06_27
  alias: "Warmtepomp: weekcheck compressor-starts (2026-06-27)"
  description: >
    Eenmalige meting van compressor-starts dag/nacht verdeling 1 week na
    rust-setpoint 48→50 en hysterese 8K→10K wijzigingen (2026-06-20). Doel:
    bevestigen of starts naar zonne-uren zijn verschoven. Baseline pre-wijziging
    (recorder 2026-06-10 t/m 2026-06-20): 60% dag / 40% nacht over 12 starts.
    Trigger via dagelijkse 11:00 + datum-conditie, dus eenmalig geactiveerd op 2026-06-27.
    Automation mag na uitvoering verwijderd worden (dode code na die datum).
  triggers:
  - trigger: time
    at: "11:00:00"
  conditions:
  - condition: template
    value_template: "{{ now().strftime('%Y-%m-%d') == '2026-06-27' }}"
  actions:
  - variables:
      dag: "{{ states('input_number.compressor_starts_dag') | int(0) }}"
      nacht: "{{ states('input_number.compressor_starts_nacht') | int(0) }}"
      totaal: "{{ dag + nacht }}"
      nacht_pct: "{{ (nacht / totaal * 100) | round(0) if totaal > 0 else 0 }}"
      dag_pct: "{{ 100 - nacht_pct }}"
      gem_per_dag: "{{ (totaal / 7) | round(1) }}"
      advies: >-
        {% if totaal == 0 %}Geen starts gemeten — controleer of de teller-automation actief was.
        {% elif nacht_pct <= 40 %}Nacht-aandeel ({{ nacht_pct }}%) ≤ 40% baseline — geen winst van 10K+50, overweeg 12K+50 voor echte solar-shift.
        {% elif nacht_pct > 50 %}Nacht-aandeel ({{ nacht_pct }}%) hoger dan baseline — ongunstig, overweeg terug naar 8K+48.
        {% else %}Nacht-aandeel ({{ nacht_pct }}%) rond baseline — stabiel, beslissing pending op meer data.
        {% endif %}
  - action: persistent_notification.create
    data:
      title: "Compressor-starts weekmeting"
      notification_id: compressor_starts_week_check
      message: >-
        Periode 2026-06-20 t/m 2026-06-27 (7 dagen).
        Totaal: {{ totaal }} starts ({{ gem_per_dag }}/dag).
        Dag (06-22u): {{ dag }} ({{ dag_pct }}%) | Nacht (22-06u): {{ nacht }} ({{ nacht_pct }}%).
        Baseline pre-wijziging: 60% dag / 40% nacht over 1,2 starts/dag.
        Conclusie: {{ advies }}
  mode: single

- id: compressor_starts_counter
  alias: "Warmtepomp: tel compressor-starts dag/nacht"
  description: >
    Telt elke compressor off→on transitie en split op tijdvenster (lokale tijd):
    dag = 06:00-22:00, nacht = 22:00-06:00. KPI om effect van rust-setpoint/
    hysterese-wijzigingen op solar-shift te meten. Gebruikt input_number i.p.v.
    counter omdat counter geen reload-service heeft (zou core restart vereisen).
  triggers:
  - trigger: state
    entity_id: binary_sensor.luxtronik_280807_0450_compressor
    from: "off"
    to: "on"
  actions:
  - choose:
    - conditions:
      - condition: time
        after: "06:00:00"
        before: "22:00:00"
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.compressor_starts_dag
        data:
          value: "{{ states('input_number.compressor_starts_dag') | int(0) + 1 }}"
    default:
    - action: input_number.set_value
      target:
        entity_id: input_number.compressor_starts_nacht
      data:
        value: "{{ states('input_number.compressor_starts_nacht') | int(0) + 1 }}"
  mode: single

- id: warmtepomp_korte_cyclus_detector
  alias: "Warmtepomp: korte cyclus detector (<10 min)"
  description: >
    Detecteert pendelen: notificeert wanneer een compressor on-fase < 10 min
    duurde. Berekent duur tussen off→on (trigger.from_state.last_changed) en
    on→off (trigger.to_state.last_changed). Bij Luxtronik DHW-cycli is een
    gezonde aan-fase typisch 25-60 min (afhankelijk van setpoint en DHW-start
    temperatuur); aan-fasen <10 min wijzen op een instelling die
    hysterese-overrule te kort houdt, of conflicterende automaties die
    setpoint mid-cyclus terug naar 50 zetten. Twee notificaties binnen 24u
    is een signaal om instellingen te herzien (Party-safety, reset-timing).
  triggers:
  - trigger: state
    entity_id: binary_sensor.luxtronik_280807_0450_compressor
    from: "on"
    to: "off"
  conditions:
  - condition: template
    value_template: >
      {% set start = trigger.from_state.last_changed %}
      {% set einde = trigger.to_state.last_changed %}
      {{ start is not none and einde is not none
         and (einde - start).total_seconds() < 600 }}
  actions:
  - variables:
      duur_sec: "{{ (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() | int }}"
      duur_min: "{{ (duur_sec / 60) | round(1) }}"
  - action: persistent_notification.create
    data:
      title: "⚠ Warmtepomp: korte cyclus ({{ duur_min }} min)"
      notification_id: "wp_korte_cyclus_{{ now().strftime('%Y%m%d_%H%M') }}"
      message: >-
        Compressor aan-fase was {{ duur_min }} min (< 10 min drempel).
        DHW {{ states('sensor.luxtronik_280807_0450_dhw_temperature') }}°C |
        Setpoint {{ states('number.luxtronik_280807_0450_dhw_target_temperature') }}°C |
        Mode {{ states('select.luxtronik_280807_0450_dhw_mode') }} |
        Buiten {{ states('sensor.luxtronik_280807_0450_outdoor_temperature') }}°C |
        Aanvoer {{ states('sensor.luxtronik_280807_0450_flow_in_temperature') }}°C.
        Bij herhaling: controleer reset-automaties en Party-safety timing.
  mode: parallel
  max: 3

- id: dhw_hysteresis_watchdog
  alias: "Tapwater: hysterese-watchdog (herstel naar 10K)"
  description: >
    Vangnet voor de 3K-hysterese-verlaging in groot-overschot boost en TDI.
    Beide zetten dhw_hysteresis tijdelijk op 3K om Party+62 daadwerkelijk
    te laten starten (bevestigd 23-09-2026: Party alléén negeert hysterese
    niet op deze firmware). Reset-automaties zetten hem terug op 10K, maar
    als een reset gemist wordt (bv. user-intervention op dhw_mode) blijft
    3K staan. Bij rust-setpoint 50 zou de autonome cyclus dan starten bij
    DHW=47 i.p.v. 40 = veel meer korte cycli. Deze watchdog herstelt naar
    10K als hysterese > 60 min onder 8K staat.
  triggers:
  - trigger: numeric_state
    entity_id: number.luxtronik_280807_0450_dhw_hysteresis
    below: 8
    for:
      minutes: 60
  actions:
  - target:
      entity_id: number.luxtronik_280807_0450_dhw_hysteresis
    data:
      value: 10
    action: number.set_value
  - action: persistent_notification.create
    data:
      title: "Tapwater: hysterese teruggezet naar 10K"
      notification_id: dhw_hysteresis_watchdog
      message: >-
        dhw_hysteresis stond > 60 min onder 8K zonder terug te keren naar
        10K. Watchdog heeft geforceerd hersteld. Controleer of een reset-
        automation (zonne_overschot_extra_opslag_reset / tdi_einde_reset /
        veiligheidsreset in tapwater_extra_opslag_groot_overschot) is
        gemist. DHW {{ states('sensor.luxtronik_280807_0450_dhw_temperature') }}°C |
        Setpoint {{ states('number.luxtronik_280807_0450_dhw_target_temperature') }}°C |
        Mode {{ states('select.luxtronik_280807_0450_dhw_mode') }}.
  mode: single

- id: dhw_hysteresis_handmatige_wijziging_blokkeren
  alias: "Tapwater: handmatige wijziging dhw_hysteresis blokkeren"
  description: >
    dhw_hysteresis wordt door de tapwater-automaties zelf beheerd (tijdelijk
    3K tijdens TDI/groot-overschot-boost, anders 10K — zie
    dhw_hysteresis_watchdog). Een handmatige wijziging via HA UI/app wordt
    binnen enkele seconden teruggedraaid naar de waarde van vóór de
    wijziging, zodat de waarde effectief niet aanpasbaar is voor gebruikers,
    terwijl de automaties gewoon kunnen blijven schakelen tussen 3K en 10K.

    Context-detectie: ALLEEN context.user_id is gevuld (= HA UI/app-actie
    door een ingelogde gebruiker). Oorspronkelijk (12-10-2026) ook
    `context.parent_id is none` als tweede voorwaarde — analoog aan
    tapwater_overschot_user_intervention, waar dat Luxtronik RBE-wijzigingen
    detecteert. Voor dhw_hysteresis bleek dat fout: dit register fluctueert
    af en toe spontaan een paar tienden (bevestigd 12-10-2026, Luxtronik-
    polling), en die parentloze device-updates voldeden ook aan `parent_id
    is none`. Elke terugzet-actie veroorzaakte zelf weer een korte
    nasettling-ruis, die opnieuw als "externe wijziging" werd gezien —
    oscillatie tussen 9.5-10.2 i.p.v. stabiel op 10. Met alleen user_id
    reageert de automatie nooit meer op device-afkomstige fluctuaties.
  triggers:
    - trigger: state
      entity_id: number.luxtronik_280807_0450_dhw_hysteresis
  conditions:
    - condition: template
      value_template: >
        {{ trigger.to_state.context.user_id is not none }}
    - condition: template
      value_template: "{{ trigger.from_state is not none }}"
  actions:
    - action: number.set_value
      target:
        entity_id: number.luxtronik_280807_0450_dhw_hysteresis
      data:
        value: "{{ trigger.from_state.state }}"
  mode: single

- id: compressor_starts_monthly_reset
  alias: "Warmtepomp: maandelijkse reset compressor-tellers"
  description: >
    Reset compressor_starts_dag en _nacht naar 0 op de 1e van elke maand om
    00:01. Houdt KPI bruikbaar voor maand-over-maand trending. Trigger om
    00:01 (niet 00:00) om eventuele dagovergangs-jitter in time-triggers te
    vermijden.
  triggers:
  - trigger: time
    at: "00:01:00"
  conditions:
  - condition: template
    value_template: "{{ now().day == 1 }}"
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.compressor_starts_dag
    data:
      value: 0
  - action: input_number.set_value
    target:
      entity_id: input_number.compressor_starts_nacht
    data:
      value: 0
  mode: single

- id: kamer_gelijk_buiten_actueel_signaal
  alias: "Signaal: ventileren — kamer ≥20°C en buiten < kamer (actueel)"
  description: >
    Vergelijkt kamertemperatuur met de actueel waargenomen buitentemperatuur
    van weather.thuis. Edge-triggered mobile+HA-UI push als kamer ≥20°C is
    EN buiten LAGER is dan de kamer. Guards: onderdrukt tijdens vakantie
    (input_boolean.vakantie_actief on), tijdens regen (weather.thuis
    state rainy/pouring/lightning-rainy/snowy-rainy/hail — het regen-
    signaal neemt het dan over) en zolang de kamer-trend stijgend is
    (input_boolean.kamer_stijgt on — na een naar_stijgend reversal geldt
    het 'sluit ramen om koelte binnen te houden'-advies; ventileren zou
    daar tegenin gaan). Meldingen komen 24/7 door; alleen het push-geluid
    is uitgeschakeld tijdens het stil-venster 22:30-07:30 (aparte Android-
    kanaal 'Ventilatie advies (stil)'). Cross-clear naar alle andere
    ventilatie-signalen bij activeren. Trigger: time_pattern /15 min.
    Reageert NIET op kamer_temp_reversal events — daar is
    kamer_reversal_melding leidend (voorkomt tegenstrijdige pushes op
    reversal-momenten).
  triggers:
  - trigger: time_pattern
    minutes: "/15"
  actions:
  - variables:
      buiten_actueel: "{{ state_attr('weather.thuis', 'temperature') | float(-999) }}"
      kamer_temp: "{{ states('sensor.luxtronik_280807_0450_room_thermostat_temperature') | float(-999) }}"
      vakantie: "{{ is_state('input_boolean.vakantie_actief', 'on') }}"
      regen: "{{ states('weather.thuis') in ['rainy','pouring','lightning-rainy','snowy-rainy','hail'] }}"
      stijgend: "{{ is_state('input_boolean.kamer_stijgt', 'on') }}"
      conditie: >-
        {{ kamer_temp > -900 and buiten_actueel > -900
           and kamer_temp >= 20 and buiten_actueel < kamer_temp
           and not vakantie and not regen and not stijgend }}
      gemeld: "{{ is_state('input_boolean.ventileren_signaal_actief', 'on') }}"
      stil_venster: "{{ now().hour >= 23 or now().hour < 7 or (now().hour == 22 and now().minute >= 30) or (now().hour == 7 and now().minute < 30) }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ conditie and not gemeld }}"
      sequence:
      - action: notify.mobile_app_sm_g781b
        data:
          title: "🌡 Ventileren om binnenshuis af te koelen"
          message: >-
            Zet ramen en tuindeuren open. Kamer {{ kamer_temp }}°C,
            buiten {{ buiten_actueel }}°C.
          data:
            tag: kamer_gelijk_buiten_actueel
            channel: "Ventilatie advies (stil)"
            importance: low
            priority: normal
            ttl: 0
            notification_icon: mdi:thermometer
      - action: persistent_notification.create
        data:
          title: "🌡 Ventileren om binnenshuis af te koelen"
          notification_id: kamer_gelijk_buiten_actueel
          message: >-
            Zet ramen en tuindeuren open. Kamer {{ kamer_temp }}°C,
            buiten {{ buiten_actueel }}°C.
      - action: notify.mobile_app_sm_g781b
        data:
          message: clear_notification
          data:
            tag: kamer_te_koel_sluit_ramen
      - action: persistent_notification.dismiss
        data:
          notification_id: kamer_te_koel_sluit_ramen
      - action: notify.mobile_app_sm_g781b
        data:
          message: clear_notification
          data:
            tag: kamer_warm_buiten_warmer
      - action: persistent_notification.dismiss
        data:
          notification_id: kamer_warm_buiten_warmer
      - action: notify.mobile_app_sm_g781b
        data:
          message: clear_notification
          data:
            tag: kamer_regen
      - action: persistent_notification.dismiss
        data:
          notification_id: kamer_regen
      - action: notify.mobile_app_sm_g781b
        data:
          message: clear_notification
          data:
            tag: nachtventilatie
      - action: persistent_notification.dismiss
        data:
          notification_id: nachtventilatie
      - action: notify.mobile_app_sm_g781b
        data:
          message: clear_notification
          data:
            tag: kamer_reversal
      - action: persistent_notification.dismiss
        data:
          notification_id: kamer_reversal
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ventileren_signaal_actief
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.sluit_ramen_signaal_actief
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ramen_dicht_signaal_actief
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.regen_signaal_actief
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.nachtventilatie_signaal_actief
    - conditions:
      - condition: template
        value_template: "{{ conditie and gemeld }}"
      sequence:
      - action: notify.mobile_app_sm_g781b
        data:
          title: "🌡 Ventileren om binnenshuis af te koelen"
          message: >-
            Zet ramen en tuindeuren open. Kamer {{ kamer_temp }}°C,
            buiten {{ buiten_actueel }}°C.
          data:
            tag: kamer_gelijk_buiten_actueel
            channel: "Ventilatie advies (stil)"
            importance: low
            priority: normal
            ttl: 0
            notification_icon: mdi:thermometer
      - action: persistent_notification.create
        data:
          title: "🌡 Ventileren om binnenshuis af te koelen"
          notification_id: kamer_gelijk_buiten_actueel
          message: >-
            Zet ramen en tuindeuren open. Kamer {{ kamer_temp }}°C,
