- id: ev_fasewissel_melding
  alias: "EV: melding bij 1/3-fase wissel"
  description: >
    Melding wanneer de regelaar (ev_regelaar_epex_pv_fase_load_balancing)
    een lader daadwerkelijk tussen 1-fase en 3-fase laden omschakelt
    (input_number.ev_sonia_fasen / ev_rob_fasen verandert van waarde). Vereist
    input_boolean.ev_1fase_ondersteund aan.
  triggers:
    - trigger: state
      entity_id:
        - input_number.ev_sonia_fasen
        - input_number.ev_rob_fasen
  conditions:
    - condition: template
      value_template: >
        {{ trigger.from_state is not none
           and trigger.from_state.state not in ('unknown', 'unavailable')
           and trigger.from_state.state != trigger.to_state.state }}
  actions:
    - variables:
        lader: "{{ 'Sonia' if trigger.entity_id == 'input_number.ev_sonia_fasen' else 'Rob' }}"
    - action: persistent_notification.create
      data:
        title: "EV: fasewissel ({{ lader }})"
        message: >-
          Tijd: {{ now().strftime('%H:%M') }}.
          Lader {{ lader }}: {{ trigger.from_state.state }} -> {{ trigger.to_state.state }} fase(n).
    - action: notify.mobile_app_sm_g781b
      data:
        title: "EV: fasewissel ({{ lader }})"
        message: >-
          {{ now().strftime('%H:%M') }} — lader {{ lader }} wisselde van
          {{ trigger.from_state.state }} naar {{ trigger.to_state.state }} fase(n).
        data:
          tag: ev_fasewissel
          channel: "EV laden"
  mode: queued

- id: ev_ev_rob_laadsessie_einde
  alias: "EV: melding bij einde laadsessie Rob"
  description: >
    Eenmalige melding wanneer Rob's laadpaal (EV-Rob) stopt met laden
    (OCPP ChargePointStatus connector verlaat Charging).
  triggers:
