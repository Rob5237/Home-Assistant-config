      entity_id: sensor.ev_rob_status_connector
      from: "Charging"
  actions:
    - action: persistent_notification.create
      data:
        title: "Laadpaal Rob: laadsessie beëindigd"
        message: >-
          Tijd: {{ now().strftime('%H:%M') }}.
          Status: {{ states('sensor.ev_rob_status_connector') }}.
          Energie deze sessie: {{ states('sensor.ev_rob_energy_session') }} kWh.
    - action: notify.mobile_app_sm_g781b
      data:
        title: "Laadpaal Rob: laadsessie beëindigd"
