      entity_id: sensor.ev_sonia_status_connector
      to: "Charging"
  actions:
    - action: persistent_notification.create
      data:
        title: "Laadpaal Sonia: laadsessie gestart"
        message: >-
          Tijd: {{ now().strftime('%H:%M') }}.
          Status: {{ states('sensor.ev_sonia_status_connector') }}.
    - action: notify.mobile_app_sm_g781b
      data:
        title: "Laadpaal Sonia: laadsessie gestart"
        message: "{{ now().strftime('%H:%M') }} — EV-Sonia is begonnen met laden."
        data:
          tag: ev_sonia_laadsessie_start
