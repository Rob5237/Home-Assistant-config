# Loads default set of integrations. Do not remove.
default_config:

# Home Assistant instellingen
homeassistant:
  packages: !include_dir_named packages

# Templates inladen vanuit een aparte map
template: !include_dir_merge_list templates/

# Thema's inladen
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
scene: !include scenes.yaml

recorder:
  purge_keep_days: 365
  exclude:
    entities:
      - sensor.ev_fasedetectie

logbook:
  exclude:
    entities:
      - script.ev_lb_profiel
      - automation.ev_dynamische_load_balancing_p1_voorrang_sonia
      - automation.ev_aantal_fasen_van_de_auto_herkennen
      - automation.ev_lader_automatisch_starten_prijssturing
      - automation.ev_laden_hervatten_na_noodstop_auto_gepauzeerd
      - automation.ev_goedkoopste_laadblok_vastleggen

shell_command:
  git_backup: "bash /config/git_push.sh"

lovelace:
  dashboards:
    dashboard-laden:
      mode: yaml
      title: Laden
      icon: mdi:ev-station
      show_in_sidebar: true
      filename: dashboards/ev_laden.yaml