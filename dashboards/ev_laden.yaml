                  span { white-space: pre-line !important; overflow: visible !important; text-overflow: clip !important; }
                  ha-card { border: 2px solid rgba(255, 255, 255, 0.55) !important; border-bottom-color: rgba(0, 0, 0, 0.35) !important; border-radius: 14px !important; box-shadow: 0 7px 0 rgba(0, 0, 0, 0.45), 0 10px 14px rgba(0, 0, 0, 0.35), inset 0 3px 4px rgba(255, 255, 255, 0.55), inset 0 -4px 6px rgba(0, 0, 0, 0.2) !important; transition: transform 0.08s, box-shadow 0.08s; margin-bottom: 8px; }
                  ha-card:active { transform: translateY(6px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.45), 0 2px 3px rgba(0, 0, 0, 0.3), inset 0 5px 10px rgba(0, 0, 0, 0.5) !important; }
                  ha-card { background: linear-gradient(rgba(76, 175, 80, 0.4), rgba(76, 175, 80, 0.4)), var(--card-background-color); }
                  {% if is_state('input_boolean.ev_sonia_nacht_overslaan', 'on') %}
                  ha-state-icon { color: transparent !important; width: 40px !important; height: 40px !important; min-width: 40px; min-height: 40px; --mdc-icon-size: 40px; display: block !important; margin: 0; padding: 0; flex: none; background-color: #F44336;
