# =====================================================================
# config/dashboards/ev_laden.yaml  – YAML-dashboard "Laden"
# Hoort bij packages/ev_load_balancing.yaml (prijs- en zonsturing + load
# balancing). Bijgewerkt 20-10-2026: oude sturing (slimme sturing, laadplan,
# optimale fase) eruit; nieuwe entiteiten erin. Alleen standaardkaarten + card_mod.
#
# In configuration.yaml (NIET in een package):
#   lovelace:
#     dashboards:
#       dashboard-laden:
#         mode: yaml
#         title: Laden
#         icon: mdi:ev-station
#         show_in_sidebar: true
#         filename: dashboards/ev_laden.yaml
# Wijzigingen: browser verversen.
# EV-Sonia = Sonia (EV-Sonia), EV-Rob = Rob (EV-Rob).
# =====================================================================
views:
  - title: EV-Sonia
    path: sonia
    theme: laden_koppen
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: EV Sonia
            heading_style: subtitle
            icon: mdi:car-electric
          - type: tile
            card_mod:
              style:
                .: |
                  ha-card { border: none !important; box-shadow: none !important; }
                  ha-tile-info { margin-left: -5px !important; }
                  ha-card { background: linear-gradient(rgba(76, 175, 80, 0.4), rgba(76, 175, 80, 0.4)), var(--card-background-color); }
                ha-tile-info$: |
                  .info { flex-direction: row !important; align-items: baseline !important; flex-wrap: wrap !important; column-gap: 10px !important; }
                  :host { flex-direction: row !important; align-items: baseline !important; flex-wrap: wrap !important; column-gap: 10px !important; }
                  .primary, .secondary { font-size: 16px !important; }
                  .primary { font-weight: 700 !important; }
                  .secondary, .secondary * { font-size: 14.5px !important; color: #F44336 !important; font-weight: bold !important; white-space: pre-line !important; overflow: visible !important; text-overflow: clip !important; }
            entity: sensor.ev_sonia_status_nl
            name: Status
            grid_options:
              columns: 12
          - type: tile
            card_mod:
              style:
                .: |
                  ha-card { border: none !important; box-shadow: none !important; }
                  ha-tile-info { margin-left: -5px !important; }
                  ha-card { background: linear-gradient(rgba(76, 175, 80, 0.4), rgba(76, 175, 80, 0.4)), var(--card-background-color); }
                  state-display { white-space: pre-line !important; }
                ha-tile-info$: |
                  .primary, .secondary { font-size: 16px !important; }
                  .primary { font-weight: 700 !important; }
                  .secondary, .secondary * { font-size: 14.5px !important; color: #F44336 !important; font-weight: bold !important; white-space: pre-line !important; overflow: visible !important; text-overflow: clip !important; }
            entity: sensor.ev_sonia_verwachte_start
            name: Verwachte Laadstarttijd
            grid_options:
              columns: 12
              rows: auto
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.ev_sonia_nacht_overslaan
                state: "off"
            card:
              type: button
              entity: input_boolean.ev_sonia_nacht_overslaan
