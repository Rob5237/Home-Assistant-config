# =====================================================================
# config/dashboards/ev_laden.yaml  – YAML-dashboard "Laden"
# Hoort bij packages/ev_load_balancing.yaml (prijs- en zonsturing + load
# balancing). Bijgewerkt 20-10-2026: oude sturing (slimme sturing, laadplan,
# optimale fase) eruit; nieuwe entiteiten erin. Alleen standaardkaarten + card_mod.
#
# In configuration.yaml (NIET in een package):
#   lovelace:
#     dashboards:
#       dashboard-laden:
#         mode: yaml
#         title: Laden
#         icon: mdi:ev-station
#         show_in_sidebar: true
#         filename: dashboards/ev_laden.yaml
# Wijzigingen: browser verversen.
# EV-Sonia = Sonia (EV-Sonia), EV-Rob = Rob (EV-Rob).
# =====================================================================
views:
  - title: Laden
    path: laden
    icon: mdi:ev-station
    theme: laden_koppen
    type: sections
    max_columns: 3
    sections:
      # ---------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Algemeen
            heading_style: title
            icon: mdi:home-lightning-bolt
          - type: tile
            entity: input_boolean.ev_lb_actief
            name: Load balancing
            icon: mdi:scale-balance
            color: green
            tap_action:
              action: toggle
          - type: tile
            entity: sensor.zonneplan_current_quarter_hourly_electricity_tariff
            name: Stroomprijs nu
          - type: tile
            entity: sensor.ev_lb_pv_overschot
            name: PV-overschot voor laders
            color: amber
          - type: tile
            entity: input_boolean.ev_sonia_direct_laden
            name: Boost EV-Sonia
            icon: mdi:lightning-bolt
            color: red
            tap_action:
              action: toggle
          - type: tile
            entity: input_boolean.ev_rob_direct_laden
            name: Boost EV-Rob
            icon: mdi:lightning-bolt
            color: red
            tap_action:
              action: toggle
          - type: entities
            title: Aansluiting 3x25 A
            show_header_toggle: false
            entities:
              - entity: sensor.ev_lb_ruimte
                name: Ruimte (zwaarste fase)
              - entity: sensor.ev_lb_stroom_l1
                name: Stroom L1
              - entity: sensor.ev_lb_stroom_l2
                name: Stroom L2
              - entity: sensor.ev_lb_stroom_l3
                name: Stroom L3
              - type: divider
              - entity: input_number.ev_lb_zekering
                name: Hoofdzekering
              - entity: input_number.ev_lb_marge
                name: Marge
              - entity: input_number.ev_prijsdrempel
                name: Altijd laden onder (prijs)
              - entity: input_number.ev_lb_min_rob
                name: Min. stroom Rob bij voorrang Sonia
              - entity: input_number.ev_lb_terugval
                name: Terugvalstroom zonder HA
              - type: divider
              - entity: input_number.ev_lb_afschakel_niveau
                name: Afgeschakelde huislasten
              - entity: binary_sensor.ev_lb_tekort
                name: Tekort
              - entity: binary_sensor.ev_lb_overbelasting
                name: Overbelasting
          - type: history-graph
            title: Laatste 24 uur
            hours_to_show: 24
            entities:
              - entity: sensor.ev_sonia_vermogen
                name: EV-Sonia
              - entity: sensor.ev_rob_vermogen
                name: EV-Rob
              - entity: sensor.ev_lb_pv_overschot
                name: PV-overschot

      # ---------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: EV-Sonia
            heading_style: title
            icon: mdi:ev-plug-type2
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(76, 175, 80, 0.18), rgba(76, 175, 80, 0.18)), var(--card-background-color); }
            entity: sensor.ev_sonia_status_nl
            name: Status
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(76, 175, 80, 0.18), rgba(76, 175, 80, 0.18)), var(--card-background-color); }
            entity: binary_sensor.ev_lb_sonia_laden_toegestaan
            name: Laden toegestaan
            icon: mdi:ev-station
            color: green
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(76, 175, 80, 0.18), rgba(76, 175, 80, 0.18)), var(--card-background-color); }
            entity: sensor.ev_sonia_vermogen
            name: Vermogen
            color: blue
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(76, 175, 80, 0.18), rgba(76, 175, 80, 0.18)), var(--card-background-color); }
            entity: sensor.ev_sonia_stroom
            name: Stroom per fase
            color: blue
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(76, 175, 80, 0.18), rgba(76, 175, 80, 0.18)), var(--card-background-color); }
            entity: sensor.ev_sonia_energy_session
            name: Deze sessie
            color: blue
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(76, 175, 80, 0.18), rgba(76, 175, 80, 0.18)), var(--card-background-color); }
            entity: input_boolean.ev_sonia_direct_laden
            name: Boost – nu laden
            color: red
            tap_action:
              action: toggle
            grid_options:
              columns: full
          - type: entities
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(76, 175, 80, 0.18), rgba(76, 175, 80, 0.18)), var(--card-background-color); }
            title: Prijs- en zonsturing
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_datetime.ev_sonia_vertrek
                name: Vertrek
              - entity: input_number.ev_lb_sonia_goedkoop_uren
                name: Goedkoopste uren laden
              - entity: binary_sensor.ev_lb_sonia_goedkoop_uur
                name: Nu goedkoop uur
              - entity: binary_sensor.ev_lb_sonia_pv_laden
                name: Genoeg zon
              - entity: input_select.ev_lb_sonia_fase
                name: Fase(n) van de auto
          - type: entities
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(76, 175, 80, 0.18), rgba(76, 175, 80, 0.18)), var(--card-background-color); }
            title: Techniek
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.ev_sonia_charge_control
                name: Laadsessie (charge control)
              - entity: input_number.ev_lb_setpunt_sonia
                name: Gevraagde stroom (A)
              - entity: input_number.ev_lb_max_sonia
                name: Max stroom (= Ratio-app)
              - entity: sensor.ev_sonia_stroom_l1
                name: Stroom L1
              - entity: sensor.ev_sonia_stroom_l2
                name: Stroom L2
              - entity: sensor.ev_sonia_stroom_l3
                name: Stroom L3
              - entity: binary_sensor.ev_lb_sonia_onder_controle
                name: Onder controle van HA

      # ---------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: EV-Rob
            heading_style: title
            icon: mdi:ev-plug-type2
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(33, 150, 243, 0.18), rgba(33, 150, 243, 0.18)), var(--card-background-color); }
            entity: sensor.ev_rob_status_nl
            name: Status
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(33, 150, 243, 0.18), rgba(33, 150, 243, 0.18)), var(--card-background-color); }
            entity: binary_sensor.ev_lb_rob_laden_toegestaan
            name: Laden toegestaan
            icon: mdi:ev-station
            color: green
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(33, 150, 243, 0.18), rgba(33, 150, 243, 0.18)), var(--card-background-color); }
            entity: sensor.ev_rob_vermogen
            name: Vermogen
            color: blue
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(33, 150, 243, 0.18), rgba(33, 150, 243, 0.18)), var(--card-background-color); }
            entity: sensor.ev_rob_stroom
            name: Stroom per fase
            color: blue
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(33, 150, 243, 0.18), rgba(33, 150, 243, 0.18)), var(--card-background-color); }
            entity: sensor.ev_rob_energy_session
            name: Deze sessie
            color: blue
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(33, 150, 243, 0.18), rgba(33, 150, 243, 0.18)), var(--card-background-color); }
            entity: input_boolean.ev_rob_direct_laden
            name: Boost – nu laden
            color: red
            tap_action:
              action: toggle
            grid_options:
              columns: full
          - type: entities
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(33, 150, 243, 0.18), rgba(33, 150, 243, 0.18)), var(--card-background-color); }
            title: Prijs- en zonsturing
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_datetime.ev_rob_vertrek
                name: Vertrek
              - entity: input_number.ev_lb_rob_goedkoop_uren
                name: Goedkoopste uren laden
              - entity: binary_sensor.ev_lb_rob_goedkoop_uur
                name: Nu goedkoop uur
              - entity: binary_sensor.ev_lb_rob_pv_laden
                name: Genoeg zon
              - entity: input_select.ev_lb_rob_fase
                name: Fase(n) van de auto
          - type: entities
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(33, 150, 243, 0.18), rgba(33, 150, 243, 0.18)), var(--card-background-color); }
            title: Techniek
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.ev_rob_charge_control
                name: Laadsessie (charge control)
              - entity: input_number.ev_lb_setpunt_rob
                name: Gevraagde stroom (A)
              - entity: input_number.ev_lb_max_rob
                name: Max stroom (= Ratio-app)
              - entity: sensor.ev_rob_stroom_l1
                name: Stroom L1
              - entity: sensor.ev_rob_stroom_l2
                name: Stroom L2
              - entity: sensor.ev_rob_stroom_l3
                name: Stroom L3
              - entity: binary_sensor.ev_lb_rob_onder_controle
                name: Onder controle van HA

  # -------------------------------------------------------------------
  # Bediening: per lader een knop om direct te laden (boost) en een knop
  # om het direct laden uit te zetten. Toegevoegd 21-10-2026.
  # -------------------------------------------------------------------
  - title: Bediening
    path: bediening
    icon: mdi:ev-plug-type2
    theme: laden_koppen
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: EV Sonia
            heading_style: title
            icon: mdi:car-electric
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(76, 175, 80, 0.18), rgba(76, 175, 80, 0.18)), var(--card-background-color); }
            entity: sensor.ev_sonia_status_nl
            name: Status
            grid_options:
              columns: 12
          - type: button
            entity: input_boolean.ev_sonia_direct_laden
            card_mod:
              style: |
                {% if is_state('input_boolean.ev_sonia_direct_laden', 'on') %}
                ha-card { background: linear-gradient(rgba(76, 175, 80, 0.45), rgba(76, 175, 80, 0.45)), var(--card-background-color); }
                {% endif %}
            name: Accu Opladen
            icon: mdi:battery-charging
            show_state: false
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: input_boolean.turn_on
              target:
                entity_id: input_boolean.ev_sonia_direct_laden
          - type: button
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(76, 175, 80, 0.18), rgba(76, 175, 80, 0.18)), var(--card-background-color); }
            name: Opladen uitzetten
            icon: mdi:battery-off
            show_state: false
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: input_boolean.turn_off
              target:
                entity_id: input_boolean.ev_sonia_direct_laden
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(76, 175, 80, 0.18), rgba(76, 175, 80, 0.18)), var(--card-background-color); }
            entity: sensor.ev_sonia_vermogen_kw
            name: Vermogen
            icon: mdi:flash
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: EV Rob
            heading_style: title
            icon: mdi:car-electric
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(33, 150, 243, 0.18), rgba(33, 150, 243, 0.18)), var(--card-background-color); }
            entity: sensor.ev_rob_status_nl
            name: Status
            grid_options:
              columns: 12
          - type: button
            entity: input_boolean.ev_rob_direct_laden
            card_mod:
              style: |
                {% if is_state('input_boolean.ev_rob_direct_laden', 'on') %}
                ha-card { background: linear-gradient(rgba(33, 150, 243, 0.45), rgba(33, 150, 243, 0.45)), var(--card-background-color); }
                {% endif %}
            name: Accu Opladen
            icon: mdi:battery-charging
            show_state: false
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: input_boolean.turn_on
              target:
                entity_id: input_boolean.ev_rob_direct_laden
          - type: button
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(33, 150, 243, 0.18), rgba(33, 150, 243, 0.18)), var(--card-background-color); }
            name: Opladen uitzetten
            icon: mdi:battery-off
            show_state: false
            grid_options:
              columns: 6
            tap_action:
              action: perform-action
              perform_action: input_boolean.turn_off
              target:
                entity_id: input_boolean.ev_rob_direct_laden
          - type: tile
            card_mod:
              style: |
                ha-card { background: linear-gradient(rgba(33, 150, 243, 0.18), rgba(33, 150, 243, 0.18)), var(--card-background-color); }
            entity: sensor.ev_rob_vermogen_kw
            name: Vermogen
            icon: mdi:flash
            grid_options:
              columns: 12
