# templates/tapwater_decisions.yaml
# Beslissings-helpers voor tapwater-automaties (extractie uit automations.yaml).
- binary_sensor:

  - name: "Zon-forecast volgend uur voldoende"
    unique_id: "zon_forecast_uur_voldoende"
    icon: mdi:weather-sunny
    state: >
      {% set fc =
        (states('sensor.energy_next_hour') | float(0)) +
        (states('sensor.energy_next_hour_2') | float(0)) +
        (states('sensor.energy_next_hour_3') | float(0)) %}
      {% set drempel = states('input_number.zon_forecast_drempel_kwh') | float(2.0) %}
      {{ fc >= drempel }}
    attributes:
      forecast_kwh: >
        {{ ((states('sensor.energy_next_hour') | float(0)) +
            (states('sensor.energy_next_hour_2') | float(0)) +
            (states('sensor.energy_next_hour_3') | float(0))) | round(2) }}
      drempel_kwh: >
        {{ states('input_number.zon_forecast_drempel_kwh') | float(2.0) }}

  - name: "Goedkoopste nachtuur nu"
    unique_id: "goedkoopste_nachtuur_nu"
    icon: mdi:weather-night
    state: >
      {# Kwartierprecisie (14-10-2026): Zonneplan varieert per 15 min, niet
         per uur. Was eerder uur-gebaseerd met een dt >= now()-filter dat
         het lopende kwartier/uur al uitsloot zodra het begon — zelfde
         "verschuift exact op het kritieke moment"-bug als bij de
         warmtepomp-macro's (zie custom_templates/warmtepomp_macros.jinja).
         Fix: filter op p_end > now() (kwartier pas uitsluiten als het echt
         voorbij is) en check of "nu" binnen het beste kwartier-interval valt
         i.p.v. alleen hetzelfde uur. #}
      {% set forecast = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
      {% if forecast %}
        {% set ns = namespace(min_price=none, best_start=none, best_end=none) %}
        {% for p in forecast %}
          {% set p_start = as_datetime(p.start_date) | as_local %}
          {% set p_end = as_datetime(p.end_date) | as_local %}
          {% set hr = p_start.hour %}
          {% if (hr >= 22 or hr < 6) and p_end > now() %}
            {% set prijs = p.price_tax_included.amount %}
            {% if ns.min_price is none or prijs < ns.min_price %}
              {% set ns.min_price = prijs %}
              {% set ns.best_start = p_start %}
              {% set ns.best_end = p_end %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.best_start is not none and ns.best_start <= now() < ns.best_end }}
      {% else %}
        false
      {% endif %}

  - name: "Goedkoopste TDI uur nu"
    unique_id: "goedkoopste_tdi_uur_nu"
    icon: mdi:bacteria-outline
    state: >
      {# Kwartierprecisie (14-10-2026), zie toelichting bij
         "Goedkoopste nachtuur nu" hierboven. Window blijft "vanaf nu tot
         16:00 vandaag" (de 09:00-ondergrens wordt elders bewaakt door de
         automatie zelf). #}
      {% set forecast = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
      {% if forecast %}
        {% set ns = namespace(min_price=none, best_start=none, best_end=none) %}
        {% for p in forecast %}
          {% set p_start = as_datetime(p.start_date) | as_local %}
          {% set p_end = as_datetime(p.end_date) | as_local %}
          {% if p_start.date() == now().date() and p_start.hour < 16 and p_end > now() %}
            {% set prijs = p.price_tax_included.amount %}
            {% if ns.min_price is none or prijs < ns.min_price %}
              {% set ns.min_price = prijs %}
              {% set ns.best_start = p_start %}
              {% set ns.best_end = p_end %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.best_start is not none and ns.best_start <= now() < ns.best_end }}
      {% else %}
        false
      {% endif %}
