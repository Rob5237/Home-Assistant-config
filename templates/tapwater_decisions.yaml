# templates/tapwater_decisions.yaml
# Beslissings-helpers voor tapwater-automaties (extractie uit automations.yaml).
- binary_sensor:

  - name: "Zon-forecast volgend uur voldoende"
    unique_id: "zon_forecast_uur_voldoende"
    icon: mdi:weather-sunny
    state: >
      {% set fc =
        (states('sensor.energy_next_hour') | float(0)) +
        (states('sensor.energy_next_hour_2') | float(0)) +
        (states('sensor.energy_next_hour_3') | float(0)) %}
      {% set drempel = states('input_number.zon_forecast_drempel_kwh') | float(2.0) %}
      {{ fc >= drempel }}
    attributes:
      forecast_kwh: >
        {{ ((states('sensor.energy_next_hour') | float(0)) +
            (states('sensor.energy_next_hour_2') | float(0)) +
            (states('sensor.energy_next_hour_3') | float(0))) | round(2) }}
      drempel_kwh: >
        {{ states('input_number.zon_forecast_drempel_kwh') | float(2.0) }}

# Kwartierprecisie + COP (14-10-2026): de boiler is bij hogere buitentemp
# zuiniger (hogere COP), net als bij CV-verwarming — "goedkoopste moment"
# voor tapwater moet dus ook prijs ÷ COP optimaliseren, niet alleen de
# kale stroomprijs. Vereist een weersverwachting (voor de COP-schatting per
# kwartier), vandaar deze trigger-based vorm (net als de warmtepomp-sensoren
# in templates/warmtepomp.yaml) i.p.v. een losse state-template.
- trigger:
    - platform: time_pattern
      minutes: "/15"
    - platform: homeassistant
      event: start
  action:
    - action: weather.get_forecasts
      target:
        entity_id: weather.thuis
      data:
        type: hourly
      response_variable: weer_forecast_tapwater
  binary_sensor:
    - name: "Goedkoopste nachtuur nu"
      unique_id: "goedkoopste_nachtuur_nu"
      icon: mdi:weather-night
      state: >
        {% from 'warmtepomp_macros.jinja' import bereken_dhw_kwartieren, beste_nachtmoment %}
        {% set weer = weer_forecast_tapwater['weather.thuis'].forecast %}
        {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
        {% if weer and prijzen %}
          {% set uren = bereken_dhw_kwartieren(prijzen, weer, 57) | from_json %}
          {% set best = beste_nachtmoment(uren) | from_json %}
          {% if best.gevonden %}
            {{ as_datetime(best.start) <= now() < as_datetime(best.einde) }}
          {% else %}
            false
          {% endif %}
        {% else %}
          false
        {% endif %}
      attributes:
        kosten_per_kwh_warmte: >
          {% from 'warmtepomp_macros.jinja' import bereken_dhw_kwartieren, beste_nachtmoment %}
          {% set weer = weer_forecast_tapwater['weather.thuis'].forecast %}
          {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
          {% if weer and prijzen %}
            {% set uren = bereken_dhw_kwartieren(prijzen, weer, 57) | from_json %}
            {% set best = beste_nachtmoment(uren) | from_json %}
            {{ best.kosten_warmte if best.gevonden else none }}
          {% else %}
            {{ none }}
          {% endif %}
        goedkoopste_moment: >
          {% from 'warmtepomp_macros.jinja' import bereken_dhw_kwartieren, beste_nachtmoment %}
          {% set weer = weer_forecast_tapwater['weather.thuis'].forecast %}
          {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
          {% if weer and prijzen %}
            {% set uren = bereken_dhw_kwartieren(prijzen, weer, 57) | from_json %}
            {% set best = beste_nachtmoment(uren) | from_json %}
            {{ best.label if best.gevonden else 'onbekend' }}
          {% else %}
            onbekend
          {% endif %}

    - name: "Goedkoopste TDI uur nu"
      unique_id: "goedkoopste_tdi_uur_nu"
      icon: mdi:bacteria-outline
      state: >
        {% from 'warmtepomp_macros.jinja' import bereken_dhw_kwartieren %}
        {% set weer = weer_forecast_tapwater['weather.thuis'].forecast %}
        {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
        {% if weer and prijzen %}
          {% set uren = bereken_dhw_kwartieren(prijzen, weer, 65) | from_json %}
          {% set vandaag = now().strftime('%Y-%m-%d') %}
          {% set venster = uren | selectattr('dag', 'equalto', vandaag) | selectattr('uur', 'lt', 16) | list %}
          {% if venster %}
            {% set best = venster | min(attribute='kosten_warmte') %}
            {{ as_datetime(best.start) <= now() < as_datetime(best.einde) }}
          {% else %}
            false
          {% endif %}
        {% else %}
          false
        {% endif %}
      attributes:
        kosten_per_kwh_warmte: >
          {% from 'warmtepomp_macros.jinja' import bereken_dhw_kwartieren %}
          {% set weer = weer_forecast_tapwater['weather.thuis'].forecast %}
          {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
          {% if weer and prijzen %}
            {% set uren = bereken_dhw_kwartieren(prijzen, weer, 65) | from_json %}
            {% set vandaag = now().strftime('%Y-%m-%d') %}
            {% set venster = uren | selectattr('dag', 'equalto', vandaag) | selectattr('uur', 'lt', 16) | list %}
            {{ (venster | min(attribute='kosten_warmte')).kosten_warmte if venster else none }}
          {% else %}
            {{ none }}
          {% endif %}
        goedkoopste_moment: >
          {% from 'warmtepomp_macros.jinja' import bereken_dhw_kwartieren %}
          {% set weer = weer_forecast_tapwater['weather.thuis'].forecast %}
          {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
          {% if weer and prijzen %}
            {% set uren = bereken_dhw_kwartieren(prijzen, weer, 65) | from_json %}
            {% set vandaag = now().strftime('%Y-%m-%d') %}
            {% set venster = uren | selectattr('dag', 'equalto', vandaag) | selectattr('uur', 'lt', 16) | list %}
            {{ (venster | min(attribute='kosten_warmte')).label if venster else 'onbekend' }}
          {% else %}
            onbekend
          {% endif %}
