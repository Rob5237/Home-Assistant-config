# templates/warmtepomp.yaml
#
# COP-sensoren + optimaal_startuur. Stooklijn- en COP-formules zitten in
# custom_templates/warmtepomp_macros.jinja zodat ze niet 3x worden herhaald
# in dit bestand. Na wijziging van macros: aanroepen via
# `homeassistant.reload_custom_jinja` + `homeassistant.reload_templates`.
- sensor:

  - name: "Warmtepomp COP Verwarming"
    unique_id: "warmtepomp_cop_verwarming"
    unit_of_measurement: ""
    state_class: measurement
    icon: mdi:heat-pump
    state: >
      {% set warmte = states('sensor.luxtronik_280807_0450_heat_amount_heating') | float(0) %}
      {% set input = states('sensor.luxtronik_280807_0450_heat_energy_input') | float(0) %}
      {% if input > 0 %}
        {{ (warmte / input) | round(2) }}
      {% else %}
        {{ 'unavailable' }}
      {% endif %}
    attributes:
      buitentemperatuur: >
        {{ states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(None) }}

  - name: "Warmtepomp COP Tapwater"
    unique_id: "warmtepomp_cop_tapwater"
    unit_of_measurement: ""
    state_class: measurement
    icon: mdi:water-boiler
    state: >
      {% set warmte = states('sensor.luxtronik_280807_0450_dhw_heat_amount') | float(0) %}
      {% set input = states('sensor.luxtronik_280807_0450_dhw_energy_input') | float(0) %}
      {% if input > 0 %}
        {{ (warmte / input) | round(2) }}
      {% else %}
        {{ 'unavailable' }}
      {% endif %}
    attributes:
      buitentemperatuur: >
        {{ states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(None) }}

  # Daily/monthly DHW COP via utility_meter deltas (packages/energy_meters.yaml).
  # Guard input > 0.3 kWh voorkomt divergerende COP aan begin van de dag/maand
  # (baseline standby ~0.4 kWh/dag zonder warmte-output = 0/klein).
  - name: "Warmtepomp COP Tapwater Dag"
    unique_id: "warmtepomp_cop_tapwater_dag"
    unit_of_measurement: ""
    state_class: measurement
    icon: mdi:water-boiler
    state: >
      {% set warmte = states('sensor.dhw_heat_dagelijks') | float(0) %}
      {% set input = states('sensor.dhw_input_dagelijks') | float(0) %}
      {% if input > 0.3 %}
        {{ (warmte / input) | round(2) }}
      {% else %}
        {{ 'unavailable' }}
      {% endif %}
    attributes:
      warmte_kwh: "{{ states('sensor.dhw_heat_dagelijks') | float(0) | round(2) }}"
      input_kwh: "{{ states('sensor.dhw_input_dagelijks') | float(0) | round(2) }}"

  - name: "Warmtepomp COP Tapwater Maand"
    unique_id: "warmtepomp_cop_tapwater_maand"
    unit_of_measurement: ""
    state_class: measurement
    icon: mdi:water-boiler
    state: >
      {% set warmte = states('sensor.dhw_heat_maandelijks') | float(0) %}
      {% set input = states('sensor.dhw_input_maandelijks') | float(0) %}
      {% if input > 1.0 %}
        {{ (warmte / input) | round(2) }}
      {% else %}
        {{ 'unavailable' }}
      {% endif %}
    attributes:
      warmte_kwh: "{{ states('sensor.dhw_heat_maandelijks') | float(0) | round(1) }}"
      input_kwh: "{{ states('sensor.dhw_input_maandelijks') | float(0) | round(1) }}"

  # Compressor cycli deze maand (sum van bestaande dag/nacht tellers).
  # Gebruik voor pendel-detectie en solar-shift KPI (nacht/dag ratio).
  - name: "Warmtepomp compressor-starts maand"
    unique_id: "warmtepomp_compressor_starts_maand"
    unit_of_measurement: "starts"
    state_class: measurement
    icon: mdi:counter
    state: >
      {{ (states('input_number.compressor_starts_dag') | int(0))
       + (states('input_number.compressor_starts_nacht') | int(0)) }}
    attributes:
      dag: "{{ states('input_number.compressor_starts_dag') | int(0) }}"
      nacht: "{{ states('input_number.compressor_starts_nacht') | int(0) }}"
      nacht_pct: >
        {% set d = states('input_number.compressor_starts_dag') | int(0) %}
        {% set n = states('input_number.compressor_starts_nacht') | int(0) %}
        {% if d + n > 0 %}{{ ((n / (d + n)) * 100) | round(0) }}{% else %}0{% endif %}

  - name: "Warmtepomp COP Totaal"
    unique_id: "warmtepomp_cop_totaal"
    unit_of_measurement: ""
    state_class: measurement
    icon: mdi:heat-pump-outline
    state: >
      {% set warmte_v = states('sensor.luxtronik_280807_0450_heat_amount_heating') | float(0) %}
      {% set warmte_t = states('sensor.luxtronik_280807_0450_dhw_heat_amount') | float(0) %}
      {% set input_v = states('sensor.luxtronik_280807_0450_heat_energy_input') | float(0) %}
      {% set input_t = states('sensor.luxtronik_280807_0450_dhw_energy_input') | float(0) %}
      {% set totaal_input = input_v + input_t %}
      {% if totaal_input > 0 %}
        {{ ((warmte_v + warmte_t) / totaal_input) | round(2) }}
      {% else %}
        {{ 'unavailable' }}
      {% endif %}
    attributes:
      buitentemperatuur: >
        {{ states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(None) }}

  - name: "Warmtepomp COP Geschat"
    unique_id: "warmtepomp_cop_geschat"
    unit_of_measurement: ""
    state_class: measurement
    icon: mdi:heat-pump
    state: >
      {% from 'warmtepomp_macros.jinja' import cop %}
      {% set t = states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(none) %}
      {% set t_aanvoer = states('sensor.luxtronik_280807_0450_flow_in_temperature') | float(none) %}
      {% if t is not none and t_aanvoer is not none and (t_aanvoer - t) >= 10 %}
        {{ cop(t_aanvoer, t) | float | round(2) }}
      {% else %}
        {{ 'unavailable' }}
      {% endif %}
    attributes:
      buitentemperatuur: >
        {{ states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(None) }}
      aanvoertemperatuur: >
        {{ states('sensor.luxtronik_280807_0450_flow_in_temperature') | float(None) }}

  - name: "Warmtepomp Pre-17 Tijdelijke Verhoging"
    unique_id: "warmtepomp_pre17_tijdelijke_verhoging"
    icon: mdi:thermometer-chevron-up
    state: >
      {% if states('input_number.warmtepomp_kamertemp_backup') | float(0) > 0.01 %}
        {{ state_attr('climate.luxtronik_280807_0450_heating', 'temperature') }}
      {% else %}
        Niet actief
      {% endif %}

  - name: "Warmtepomp Pre-17 Normale Temperatuur"
    unique_id: "warmtepomp_pre17_normale_temperatuur"
    icon: mdi:thermometer
    unit_of_measurement: "°C"
    state: >
      {% if states('input_number.warmtepomp_kamertemp_backup') | float(0) > 0.01 %}
        {{ states('input_number.warmtepomp_kamertemp_backup') }}
      {% else %}
        {{ state_attr('climate.luxtronik_280807_0450_heating', 'temperature') }}
      {% endif %}

  - name: "Warmtepomp Pre-17 Zoekvenster Start"
    unique_id: "warmtepomp_pre17_zoekvenster_start"
    icon: mdi:clock-start
    state: >
      {{ '%02d:00' | format(state_attr('sensor.warmtepomp_optimaal_startuur_middag', 'middag_start_uur') | int(12)) }}

# Kwartierprecisie (14-10-2026): was hours:"/1" (eens per uur). De
# consumerende automaties (warmtepomp_pre17_buffer_start, warmtepomp_goedkoop_
# uur_opwarmen) checken sinds de kwartier-migratie elke minuut op een exacte
# HH:MM-match — met een sensor die maar eens per uur herberekent, bleef het
# weergegeven "optimale moment" de rest van het uur stilstaan (verwarrend,
# ook al is de eenmaal-per-uur-berekening zelf correct omdat Zonneplan-
# dagprijzen toch al vooraf vastliggen). Elke 15 min herberekenen houdt
# weergave en beslissing consistent.
- trigger:
    - platform: time_pattern
      minutes: "/15"
    - platform: homeassistant
      event: start
  action:
    - action: weather.get_forecasts
      target:
        entity_id: weather.thuis
      data:
        type: hourly
      response_variable: weer_forecast
  sensor:
    - name: "Warmtepomp Optimaal Startuur"
      unique_id: "warmtepomp_optimaal_startuur"
      icon: mdi:clock-start
      state: >
        {% from 'warmtepomp_macros.jinja' import bereken_kwartieren %}
        {% set weer = weer_forecast['weather.thuis'].forecast %}
        {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
        {% if weer and prijzen %}
          {% set t_min = states('number.luxtronik_280807_0450_heating_min_flow_out_temperature') | float(19) %}
          {% set t_max = states('number.luxtronik_280807_0450_heating_curve_end_temperature') | float(35) %}
          {% set t_drempel = states('number.luxtronik_280807_0450_heating_threshold_temperature') | float(14) %}
          {% set uren = bereken_kwartieren(prijzen, weer, t_min, t_max, t_drempel) | from_json %}
          {% if uren %}
            {% set best = uren | min(attribute='kosten_warmte') %}
            {{ '%02d:%02d' | format(best.uur, best.kwartier) }}
          {% else %}
            onbekend
          {% endif %}
        {% else %}
          onbekend
        {% endif %}
      attributes:
        kosten_per_kwh_warmte: >
          {% from 'warmtepomp_macros.jinja' import bereken_kwartieren %}
          {% set weer = weer_forecast['weather.thuis'].forecast %}
          {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
          {% if weer and prijzen %}
            {% set t_min = states('number.luxtronik_280807_0450_heating_min_flow_out_temperature') | float(19) %}
            {% set t_max = states('number.luxtronik_280807_0450_heating_curve_end_temperature') | float(35) %}
            {% set t_drempel = states('number.luxtronik_280807_0450_heating_threshold_temperature') | float(14) %}
            {% set uren = bereken_kwartieren(prijzen, weer, t_min, t_max, t_drempel) | from_json %}
            {% if uren %}
              {{ (uren | min(attribute='kosten_warmte')).kosten_warmte }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            {{ none }}
          {% endif %}
        tdi_dagen_geleden: >
          {% set s = states('input_datetime.tdi_laatste_start') %}
          {% if s in ('unknown', 'unavailable') %}
            999
          {% else %}
            {{ (now().date() - (as_datetime(s) | as_local).date()).days }}
          {% endif %}
        tdi_kandidaat_uur: >
          {% from 'warmtepomp_macros.jinja' import bereken_tdi_kwartieren %}
          {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
          {% set weer = weer_forecast['weather.thuis'].forecast %}
          {% set s = states('input_datetime.tdi_laatste_start') %}
          {% set tdi_dagen = (now().date() - (as_datetime(s) | as_local).date()).days if s not in ('unknown', 'unavailable') else 999 %}
          {% if prijzen and weer %}
            {% set tdi_uren = bereken_tdi_kwartieren(prijzen, weer, tdi_dagen) | from_json %}
            {% if tdi_uren %}
              {{ (tdi_uren | min(attribute='kosten_warmte')).label }}
            {% else %}
              {{ 'buiten venster (nog ' ~ (7 - tdi_dagen) ~ ' dagen)' }}
            {% endif %}
          {% else %}
            onbekend
          {% endif %}
        uurlijks_overzicht: >
          {% from 'warmtepomp_macros.jinja' import bereken_kwartieren, bereken_tdi_kwartieren %}
          {% set weer = weer_forecast['weather.thuis'].forecast %}
          {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
          {% if weer and prijzen %}
            {% set t_min = states('number.luxtronik_280807_0450_heating_min_flow_out_temperature') | float(19) %}
            {% set t_max = states('number.luxtronik_280807_0450_heating_curve_end_temperature') | float(35) %}
            {% set t_drempel = states('number.luxtronik_280807_0450_heating_threshold_temperature') | float(14) %}
            {% set s = states('input_datetime.tdi_laatste_start') %}
            {% set tdi_dagen = (now().date() - (as_datetime(s) | as_local).date()).days if s not in ('unknown', 'unavailable') else 999 %}
            {% set uren = bereken_kwartieren(prijzen, weer, t_min, t_max, t_drempel) | from_json %}
            {% set tdi_uren = bereken_tdi_kwartieren(prijzen, weer, tdi_dagen) | from_json %}
            {% set tdi_best = (tdi_uren | min(attribute='kosten_warmte')) if tdi_uren else none %}
            {% set tdi_dag = tdi_best.dag if tdi_best else '' %}
            {% set tdi_uur = tdi_best.uur if tdi_best else -1 %}
            {% set tdi_kwartier = tdi_best.kwartier if tdi_best else -1 %}
            {% set ns = namespace(uren=[]) %}
            {% for u in uren %}
              {% set ns.uren = ns.uren + [{
                'uur': u.label,
                'temp': u.temp,
                'aanvoer': u.aanvoer,
                'cop': u.cop_geschat,
                'prijs': u.prijs,
                'kosten_warmte': u.kosten_warmte,
                'tdi_kandidaat': u.dag == tdi_dag and u.uur == tdi_uur and u.kwartier == tdi_kwartier
              }] %}
            {% endfor %}
            {{ ns.uren }}
          {% else %}
            {{ [] }}
          {% endif %}

    # Zelfde kosten_warmte-berekening (prijs × geschatte COP) als hierboven,
    # maar gefilterd op vandaag, venster [middag_start_uur, 17). Doel:
    # goedkoopste moment om de vloer thermisch op te laden vóór de dure uren
    # vanaf 17:00 (zie warmtepomp_pre17_buffer_start/einde in automations.yaml).
    # Losstaand van het dagbrede optimaal_startuur, dat bv. ook een nachtuur
    # kan kiezen.
    #
    # middag_start_uur schuift naar voren (vroeger op de dag) naarmate het
    # kouder is buiten — vloerverwarming warmt trager op bij kou, dus eerder
    # starten vergroot de kans dat 21°C echt gehaald wordt om 17:00. Heuristische
    # clamp-formule (zelfde stijl als window_min in warmtepomp_goedkoop_uur_opwarmen),
    # GEEN gekalibreerd model: daarvoor ontbreekt historische data bij koud
    # weer (recorder-geschiedenis start 2026-09-28, enkel mild herfstweer
    # gezien). Zodra er een winter met koude dagen is gelogd, kan dit vervangen
    # worden door een empirisch gefit model (opwarmsnelheid °C/uur vs.
    # buitentemp, af te leiden uit sensor.luxtronik_280807_0450_room_thermostat_temperature
    # + sensor.luxtronik_280807_0450_outdoor_temperature historie).
    # Bij t_buiten >= t_drempel: 5 uur vooraf (venster blijft 12:00-16:00,
    # ongewijzigd t.o.v. het oorspronkelijke vaste venster). Bij t_buiten ver
    # onder t_drempel: oploop tot 8 uur vooraf (venster vanaf 09:00), geclampt
    # zodat het niet overlapt met het TDI-venster vóór 09:00.
    - name: "Warmtepomp Optimaal Startuur Middag"
      unique_id: "warmtepomp_optimaal_startuur_middag"
      icon: mdi:clock-start
      state: >
        {% from 'warmtepomp_macros.jinja' import bereken_kwartieren, bepaal_middag_venster %}
        {% set weer = weer_forecast['weather.thuis'].forecast %}
        {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
        {% if weer and prijzen %}
          {% set t_min = states('number.luxtronik_280807_0450_heating_min_flow_out_temperature') | float(19) %}
          {% set t_max = states('number.luxtronik_280807_0450_heating_curve_end_temperature') | float(35) %}
          {% set t_drempel = states('number.luxtronik_280807_0450_heating_threshold_temperature') | float(14) %}
          {% set uren = bereken_kwartieren(prijzen, weer, t_min, t_max, t_drempel) | from_json %}
          {% set venster = bepaal_middag_venster(uren, weer, t_drempel) | from_json %}
          {% if venster.gevonden %}
            {{ '%02d:%02d' | format(venster.uur, venster.kwartier) }}
          {% else %}
            onbekend
          {% endif %}
        {% else %}
          onbekend
        {% endif %}
      attributes:
        middag_start_uur: >
          {% from 'warmtepomp_macros.jinja' import bereken_kwartieren, bepaal_middag_venster %}
          {% set weer = weer_forecast['weather.thuis'].forecast %}
          {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
          {% if weer and prijzen %}
            {% set t_min = states('number.luxtronik_280807_0450_heating_min_flow_out_temperature') | float(19) %}
            {% set t_max = states('number.luxtronik_280807_0450_heating_curve_end_temperature') | float(35) %}
            {% set t_drempel = states('number.luxtronik_280807_0450_heating_threshold_temperature') | float(14) %}
            {% set uren = bereken_kwartieren(prijzen, weer, t_min, t_max, t_drempel) | from_json %}
            {% set venster = bepaal_middag_venster(uren, weer, t_drempel) | from_json %}
            {% if venster.gevonden %}
              {{ venster.middag_start_uur }}
            {% else %}
              {% set t_buiten = states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(10) %}
              {% set uren_vooraf = [[5, 5 + (t_drempel - t_buiten) / 8] | max, 8] | min %}
              {{ ((17 - uren_vooraf) | round | int) }}
            {% endif %}
          {% else %}
            {% set t_drempel = states('number.luxtronik_280807_0450_heating_threshold_temperature') | float(14) %}
            {% set t_buiten = states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(10) %}
            {% set uren_vooraf = [[5, 5 + (t_drempel - t_buiten) / 8] | max, 8] | min %}
            {{ ((17 - uren_vooraf) | round | int) }}
          {% endif %}
        laatste_start_uur: >
          {# Nieuw (15-10-2026): bovengrens van het venster — later starten
             dan dit uur laat te weinig tijd over om vóór 17:00 op te warmen.
             Nog NIET gekalibreerd aan echte opwarmdata, zie macro-toelichting
             in warmtepomp_macros.jinja. #}
          {% from 'warmtepomp_macros.jinja' import bereken_kwartieren, bepaal_middag_venster %}
          {% set weer = weer_forecast['weather.thuis'].forecast %}
          {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
          {% if weer and prijzen %}
            {% set t_min = states('number.luxtronik_280807_0450_heating_min_flow_out_temperature') | float(19) %}
            {% set t_max = states('number.luxtronik_280807_0450_heating_curve_end_temperature') | float(35) %}
            {% set t_drempel = states('number.luxtronik_280807_0450_heating_threshold_temperature') | float(14) %}
            {% set uren = bereken_kwartieren(prijzen, weer, t_min, t_max, t_drempel) | from_json %}
            {% set venster = bepaal_middag_venster(uren, weer, t_drempel) | from_json %}
            {% if venster.gevonden %}
              {{ venster.laatste_start_uur }}
            {% else %}
              {% set t_buiten = states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(10) %}
              {% set uren_vooraf_min = [[2, 2 + (t_drempel - t_buiten) / 16] | max, 4] | min %}
              {{ ((17 - uren_vooraf_min) | round | int) }}
            {% endif %}
          {% else %}
            {% set t_drempel = states('number.luxtronik_280807_0450_heating_threshold_temperature') | float(14) %}
            {% set t_buiten = states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(10) %}
            {% set uren_vooraf_min = [[2, 2 + (t_drempel - t_buiten) / 16] | max, 4] | min %}
            {{ ((17 - uren_vooraf_min) | round | int) }}
          {% endif %}
        venster_dag: >
          {% from 'warmtepomp_macros.jinja' import bereken_kwartieren, bepaal_middag_venster %}
          {% set weer = weer_forecast['weather.thuis'].forecast %}
          {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
          {% if weer and prijzen %}
            {% set t_min = states('number.luxtronik_280807_0450_heating_min_flow_out_temperature') | float(19) %}
            {% set t_max = states('number.luxtronik_280807_0450_heating_curve_end_temperature') | float(35) %}
            {% set t_drempel = states('number.luxtronik_280807_0450_heating_threshold_temperature') | float(14) %}
            {% set uren = bereken_kwartieren(prijzen, weer, t_min, t_max, t_drempel) | from_json %}
            {% set venster = bepaal_middag_venster(uren, weer, t_drempel) | from_json %}
            {% if venster.gevonden %}
              {% if venster.dag == now().strftime('%Y-%m-%d') %}
                vandaag
              {% elif venster.dag == (now() + timedelta(days=1)).strftime('%Y-%m-%d') %}
                morgen
              {% else %}
                {{ venster.dag }}
              {% endif %}
            {% else %}
              onbekend
            {% endif %}
          {% else %}
            onbekend
          {% endif %}
        kosten_per_kwh_warmte: >
          {% from 'warmtepomp_macros.jinja' import bereken_kwartieren, bepaal_middag_venster %}
          {% set weer = weer_forecast['weather.thuis'].forecast %}
          {% set prijzen = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
          {% if weer and prijzen %}
            {% set t_min = states('number.luxtronik_280807_0450_heating_min_flow_out_temperature') | float(19) %}
            {% set t_max = states('number.luxtronik_280807_0450_heating_curve_end_temperature') | float(35) %}
            {% set t_drempel = states('number.luxtronik_280807_0450_heating_threshold_temperature') | float(14) %}
            {% set uren = bereken_kwartieren(prijzen, weer, t_min, t_max, t_drempel) | from_json %}
            {% set venster = bepaal_middag_venster(uren, weer, t_drempel) | from_json %}
            {% if venster.gevonden %}
              {{ venster.kosten_warmte }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            {{ none }}
          {% endif %}

# DHW delta-T bij compressor-start: 57 - DHW-temp op moment van compressor
# off→on. Hoge waarde (>10K) = diepe ontlading vóór start = lange cyclus in
# koude tank = mindere gemiddelde COP. Streefwaarde na drempel-verhoging
# 47→52 in klein-overschot: 5-10K.
# Trigger-based template: alleen ge-update bij DHW-cyclusstart (dhw_target>55).
# In winter met heating cycli (dhw_target blijft 50) blijft de sensor stabiel
# tot volgende echte DHW-cyclus. Restore state overleeft HA-restart.
- trigger:
  - platform: state
    entity_id: binary_sensor.luxtronik_280807_0450_compressor
    from: "off"
    to: "on"
  condition:
  - condition: numeric_state
    entity_id: number.luxtronik_280807_0450_dhw_target_temperature
    above: 55
  sensor:
  - name: "DHW delta-T bij compressor-start"
    unique_id: dhw_delta_t_bij_compressor_start
    unit_of_measurement: "K"
    state_class: measurement
    icon: mdi:delta
    state: >
      {% set target = states('number.luxtronik_280807_0450_dhw_target_temperature') | float(57) %}
      {% set dhw = states('sensor.luxtronik_280807_0450_dhw_temperature') | float(57) %}
      {{ (target - dhw) | round(1) }}
    attributes:
      dhw_bij_start: "{{ states('sensor.luxtronik_280807_0450_dhw_temperature') | float(0) | round(1) }}"
      setpoint_bij_start: "{{ states('number.luxtronik_280807_0450_dhw_target_temperature') | float(0) | round(1) }}"
      dhw_mode: "{{ states('select.luxtronik_280807_0450_dhw_mode') }}"
      buiten: "{{ states('sensor.luxtronik_280807_0450_outdoor_temperature') | float(0) | round(1) }}"
      tijd: "{{ now().strftime('%Y-%m-%d %H:%M') }}"

# DHW-cycli vandaag: telt off→on transities met dhw_target > 55 (= DHW-boost
# actief, niet heating). Reset dagelijks om 00:00. Als er tijdens een cyclus
# HA herstart, blijft de teller-waarde behouden (trigger-based sensors
# restoren state).
- trigger:
  - id: cyclus_start
    platform: state
    entity_id: binary_sensor.luxtronik_280807_0450_compressor
    from: "off"
    to: "on"
  - id: dagreset
    platform: time
    at: "00:00:00"
  condition:
  - condition: or
    conditions:
    - condition: trigger
      id: dagreset
    - condition: and
      conditions:
      - condition: trigger
        id: cyclus_start
      - condition: numeric_state
        entity_id: number.luxtronik_280807_0450_dhw_target_temperature
        above: 55
  sensor:
  - name: "DHW cycli vandaag"
    unique_id: dhw_cycli_vandaag
    unit_of_measurement: "cycli"
    state_class: measurement
    icon: mdi:counter
    state: >
      {% if trigger.id == 'dagreset' %}
        0
      {% else %}
        {{ (this.state | int(0)) + 1 }}
      {% endif %}

# Beslissing: is er genoeg koude-weer-geschiedenis gelogd om de heuristische
# pre-17:00 buffer-formule (middag_start_uur hierboven) te vervangen door een
# echt empirisch model? Bron: packages/warmtepomp_data_analyse.yaml (SQL-query
# op de recorder-database). Drempels zijn ruwe vuistregels, geen harde eis:
# 500 samples <5°C ≈ meerdere dagen cumulatieve koude-blootstelling bij de
# ~7 min logfrequentie van deze sensor; laagste_buitentemp ≤2°C bevestigt dat
# er echt een koudeperiode bij zat, niet alleen een paar frisse ochtenden.
- binary_sensor:
  - name: "Warmtepomp Data-analyse Zinvol"
    unique_id: "warmtepomp_data_analyse_zinvol"
    icon: mdi:chart-line
    state: >
      {{ (states('sensor.warmtepomp_data_analyse_koude_samples') | int(0)) >= 500
         and (states('sensor.warmtepomp_data_analyse_laagste_buitentemp_ooit_gelogd') | float(99)) <= 2.0 }}
    attributes:
      koude_samples: "{{ states('sensor.warmtepomp_data_analyse_koude_samples') }}"
      laagste_buitentemp: "{{ states('sensor.warmtepomp_data_analyse_laagste_buitentemp_ooit_gelogd') }}"
